<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>刷题平台 · 课程题库与随机练习</title>
  <link rel="icon" type="image/svg+xml" href="./assets/pixel/cards.svg">
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <div class="hero-copy">
        <p class="eyebrow">Quiz Platform · 学习终端</p>
        <h1>课程题库<br><span class="hl">随机刷题</span></h1>
        <p class="hero-desc">支持课程分组、文本导入、AI 图片识别、随机不重复刷题与错题追踪。</p>
      </div>
      <div class="hero-side">
        <div class="hero-stickers" aria-hidden="true">
          <img class="pixel-sticker sticker-cards" src="./assets/pixel/cards.svg" alt="" width="116" height="116">
          <img class="pixel-sticker sticker-pencil" src="./assets/pixel/pencil.svg" alt="" width="78" height="78">
        </div>
        <div class="metric">
          <strong id="questionCount">0</strong>
          <span>当前课程题数</span>
        </div>
      </div>
    </header>

    <section class="toolbar" aria-label="课程管理">
      <label class="field">
        <span class="field-label">当前课程</span>
        <select id="courseSelect"></select>
      </label>
      <label class="field">
        <span class="field-label">新建课程</span>
        <input id="courseName" placeholder="输入课程名称">
      </label>
      <div class="toolbar-actions">
        <button id="addCourseBtn">新增课程</button>
        <button id="deleteCourseBtn" class="ghost">删除课程</button>
      </div>
    </section>

    <nav class="tabs" aria-label="功能导航">
      <button class="active" data-tab="importPanel">导入</button>
      <button data-tab="practicePanel">刷题</button>
      <button data-tab="reviewPanel">复习</button>
      <button data-tab="bankPanel">题库</button>
    </nav>

    <section id="importPanel" class="panel active">
      <h2>导入题目</h2>
      <textarea id="sourceText" placeholder="1. 题干&#10;A. 选项&#10;B. 选项&#10;答案：A&#10;解析：可选"></textarea>
      <div class="actions">
        <button id="sampleBtn" class="ghost">示例</button>
        <button id="importTextBtn">文本导入</button>
        <label class="file-pick">
          <input id="imageInput" type="file" accept="image/*">
          <span class="file-pick-text">选择图片</span>
        </label>
        <button id="aiBtn" class="ghost">AI 识别图片</button>
      </div>
      <p id="status" class="status"></p>
      <div id="importResult" class="import-result"></div>
    </section>

    <section id="practicePanel" class="panel">
      <div class="practice-head">
        <h2>随机刷题</h2>
        <button id="resetRoundBtn" class="ghost">重置本轮</button>
      </div>
      <div class="practice-mode-bar">
        <span class="practice-mode-label">刷题模式</span>
        <label class="practice-mode-option">
          <input type="radio" name="practiceMode" value="all" checked><span>全部题目</span>
        </label>
        <label class="practice-mode-option">
          <input type="radio" name="practiceMode" value="count"><span>指定数量</span>
        </label>
        <label class="practice-mode-option">
          <input type="radio" name="practiceMode" value="wrong"><span>错题重做</span>
        </label>
        <label class="practice-mode-option">
          <input type="radio" name="practiceMode" value="exam"><span>限时模拟</span>
        </label>
        <input id="practiceCountInput" type="number" min="1" value="10" class="practice-count-input" style="display:none">
        <span id="practiceCountHint" class="practice-count-hint" style="display:none">题</span>
        <span id="examTimeControls" class="exam-time-controls" style="display:none">
          <input id="examMinutesInput" type="number" min="1" value="20" class="practice-count-input">
          <span class="practice-count-hint">分钟</span>
        </span>
      </div>
      <p id="roundInfo"></p>
      <div id="roundBoundary" class="round-boundary"></div>
      <div id="accuracy" class="accuracy"></div>
      <div class="feedback-settings">
        <label><input id="showAnswerToggle" type="checkbox" checked><span>答后显示正确答案</span></label>
        <label><input id="showExplanationToggle" type="checkbox" checked><span>答后显示解析</span></label>
        <label><input id="autoNextToggle" type="checkbox"><span>答对自动下一题</span></label>
        <label><input id="shuffleOptionsToggle" type="checkbox"><span>选项乱序</span></label>
      </div>
      <article id="quizCard" class="quiz-card"></article>
      <div class="sticky-actions" id="stickyActions">
        <button id="submitBtn">提交答案</button>
        <button id="prevBtn" class="ghost" style="display:none">上一题</button>
        <button id="nextBtn">下一题</button>
        <button id="finishExamBtn" class="ghost" style="display:none">结束模拟</button>
      </div>
    </section>

    <section id="reviewPanel" class="panel">
      <div class="review-head">
        <h2>复习分析</h2>
        <div class="review-actions">
          <button data-review-action="practice-wrong">开始错题重做</button>
          <button class="ghost" data-review-action="open-wrong-bank">打开错题列表</button>
        </div>
      </div>
      <div id="reviewInsights" class="review-insights"></div>
    </section>

    <section id="bankPanel" class="panel">
      <h2>题库管理</h2>
      <div id="bankToolbar" class="bank-toolbar"></div>
      <div id="bankList" class="bank-list"></div>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
