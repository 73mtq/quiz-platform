:[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-pk8bkzqwlw","type":"choice","stem":"( )是我国长期探索经济建设和国防建设协调发展规律的重大成果，是从国家发展和安全全局出发，应对复杂安全威胁、赢得国家战略优势而实施的国家战略。","options":[{"key":"A","text":"新型举国体制"},{"key":"B","text":"强军兴军战略布局"},{"key":"C","text":"军委主席负责制"},{"key":"D","text":"军民融合发展"}],"answer":["军民融合发展"],"explanation":"正确答案：军民融合发展\n为什么对：军民融合发展把国防和军队建设融入经济社会发展体系，实现资源统筹、优势互补。它是我们党长期探索经济建设和国防建设协调发展规律的重大成果，也是从国家发展和安全全局出发，应对复杂安全威胁、赢得国家战略优势的国家战略。\n干扰项分析：“新型举国体制”是攻关关键核心技术的制度安排；“强军兴军战略布局”指向军队建设本身；“军委主席负责制”是党对军队绝对领导的根本制度，三者都不承担经济建设和国防建设协调发展的功能。\n记忆：军民融合发展，实现富国与强军相统一。\n依据：教材表述。","memoryTip":"军民融合发展，实现富国与强军相统一。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-sxrcsa0qr3d","type":"choice","stem":"2024年是中国极地考察( )周年。我国开展极地考察以来，为我国和全世界科学工作者持续探索自然奥秘、勇攀科学高峰提供有力保障。","options":[{"key":"A","text":"45"},{"key":"B","text":"30"},{"key":"C","text":"35"},{"key":"D","text":"40"}],"answer":["40"],"explanation":"正确答案：40\n为什么对：我国于1984年组织开展首次南极考察，到2024年正好40年。40年间我国极地考察能力持续增强，建成多个考察站并形成较为完整的考察布局。极地考察能力关系我国在极地事务中的话语权和资源权益，是国家综合实力的体现，因此2024年是我国极地考察40周年。\n干扰项分析：“45”“30”“35”三个数字按2024年倒推，分别对应1979年、1994年、1989年，与我国1984年首次南极考察的起点都对不上。\n记忆：一九八四年首赴南极，二〇二四年恰满四十年。\n依据：教材表述。","memoryTip":"一九八四年首赴南极，二〇二四年恰满四十年。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-jqq52v1i6d8","type":"choice","stem":"坚持以政治安全为根本，维护( )是关键。","options":[{"key":"A","text":"社会主义意识形态安全"},{"key":"B","text":"人民民主专政的国家政权安全"},{"key":"C","text":"国家发展利益"},{"key":"D","text":"中国特色社会主义制度安全"}],"answer":["社会主义意识形态安全"],"explanation":"正确答案：社会主义意识形态安全\n为什么对：政治安全关乎党和国家前途命运，意识形态领域是政治安全的前沿阵地。意识形态决定举什么旗、走什么路，守住社会主义意识形态安全，才能巩固党的执政地位和中国特色社会主义制度，因此维护意识形态安全是坚持政治安全为根本的关键。\n干扰项分析：“人民民主专政的国家政权安全”和“中国特色社会主义制度安全”是政治安全的核心内容；“国家发展利益”是政治安全所服务的利益，三者都不是题干所问的关键着力点。\n记忆：政治安全为根本，意识形态安全是关键。\n依据：教材表述。","memoryTip":"政治安全为根本，意识形态安全是关键。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-3djnc4pbup3","type":"choice","stem":"历史一再证明，一切社会进步和文明发展都是建立在( )的基础之上的。","options":[{"key":"A","text":"守正"},{"key":"B","text":"发展"},{"key":"C","text":"稳定"},{"key":"D","text":"安全"}],"answer":["发展"],"explanation":"正确答案：发展\n为什么对：发展是解决一切问题的基础和关键。物质资料生产是社会存在的前提，社会形态更替、文明成果积累都以生产力发展所提供的物质条件为基础，因此一切社会进步和文明发展都建立在发展的基础之上。\n干扰项分析：“守正”指坚持正确方向和原则；“稳定”是发展所需的环境条件；“安全”是发展的保障，三者都不构成社会进步和文明发展的物质根基。\n记忆：发展是解决一切问题的基础和关键。\n依据：教材表述。","memoryTip":"发展是解决一切问题的基础和关键。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-z5iy53a3zvl","type":"choice","stem":"面对艰巨繁重的改革、发展和稳定任务，要在坚持( )工作总基调中统筹发展和安全。","options":[{"key":"A","text":"稳中向好"},{"key":"B","text":"稳中求变"},{"key":"C","text":"变中求稳"},{"key":"D","text":"稳中求进"}],"answer":["稳中求进"],"explanation":"正确答案：稳中求进\n为什么对：稳中求进是治国理政的重要原则，也是做好经济工作的方法论。面对艰巨繁重的改革、发展、稳定任务，守住稳的大局、在进上积极作为，才能在发展中保障安全、在安全中促进发展，实现统筹发展和安全。\n干扰项分析：“稳中向好”描述经济运行态势；“稳中求变”“变中求稳”都不是中央确定的工作总基调表述，不能作为统筹发展和安全的遵循。\n记忆：统筹发展和安全，要坚持稳中求进工作总基调。\n依据：教材表述。","memoryTip":"统筹发展和安全，要坚持稳中求进工作总基调。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-u510uz1jaic","type":"choice","stem":"只有从维护( )的高度谋划和推进其他领域安全，才能更好地保障国家利益，保证党长期执政和人民安居乐业，推进全面建设社会主义现代化国家。","options":[{"key":"A","text":"人民安全"},{"key":"B","text":"社会安全"},{"key":"C","text":"经济安全"},{"key":"D","text":"政治安全"}],"answer":["政治安全"],"explanation":"正确答案：政治安全\n为什么对：政治安全是最根本的安全，核心是政权安全和制度安全。只有从维护政治安全的高度谋划和推进其他领域安全，才能保证党长期执政、国家长治久安，更好保障国家利益和人民安居乐业，为全面建设社会主义现代化国家提供政治保证。\n干扰项分析：“人民安全”是宗旨；“经济安全”是基础；“社会安全”是保障，三者都是政治安全统领下的具体领域，不能承担谋划其他领域安全的统领作用。\n记忆：维护政治安全，才能统领其他领域安全。\n依据：教材表述。","memoryTip":"维护政治安全，才能统领其他领域安全。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-aqkry5pcqo7","type":"choice","stem":"多极化是当今世界的基本趋势。国际力量出现新的分化组合，国际体系和国际秩序进入( )。","options":[{"key":"A","text":"深刻重塑期"},{"key":"B","text":"加速演变期"},{"key":"C","text":"深度调整期"},{"key":"D","text":"动荡变革期"}],"answer":["深度调整期"],"explanation":"正确答案：深度调整期\n为什么对：多极化深入发展，新兴市场国家和发展中国家群体性崛起，国际力量对比出现新的变化。旧的国际秩序难以维系，新的格局尚未定型，国际体系和国际秩序由此进入深度调整期，各方围绕规则制定权和秩序主导权展开博弈。\n干扰项分析：“加速演变期”侧重百年变局的总体态势；“深刻重塑期”强调秩序重塑的方向；“动荡变革期”多用于描述世界形势，三者都不对应题干关于国际体系和国际秩序的固定表述。\n记忆：力量分化组合，国际秩序进入深度调整期。\n依据：教材表述。","memoryTip":"力量分化组合，国际秩序进入深度调整期。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-6f580j6b7mo","type":"choice","stem":"以胡锦涛同志为主要代表的中国共产党人，紧紧抓住和努力维护国家发展重要战略机遇期，坚持走和平发展道路，提出实施( )的开放战略等战略思想。","options":[{"key":"A","text":"互利共赢"},{"key":"B","text":"平等相待"},{"key":"C","text":"交流互鉴"},{"key":"D","text":"相互尊重"}],"answer":["互利共赢"],"explanation":"正确答案：互利共赢\n为什么对：以胡锦涛同志为主要代表的中国共产党人紧紧抓住国家发展重要战略机遇期，坚持走和平发展道路，提出实施互利共赢的开放战略。这一战略强调在对外开放中兼顾各方利益，以合作促进发展，以共赢增进安全。\n干扰项分析：“平等相待”是我国处理国家关系的一贯主张；“交流互鉴”多用于文明交往；“相互尊重”是国际关系基本准则，三者都不是这一时期对外开放战略的固定提法。\n记忆：坚持和平发展道路，实施互利共赢的开放战略。\n依据：教材表述。","memoryTip":"坚持和平发展道路，实施互利共赢的开放战略。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-27vmnaddllx","type":"choice","stem":"新时代大学生必须履行自身肩负的( )，珍惜新时代机遇、担负新时代使命，在担当中历练，在尽责中成长。","options":[{"key":"A","text":"责任义务"},{"key":"B","text":"国家安全权利"},{"key":"C","text":"国家安全义务"},{"key":"D","text":"历史使命"}],"answer":["国家安全义务"],"explanation":"正确答案：国家安全义务\n为什么对：国家安全法规定，公民和组织都有维护国家安全的责任和义务。大学生作为公民，既享有国家安全带来的权利保障，也必须履行维护国家安全、荣誉和利益的义务，把爱国之情转化为维护国家安全的实际行动。\n干扰项分析：“责任义务”表述笼统，没有点明国家安全这一特定范围；“国家安全权利”与题干中的“履行”搭配不当；“历史使命”是宏观号召，题干要求的是法定义务。\n记忆：大学生既要享安全权利，更要尽国家安全义务。\n依据：《中华人民共和国国家安全法》第十一条。","memoryTip":"大学生既要享安全权利，更要尽国家安全义务。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-i8mkc64hq4h","type":"choice","stem":"基本经济制度安全在国家经济安全中的地位至关重要。( )优势是一个国家的根本优势，只有保证基本经济制度安全，才能解放和发展生产力。","options":[{"key":"A","text":"制度"},{"key":"B","text":"文化"},{"key":"C","text":"经济"},{"key":"D","text":"科技"}],"answer":["制度"],"explanation":"正确答案：制度\n为什么对：基本经济制度是经济安全的基础性制度安排。制度优势是一个国家的最大优势，制度稳则经济稳；只有保证基本经济制度安全，才能稳定预期、激发活力，持续解放和发展生产力，因此制度优势具有根本意义。\n干扰项分析：“文化”“科技”是国家安全体系中的保障要素；“经济”是基本经济制度所维护的领域，三者都不能与“一个国家的根本优势”对应。\n记忆：制度优势是一个国家的最大优势，制度稳则经济稳。\n依据：教材表述。","memoryTip":"制度优势是一个国家的最大优势，制度稳则经济稳。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-hl23qzo073h","type":"choice","stem":"以( )为宗旨，就是要坚持以人民为中心，坚持国家安全一切为了人民，一切依靠人民。","options":[{"key":"A","text":"人民安全"},{"key":"B","text":"服务民生"},{"key":"C","text":"群众路线"},{"key":"D","text":"人民民主"}],"answer":["人民安全"],"explanation":"正确答案：人民安全\n为什么对：总体国家安全观以人民安全为宗旨。坚持以人民为中心，国家安全一切为了人民、一切依靠人民，把人民生命财产安全和合法权益放在首位，这既是国家安全工作的出发点，也是衡量国家安全成效的根本标准。\n干扰项分析：“服务民生”是具体工作指向；“群众路线”是工作方法；“人民民主”属于政治制度范畴，三者都不能与“为宗旨”这一总体国家安全观要素对应。\n记忆：总体国家安全观以人民安全为宗旨，一切为了人民。\n依据：《中华人民共和国国家安全法》第三条。","memoryTip":"总体国家安全观以人民安全为宗旨，一切为了人民。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-duglxt7q58n","type":"choice","stem":"习近平指出，\"过不了( )这一关，就过不了长期执政这一关\"。","options":[{"key":"A","text":"网络安全"},{"key":"B","text":"网络核心技术"},{"key":"C","text":"科技安全"},{"key":"D","text":"互联网"}],"answer":["互联网"],"explanation":"正确答案：互联网\n为什么对：互联网已经成为意识形态斗争的主战场和社会舆论的放大器。管不住互联网，就难以掌握意识形态工作主动权，进而影响党的执政根基，所以习近平指出，过不了互联网这一关，就过不了长期执政这一关。\n干扰项分析：“网络安全”“网络核心技术”“科技安全”都是互联网治理和科技安全中的具体方面，指向技术或领域问题，不能替代“这一关”所强调的长期执政考验。\n记忆：过不了互联网这一关，就过不了长期执政这一关。\n依据：教材表述。","memoryTip":"过不了互联网这一关，就过不了长期执政这一关。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-gkhuebt359","type":"choice","stem":"关于电信网络诈骗，以下说法错误的是( )。","options":[{"key":"A","text":"涉及范围小、危害性一般"},{"key":"B","text":"犯罪手段日益智能化"},{"key":"C","text":"借助网络突破国界、地域限制，国内外结合趋势明显"},{"key":"D","text":"诈骗团伙组织严密，专业化特征突出"}],"answer":["涉及范围小、危害性一般"],"explanation":"正确答案：涉及范围小、危害性一般\n为什么对：本题要求选出错误说法。电信网络诈骗受害群体广泛、涉案金额巨大，严重侵害群众财产权益，破坏社会诚信，属于涉及范围广、危害严重的犯罪，所以“涉及范围小、危害性一般”这一表述错误，是应选项。\n干扰项分析：“犯罪手段日益智能化”成立，诈骗分子利用新技术新应用实施精准诈骗；“借助网络突破国界、地域限制，国内外结合趋势明显”成立，跨境作案已成突出特点；“诈骗团伙组织严密，专业化特征突出”成立，团伙内部分工明确、链条完整。\n记忆：电诈范围广危害大，手段智能团伙专业。\n依据：教材表述。","memoryTip":"电诈范围广危害大，手段智能团伙专业。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-d9e19slsqhr","type":"choice","stem":"能否构建具有强大感召力的( )，关系社会和谐稳定，关乎国家长治久安。","options":[{"key":"A","text":"普世价值"},{"key":"B","text":"核心价值观"},{"key":"C","text":"法律法规"},{"key":"D","text":"人民军队"}],"answer":["核心价值观"],"explanation":"正确答案：核心价值观\n为什么对：核心价值观是文化软实力的灵魂，承载着一个国家共同的思想道德基础。能否构建具有强大感召力的核心价值观，直接关系社会和谐稳定，关乎国家长治久安，因此必须培育和弘扬社会主义核心价值观。\n干扰项分析：“普世价值”是西方话语，我国不使用这一提法；“法律法规”提供行为规范；“人民军队”是安全保障力量，三者都不属于价值认同层面。\n记忆：核心价值观聚人心，感召力关系长治久安。\n依据：教材表述。","memoryTip":"核心价值观聚人心，感召力关系长治久安。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-2am7erh4joj","type":"choice","stem":"在国家安全体系中，( )是塑造中国特色国家安全的物质技术保障。","options":[{"key":"A","text":"社会安全"},{"key":"B","text":"军事安全"},{"key":"C","text":"科技安全"},{"key":"D","text":"文化安全"}],"answer":["科技安全"],"explanation":"正确答案：科技安全\n为什么对：科技安全表现为国家科技实力、创新能力和关键核心技术自主可控的状态。科技进步为经济、军事、社会等各领域安全提供物质技术支撑，所以科技安全是塑造中国特色国家安全的物质技术保障。\n干扰项分析：“社会安全”指向社会稳定；“军事安全”是保底手段；“文化安全”提供精神支撑，三者都不具备“物质技术”这一属性。\n记忆：科技安全是塑造中国特色国家安全的物质技术保障。\n依据：教材表述。","memoryTip":"科技安全是塑造中国特色国家安全的物质技术保障。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-x82w2kis8n","type":"choice","stem":"无论在完善和发展中国特色社会主义制度方面，还是在国家治理体系和治理能力现代化建设方面，( )都是维护中国特色社会主义制度安全的主要动力。","options":[{"key":"A","text":"全面从严治党"},{"key":"B","text":"全面建设社会主义现代化国家"},{"key":"C","text":"全面深化改革"},{"key":"D","text":"全面依法治国"}],"answer":["全面深化改革"],"explanation":"正确答案：全面深化改革\n为什么对：全面深化改革着力破解深层次体制机制障碍，推动制度更加成熟更加定型。无论完善和发展中国特色社会主义制度，还是推进国家治理体系和治理能力现代化，都要靠改革提供动力，因此全面深化改革是维护中国特色社会主义制度安全的主要动力。\n干扰项分析：“全面从严治党”是党的建设的战略举措；“全面建设社会主义现代化国家”是总目标；“全面依法治国”是法治保障，三者都不能直接充当制度完善和治理现代化的动力来源。\n记忆：制度完善靠改革，治理现代化靠改革。\n依据：教材表述。","memoryTip":"制度完善靠改革，治理现代化靠改革。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-mmfrykb9ivo","type":"choice","stem":"大量事实一再表明，维护国家主权、安全是推动发展、实现发展利益的( )。","options":[{"key":"A","text":"根本保证"},{"key":"B","text":"有效途径"},{"key":"C","text":"根本目的"},{"key":"D","text":"强大动力"}],"answer":["根本保证"],"explanation":"正确答案：根本保证\n为什么对：国家主权和安全是发展的前提。主权受到侵害、安全没有保障，发展成果就难以保全，发展利益也无从实现。维护国家主权、安全，为推动发展、实现发展利益提供了根本保证。\n干扰项分析：“有效途径”指方法路径；“根本目的”把安全当成发展的终点，颠倒了安全与发展的关系；“强大动力”指推动作用，三者都不能表达保障性的地位。\n记忆：维护国家主权、安全，是发展利益的根本保证。\n依据：教材表述。","memoryTip":"维护国家主权、安全，是发展利益的根本保证。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-fuxcl42zca8","type":"choice","stem":"习近平总书记在党的二十大报告中指出:\"国家安全是民族复兴的根基，社会稳定是国家强盛的( )。必须坚定不移贯彻总体国家安全观，把维护国家安全贯穿党和国家工作各方面全过程，确保国家安全和社会稳定。\"","options":[{"key":"A","text":"基础"},{"key":"B","text":"前提"},{"key":"C","text":"依托"},{"key":"D","text":"保障"}],"answer":["前提"],"explanation":"正确答案：前提\n为什么对：党的二十大报告指出，国家安全是民族复兴的根基，社会稳定是国家强盛的前提。没有社会稳定，国家建设无法推进，强盛就失去基础条件，所以社会稳定处在前提位置。\n干扰项分析：“基础”与“根基”语义相近，但报告原文用的是“前提”；“依托”在总体国家安全观中对应促进国际安全；“保障”对应军事、科技、文化、社会安全，三者都不是本题原文用词。\n记忆：国家安全是复兴根基，社会稳定是强盛前提。\n依据：党的二十大报告。","memoryTip":"国家安全是复兴根基，社会稳定是强盛前提。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-llkt9kagnf","type":"choice","stem":"生态环境保护和生态文明建设，是我国持续发展最为重要的基础，必须深入贯彻( )，尊重自然、顺应自然、保护自然，筑牢生态安全屏障。","options":[{"key":"A","text":"新发展理念"},{"key":"B","text":"习近平法治思想"},{"key":"C","text":"总体国家安全观"},{"key":"D","text":"习近平生态文明思想"}],"answer":["习近平生态文明思想"],"explanation":"正确答案：习近平生态文明思想\n为什么对：习近平生态文明思想强调人与自然和谐共生，要求尊重自然、顺应自然、保护自然。生态环境保护和生态文明建设是我国持续发展最重要的基础，深入贯彻这一思想，才能筑牢生态安全屏障，守住自然生态安全边界。\n干扰项分析：“新发展理念”是管总的发展理念；“习近平法治思想”指导法治建设；“总体国家安全观”统领各领域安全，三者都不能直接对应题干引用的生态要求。\n记忆：贯彻习近平生态文明思想，筑牢生态安全屏障。\n依据：教材表述。","memoryTip":"贯彻习近平生态文明思想，筑牢生态安全屏障。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-pakpvuq4gh","type":"choice","stem":"随着军工科技的发展，当前世界上已有9个国家掌握核武器研发技术，但根据《不扩散核武器条约》的有关规定，只有( )个联合国安全理事会常任理事国是合法拥有核武器国家。","options":[{"key":"A","text":"3"},{"key":"B","text":"4"},{"key":"C","text":"6"},{"key":"D","text":"5"}],"answer":["5"],"explanation":"正确答案：5\n为什么对：《不扩散核武器条约》把1967年1月1日前制造并爆炸核武器的国家界定为核武器国家，即中国、法国、俄罗斯、英国、美国五个联合国安全理事会常任理事国，这五个国家是条约承认的合法拥有核武器国家。\n干扰项分析：“3”“4”“6”都不符合条约对核武器国家的界定；安理会常任理事国共五个，条约承认的核武器国家也正好是这五个。\n记忆：安理会五个常任理事国即合法核武国家。\n依据：《不扩散核武器条约》。","memoryTip":"安理会五个常任理事国即合法核武国家。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-q0whetqg58","type":"choice","stem":"以( )同志为主要代表的中国共产党人，强调中国的问题压倒一切的是需要稳定，坚持\"国家的主权和安全要始终放在第一位\"。","options":[{"key":"A","text":"胡锦涛"},{"key":"B","text":"江泽民"},{"key":"C","text":"邓小平"},{"key":"D","text":"毛泽东"}],"answer":["邓小平"],"explanation":"正确答案：邓小平\n为什么对：邓小平同志反复强调，中国的问题压倒一切的是需要稳定，稳定是改革发展的前提；他提出国家的主权和安全要始终放在第一位。这些论述为改革开放时期的国家安全工作提供了思想指引。\n干扰项分析：“胡锦涛”对应互利共赢的开放战略等思想；“江泽民”对应互信、互利、平等、协作的新安全观；“毛泽东”对应独立自主、和平共处等主张，三者的代表性论述都与题干引文不对应。\n记忆：稳定压倒一切，国家主权和安全始终放在第一位。\n依据：教材表述。","memoryTip":"稳定压倒一切，国家主权和安全始终放在第一位。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-j62olq5hlzq","type":"choice","stem":"以下说法错误的是( )。","options":[{"key":"A","text":"传统和非传统安全挑战各不相同，却又彼此相关"},{"key":"B","text":"一些非传统安全问题往往是从传统安全领域诱生出来的"},{"key":"C","text":"当前，传统和非传统安全威胁相互交织"},{"key":"D","text":"传统安全问题不会呈现出非传统安全的特征"}],"answer":["传统安全问题不会呈现出非传统安全的特征"],"explanation":"正确答案：传统安全问题不会呈现出非传统安全的特征\n为什么对：本题要求选出错误说法。这一表述把传统安全与非传统安全完全割裂。现实中二者相互交织、相互转化，传统安全问题可能衍生出非传统安全挑战，也可能表现出非传统安全的特征，所以该说法错误，是应选项。\n干扰项分析：“传统和非传统安全挑战各不相同，却又彼此相关”成立，两者领域不同但相互关联；“一些非传统安全问题往往是从传统安全领域诱生出来的”成立，如军事冲突引发难民、能源等问题；“当前，传统和非传统安全威胁相互交织”成立，这是总体国家安全观的基本判断。\n记忆：传统与非传统安全威胁相互交织，不能割裂看待。\n依据：教材表述。","memoryTip":"传统与非传统安全威胁相互交织，不能割裂看待。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-myjp3nn5t6","type":"choice","stem":"要坚持安全第一、预防为主，完善公共安全体系，推动公共安全治理模式向( )转型。","options":[{"key":"A","text":"全过程管控"},{"key":"B","text":"事前预防"},{"key":"C","text":"事中控制"},{"key":"D","text":"事后处理"}],"answer":["事前预防"],"explanation":"正确答案：事前预防\n为什么对：公共安全连着千家万户。坚持安全第一、预防为主，把风险排查、监测预警和源头治理挺在前面，推动公共安全治理模式向事前预防转型，才能以更低成本减少事故灾害损失，提升公共安全治理效能。\n干扰项分析：“全过程管控”是治理要求，包含事前、事中、事后；“事中控制”和“事后处理”都属于被动应对，与预防为主的方向不符。\n记忆：公共安全治理模式要向事前预防转型。\n依据：党的二十大报告。","memoryTip":"公共安全治理模式要向事前预防转型。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-d5oboehr8tn","type":"choice","stem":"影响国家安全因素来源的多样性和重叠性客观上决定了在维护国家安全中必须坚持( )。","options":[{"key":"A","text":"常规战"},{"key":"B","text":"舆论战"},{"key":"C","text":"总体战"},{"key":"D","text":"局部战"}],"answer":["总体战"],"explanation":"正确答案：总体战\n为什么对：国家安全威胁来源多样、领域交叉、内外联动，单一部门、单一手段难以应对。这就要求把各领域、各层级、各方面力量统筹起来，坚持总体战，形成维护国家安全的合力。\n干扰项分析：“常规战”和“局部战”是军事作战样式，覆盖范围有限；“舆论战”是斗争手段之一，不能覆盖经济、科技、网络等领域，三者都不能回应威胁来源多样重叠的要求。\n记忆：威胁来源多源重叠，维护国家安全要打总体战。\n依据：教材表述。","memoryTip":"威胁来源多源重叠，维护国家安全要打总体战。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-tvbbunfqe2","type":"choice","stem":"在新的安全形势下，国家安全保障能力越来越表现为有效应对( )的系统能力。","options":[{"key":"A","text":"经济安全威胁和政治安全风险"},{"key":"B","text":"国际安全威胁和社会安全风险"},{"key":"C","text":"内部安全威胁和外部安全风险"},{"key":"D","text":"现实安全威胁和潜在安全风险"}],"answer":["现实安全威胁和潜在安全风险"],"explanation":"正确答案：现实安全威胁和潜在安全风险\n为什么对：新的安全形势下，风险既有已经显现的现实威胁，也有尚未爆发但持续积累的潜在风险。国家安全保障能力要同时覆盖两者，既能处置现实威胁，又能预判化解潜在风险，才称得上系统能力。\n干扰项分析：“经济安全威胁和政治安全风险”“国际安全威胁和社会安全风险”只覆盖部分领域；“内部安全威胁和外部安全风险”只覆盖威胁来源，三者都窄于题干要求的全部威胁和风险类型。\n记忆：现实威胁要及时处置，潜在风险要提前预判。\n依据：教材表述。","memoryTip":"现实威胁要及时处置，潜在风险要提前预判。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-tdupka76luc","type":"choice","stem":"全球发展倡议强调坚持发展优先，提出构建更加平等均衡的全球发展伙伴关系，推动多边发展合作进程协同增效，加快落实联合国( )年可持续发展议程。","options":[{"key":"A","text":"2040"},{"key":"B","text":"2030"},{"key":"C","text":"2025"},{"key":"D","text":"2035"}],"answer":["2030"],"explanation":"正确答案：2030\n为什么对：全球发展倡议坚持发展优先，提出构建更加平等均衡的全球发展伙伴关系，推动多边发展合作进程协同增效，其重要指向是加快执行联合国2030年可持续发展议程，帮助发展中国家实现共同发展。\n干扰项分析：“2040”“2035”“2025”都不是联合国可持续发展议程的目标年份，联合国确定的议程期限是2030年，因此这三个数字与题干不符。\n记忆：全球发展倡议对接2030年可持续发展议程。\n依据：教材表述。","memoryTip":"全球发展倡议对接2030年可持续发展议程。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-f5cpg0e30t7","type":"choice","stem":"2016年4月10日，习近平总书记在首个全民国家安全教育日之际作出指示:\"要坚持国家安全一切为了人民、一切依靠人民，动员全党全社会共同努力，汇聚起维护国家安全的强大力量，夯实国家安全的社会基础，防范化解各类安全风险，不断提高人民群众的( )。\"","options":[{"key":"A","text":"获得感、幸福感"},{"key":"B","text":"安全感、获得感"},{"key":"C","text":"安全感、幸福感"},{"key":"D","text":"安全感、满足感"}],"answer":["安全感、幸福感"],"explanation":"正确答案：安全感、幸福感\n为什么对：2016年首个全民国家安全教育日，习近平总书记作出指示，要求坚持国家安全一切为了人民、一切依靠人民，动员全党全社会共同努力，汇聚维护国家安全的强大力量，夯实国家安全的社会基础，不断提高人民群众的安全感、幸福感。\n干扰项分析：“获得感、幸福感”缺少安全感，而安全感是国家安全工作的直接体现；“安全感、获得感”与原文用词不符；“安全感、满足感”中的满足感不是原文表述。\n记忆：国家安全为人民，提升安全感幸福感。\n依据：教材表述。","memoryTip":"国家安全为人民，提升安全感幸福感。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-oqwd2gsa9x","type":"choice","stem":"筑牢国家安全人民防线要拓展人民群众参与维护公共安全的有效途径，加强安全公益宣传，健全公共安全社会心理干预体系，积极引导社会舆论和公众情绪，动员( )的力量来维护公共安全。","options":[{"key":"A","text":"企事业单位"},{"key":"B","text":"全社会"},{"key":"C","text":"社会团体"},{"key":"D","text":"政府"}],"answer":["全社会"],"explanation":"正确答案：全社会\n为什么对：筑牢国家安全人民防线，要把群众充分发动起来。拓展人民群众参与维护公共安全的有效途径、加强安全公益宣传、健全社会心理干预体系、引导社会舆论，最终要动员全社会的力量维护公共安全，形成人人有责、人人尽责的局面。\n干扰项分析：“企事业单位”“社会团体”只是社会力量的一部分；“政府”是公共安全治理的主导者，题干强调的是动员群众和社会各方面，三者都小于全社会的范围。\n记忆：筑牢国家安全人民防线，要动员全社会力量。\n依据：教材表述。","memoryTip":"筑牢国家安全人民防线，要动员全社会力量。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-ijjbeve7ag","type":"choice","stem":"科学精准实施( )是统筹发展和安全的必然要求。","options":[{"key":"A","text":"微观政策"},{"key":"B","text":"产业政策"},{"key":"C","text":"宏观政策"},{"key":"D","text":"行业政策"}],"answer":["宏观政策"],"explanation":"正确答案：宏观政策\n为什么对：宏观政策跨周期和逆周期调节，能够熨平经济波动、稳定市场预期、守住不发生系统性风险的底线。科学精准实施宏观政策，把发展建立在安全的基础上，把安全贯穿发展全过程，是统筹发展和安全的必然要求。\n干扰项分析：“微观政策”作用于具体市场主体；“产业政策”“行业政策”针对特定领域，三者覆盖面有限，都不能承担总量调节和稳定大局的功能。\n记忆：统筹发展和安全，宏观政策要科学精准。\n依据：教材表述。","memoryTip":"统筹发展和安全，宏观政策要科学精准。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-ok8c7i6siuh","type":"choice","stem":"党的十八大以来，党中央对产权保护提出新要求，不断完善产权保护制度，保护各种所有制经济产权和合法利益;健全以( )为核心原则的产权保护制度，加强对各种所有制经济组织和自然人财产权的保护。","options":[{"key":"A","text":"公正"},{"key":"B","text":"平等"},{"key":"C","text":"公平"},{"key":"D","text":"公开"}],"answer":["公平"],"explanation":"正确答案：公平\n为什么对：产权保护制度以公平为核心原则，意味着对各种所有制经济产权和自然人财产权一视同仁，同等保护、同等追责。只有坚持公平，才能稳定预期、增强信心，让各类经营主体安心经营、放心投资。\n干扰项分析：“公正”侧重价值判断的正当性；“平等”强调各类主体法律地位相同，官方关于产权保护的固定提法是“以公平为核心原则”；“公开”指程序和信息透明，三者都不能替换这一固定表述。\n记忆：产权保护制度以公平为核心原则，各类主体一视同仁。\n依据：教材表述。","memoryTip":"产权保护制度以公平为核心原则，各类主体一视同仁。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-ky5hb6nlr5","type":"choice","stem":"《管子·治国》曰:\"治国常富，而乱国常贫。\"说明( )是国家生存发展的前提。","options":[{"key":"A","text":"国家稳定"},{"key":"B","text":"国家治理"},{"key":"C","text":"国家安全"},{"key":"D","text":"经济发展"}],"answer":["国家安全"],"explanation":"正确答案：国家安全\n为什么对：《管子·治国》讲治国常富、乱国常贫，说明秩序安定、国家稳固是财富积累和社会发展的先决条件。国家安全正是国家生存发展的前提，没有安全，一切建设成果都难以保全。\n干扰项分析：“国家稳定”只是安全的近义表述，不是教材的规范提法；“国家治理”是手段和过程；“经济发展”是结果，三者都不能承担“国家生存发展的前提”这一定位。\n记忆：治国常富乱国常贫，国家安全是生存发展前提。\n依据：教材表述。","memoryTip":"治国常富乱国常贫，国家安全是生存发展前提。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-oos72rghpwb","type":"choice","stem":"下列选项不属于水生态安全的是( )。","options":[{"key":"A","text":"水质安全"},{"key":"B","text":"水量安全"},{"key":"C","text":"植树造林"},{"key":"D","text":"供水系统应急保障能力"}],"answer":["植树造林"],"explanation":"正确答案：植树造林\n为什么对：水生态安全指向水的生态属性与用水保障，涵盖水质是否达标、水量是否充足、水生态空间是否完整以及供水系统在突发事件中的应急保障能力。植树造林属于林业生态建设与国土绿化，改变的是陆地植被覆盖，属于森林生态安全的范围，不构成水生态安全的组成部分。\n干扰项分析：「水质安全」考察水体污染与水质达标状况，是水生态安全的直接内容；「水量安全」考察水资源总量与可用水量，属于水生态安全的水量维度；「供水系统应急保障能力」考察供水工程在灾害和事故中的保障水平，属于水生态安全的工程保障环节。三者都在水生态安全范围内。\n记忆：水生态看水质、水量和供水应急保障能力\n依据：教材表述","memoryTip":"水生态看水质、水量和供水应急保障","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-chy86lykz9","type":"choice","stem":"习近平总书记指出:\"要准确把握和全面贯彻我们党关于加强和改进民族工作的重要思想，以( )为主线，坚定不移走中国特色解决民族问题的正确道路。\"","options":[{"key":"A","text":"促进各民族交往交流交融"},{"key":"B","text":"铸牢中华民族共同体意识"},{"key":"C","text":"全面贯彻党的民族政策"},{"key":"D","text":"坚持和完善民族区域自治制度"}],"answer":["铸牢中华民族共同体意识"],"explanation":"正确答案：铸牢中华民族共同体意识\n为什么对：中央民族工作会议明确，以铸牢中华民族共同体意识为主线，坚定不移走中国特色解决民族问题的正确道路。主线回答民族工作以什么统领、沿着什么方向推进的问题，各项民族政策和民族区域自治制度的坚持完善都要围绕这条主线展开。\n干扰项分析：「促进各民族交往交流交融」是实现主线的途径；「全面贯彻党的民族政策」是工作要求；「坚持和完善民族区域自治制度」是制度保障。三者都服务于主线，本身不承担主线的定位。\n记忆：民族工作一条主线：铸牢中华民族共同体意识\n依据：教材表述（中央民族工作会议提出的民族工作主线）","memoryTip":"民族工作主线：铸牢中华民族共同体意识","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-t8gtnykjnm","type":"choice","stem":"必须不断推进国家安全体系和能力现代化，这是党的二十大报告提出的以( )保障新发展格局重大部署的战略要求。","options":[{"key":"A","text":"全面深化改革"},{"key":"B","text":"高质量发展"},{"key":"C","text":"高水平对外开放"},{"key":"D","text":"新安全格局"}],"answer":["新安全格局"],"explanation":"正确答案：新安全格局\n为什么对：党的二十大报告在部署国家安全工作时提出，必须坚定不移贯彻总体国家安全观，把维护国家安全贯穿党和国家工作各方面全过程，以新安全格局保障新发展格局。新安全格局与新发展格局相对应，前者为后者提供安全屏障，这是推进国家安全体系和能力现代化的战略要求。\n干扰项分析：「全面深化改革」是推进现代化的动力来源；「高质量发展」是全面建设社会主义现代化国家的首要任务，处在发展一侧；「高水平对外开放」是对外开放领域的路径安排。三者都承担不了保障新发展格局的安全侧定位。\n记忆：二十大报告：新安全格局保障新发展格局\n依据：党的二十大报告","memoryTip":"二十大报告：新安全格局保障新发展格局","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-goa50wdj4q","type":"choice","stem":"铸牢中华民族共同体意识，就是要引导各族人民牢固树立( )的共同体理念。","options":[{"key":"A","text":"休戚与共、患难与共、生死与共、命运与共"},{"key":"B","text":"休戚与共、患难与共、生死与共、发展与共"},{"key":"C","text":"休戚与共、荣辱与共、生死与共、命运与共"},{"key":"D","text":"休戚与共、荣辱与共、患难与共、发展与共"}],"answer":["休戚与共、荣辱与共、生死与共、命运与共"],"explanation":"正确答案：休戚与共、荣辱与共、生死与共、命运与共\n为什么对：铸牢中华民族共同体意识，就是要引导各族人民牢固树立休戚与共、荣辱与共、生死与共、命运与共的共同体理念。四个与共分别从利益、荣辱、生死、命运四个层面说明各民族同属一个共同体，四项齐全才完整，顺序也固定。\n干扰项分析：「休戚与共、患难与共、生死与共、命运与共」把荣辱与共换成患难与共，只讲困难时刻的共同承担，丢掉了共同荣辱这一层；「休戚与共、患难与共、生死与共、发展与共」同时改掉荣辱和命运两处；「休戚与共、荣辱与共、患难与共、发展与共」保留了荣辱与共，仍把命运与共改成发展与共，共同体在前途命运上的一致性被削弱。\n记忆：共同体理念：休戚与共、荣辱与共、生死与共、命运与共\n依据：教材表述","memoryTip":"休戚与共、荣辱与共、生死与共、命运与共","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-hf1dif2regt","type":"choice","stem":"对国家间的矛盾和分歧，以下不属于中国主张的是( )。","options":[{"key":"A","text":"始终倡导有事好商量，依托多边框架和平台"},{"key":"B","text":"坚持弘扬全人类共同价值"},{"key":"C","text":"加强沟通协调，求同存异，聚同化异，扩大共识"},{"key":"D","text":"不反对动辄诉诸武力或以武力相威胁"}],"answer":["不反对动辄诉诸武力或以武力相威胁"],"explanation":"正确答案：不反对动辄诉诸武力或以武力相威胁\n为什么对：中国在处理国家间矛盾和分歧时主张通过对话协商解决，反对动辄诉诸武力或以武力相威胁。本题问的是不属于中国主张的选项，该项把中国明确反对的做法写成不反对，立场恰好相反，因此不属于中国主张。\n干扰项分析：「始终倡导有事好商量，依托多边框架和平台」体现协商解决分歧；「坚持弘扬全人类共同价值」体现价值层面的共同遵循；「加强沟通协调，求同存异，聚同化异，扩大共识」体现分歧管控的具体路径。三者都是中国主张的处理方式。\n记忆：中国反对动辄诉诸武力或以武力相威胁\n依据：教材表述","memoryTip":"中国反对动辄诉诸武力或以武力相威胁","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-qs2jckhzdo","type":"choice","stem":"要用( )，确保人民群众\"舌尖上的安全\"。","options":[{"key":"A","text":"严谨的监管、严格的标准、严厉的问责、苛刻的处罚"},{"key":"B","text":"严谨的标准、严格的监管、严厉的处罚、严肃的问责"},{"key":"C","text":"严谨的标准、苛刻的处罚、严厉的监管、严肃的问责"},{"key":"D","text":"统一的标准、严格的监管、合理的处罚、严肃的问责"}],"answer":["严谨的标准、严格的监管、严厉的处罚、严肃的问责"],"explanation":"正确答案：严谨的标准、严格的监管、严厉的处罚、严肃的问责\n为什么对：保障人民群众舌尖上的安全，要做到严谨的标准、严格的监管、严厉的处罚、严肃的问责。四项对应标准制定、日常监管、违法惩处、责任追究四个环节，形成从源头到问责的完整链条；官方把这四项概括为四个最严，题库选项省略了最字，搭配关系仍然一一对应。\n干扰项分析：「严谨的监管、严格的标准、严厉的问责、苛刻的处罚」把监管与标准对调，问责与处罚也错位，而且苛刻不能修饰行政处罚；「严谨的标准、苛刻的处罚、严厉的监管、严肃的问责」以苛刻替换严厉；「统一的标准、严格的监管、合理的处罚、严肃的问责」丢掉了标准的严谨性和处罚的严厉性，力度明显减弱。\n记忆：标准严谨、监管严格、处罚严厉、问责严肃\n依据：教材表述（食品安全四个最严要求）","memoryTip":"标准严谨、监管严格、处罚严厉、问责严肃","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-q8itxoh963r","type":"choice","stem":"《国防法》《兵役法》《人民武装警察法》《国防交通法》《海警法》属于维护( )的法律。","options":[{"key":"A","text":"政治安全"},{"key":"B","text":"国土安全"},{"key":"C","text":"生物安全"},{"key":"D","text":"军事安全"}],"answer":["军事安全"],"explanation":"正确答案：军事安全\n为什么对：国防法、兵役法、人民武装警察法、国防交通法、海警法共同规范国防活动、兵役制度、武装警察力量运用、国防交通保障和海上执法，指向国家武装力量建设与军事斗争准备，属于维护军事安全的法律。军事安全在总体国家安全观中是保底手段。\n干扰项分析：「政治安全」由维护政权、制度和意识形态安全的法律保障；「国土安全」由边防、海防、空防和领土主权方面的法律法规保障；「生物安全」由生物安全法和公共卫生相关法律保障。三者与题干列举的法律不属同一领域。\n记忆：国防、兵役、武警、国防交通、海警归军事安全\n依据：教材表述","memoryTip":"国防、兵役、武警、国防交通、海警归军事安全","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-lpksdlq9txk","type":"choice","stem":"要坚持和完善\"一国两制\"制度体系，落实( )，落实\"爱国者治港\"\"爱国者治澳\"原则。","options":[{"key":"A","text":"行政长官任命权"},{"key":"B","text":"中央全面管治权"},{"key":"C","text":"基本法解释权和修改权"},{"key":"D","text":"向行政长官发出指令权"}],"answer":["中央全面管治权"],"explanation":"正确答案：中央全面管治权\n为什么对：坚持和完善一国两制制度体系，关键在于中央全面管治权，同时贯彻爱国者治港、爱国者治澳原则。中央全面管治权是主权层面的权力，特别行政区的高度自治权由中央授予并在中央监督下行使，二者统一于宪法和基本法确立的宪制秩序。\n干扰项分析：「行政长官任命权」是中央全面管治权的具体内容之一，范围窄于全面管治权；「基本法解释权和修改权」同样是中央行使的具体权力；「向行政长官发出指令权」也是中央对特别行政区行使的具体权力。三者都是下位概念，替代不了全面管治权的整体表述。\n记忆：一国两制：中央全面管治权加爱国者治港治澳\n依据：教材表述","memoryTip":"一国两制：中央全面管治权加爱国者治港治澳","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-x74137iy7u","type":"choice","stem":"( )是人民幸福生活的基础，是民族昌盛和国家强盛的重要标志，也是社会文明进步的重要体现，在全面建设社会主义现代化国家进程中居于优先发展的战略位置。","options":[{"key":"A","text":"人民健康"},{"key":"B","text":"科技创新"},{"key":"C","text":"经济富裕"},{"key":"D","text":"文化繁荣"}],"answer":["人民健康"],"explanation":"正确答案：人民健康\n为什么对：人民健康是人民幸福生活的基础，是民族昌盛和国家强盛的重要标志，也是社会文明进步的重要体现。党的二十大报告把保障人民健康放在优先发展的战略位置，健康中国建设成为全面建设社会主义现代化国家的重要任务。\n干扰项分析：「科技创新」是国家发展的战略支撑，定位在动力方面；「经济富裕」是发展的结果和条件，涵盖不了健康这一民生根本；「文化繁荣」属于文化建设目标，与优先发展的战略位置不匹配。\n记忆：健康是幸福生活的基础，处在优先发展战略位置\n依据：党的二十大报告","memoryTip":"健康是幸福生活的基础，处在优先发展战略位置","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-yt599dub78l","type":"choice","stem":"党的二十大报告提出推进国家安全体系和能力现代化总要求，其中强调要以( )为依托。","options":[{"key":"A","text":"政治安全"},{"key":"B","text":"军事科技文化社会安全"},{"key":"C","text":"经济安全"},{"key":"D","text":"促进国际安全"}],"answer":["促进国际安全"],"explanation":"正确答案：促进国际安全\n为什么对：党的二十大报告对推进国家安全体系和能力现代化提出总要求，明确以人民安全为宗旨、以政治安全为根本、以经济安全为基础、以军事科技文化社会安全为保障、以促进国际安全为依托。题干问的是为依托的一环，对应促进国际安全。\n干扰项分析：「政治安全」对应为根本；「军事科技文化社会安全」对应为保障；「经济安全」对应为基础。三者都是总要求中的其他定位，与依托不匹配。\n记忆：宗旨人民、根本政治、基础经济、保障军文科社、依托国际\n依据：《中华人民共和国国家安全法》第三条与党的二十大报告","memoryTip":"宗旨人民、根本政治、基础经济、保障军文科社、依托国际","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-vf279agkgrg","type":"choice","stem":"( )是新时代大学生在成长过程中必须具备的精神品质，只有在斗争中才能不断经历风雨、逐步成长。","options":[{"key":"A","text":"斗争精神"},{"key":"B","text":"忧患意识"},{"key":"C","text":"艰苦奋斗"},{"key":"D","text":"奋斗精神"}],"answer":["斗争精神"],"explanation":"正确答案：斗争精神\n为什么对：新时代大学生要在成长中经受锻炼，斗争精神是必须具备的精神品质。人在矛盾冲突和困难考验中才会经历风雨、增长才干，离开斗争实践，意志品质和本领都难以真正形成，题干强调的是这种在实践中磨砺出来的品质。\n干扰项分析：「忧患意识」是居安思危的警觉，属于认识前提；「艰苦奋斗」是作风要求；「奋斗精神」是一般意义上的进取状态。三者都不直接指向在斗争中经受历练这一层含义。\n记忆：在斗争中经历风雨，靠斗争精神成长\n依据：教材表述","memoryTip":"在斗争中经历风雨，靠斗争精神成长","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-txhnzum70z","type":"choice","stem":"完善( )是社会安全的基础性工作。","options":[{"key":"A","text":"社会治理体系"},{"key":"B","text":"社会保障制度"},{"key":"C","text":"人民军队建设"},{"key":"D","text":"基础设施建设"}],"answer":["社会治理体系"],"explanation":"正确答案：社会治理体系\n为什么对：社会安全要靠有效的社会治理来托底。完善社会治理体系，把矛盾纠纷预防化解、社会治安防控、公共安全治理纳入制度化轨道，从源头上减少影响社会稳定的因素，所以它是社会安全的基础性工作。\n干扰项分析：「社会保障制度」是民生兜底安排，解决基本生活保障问题；「人民军队建设」属于军事安全领域；「基础设施建设」是经济社会发展的支撑条件。三者都不承担社会治理层面的基础性功能。\n记忆：社会安全的基础性工作是社会治理体系\n依据：教材表述","memoryTip":"社会安全的基础性工作是社会治理体系","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-gd9ifzlsgjv","type":"choice","stem":"新时代新征程，推进中国式现代化，必须进一步推动深层次改革和高水平开放，不断解放和发展社会生产力、解放和增强社会活力，从而不断筑牢维护经济发展安全的( )基础。","options":[{"key":"A","text":"物质"},{"key":"B","text":"理论"},{"key":"C","text":"道路"},{"key":"D","text":"制度"}],"answer":["道路"],"explanation":"正确答案：道路\n为什么对：新时代新征程推进中国式现代化，要靠深层次改革和高水平开放不断解放和发展社会生产力、解放和增强社会活力。社会生产力和社会活力是经济发展安全的根基，本题把这一根基表述为道路基础，重点在走中国特色社会主义道路这一根本方向，按题库答案作答。\n干扰项分析：「物质」对应生产力发展带来的物质积累；「理论」对应指导思想层面的支撑；「制度」对应体制机制层面的保障。三者都是经济发展安全的重要条件，与题干强调的方向性问题处在不同层面。\n记忆：筑牢经济发展安全，方向在道路基础\n依据：教材表述","memoryTip":"筑牢经济发展安全，方向在道路基础","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-vrtrm5adis","type":"choice","stem":"以下法律法规没有涉及网络安全的是( )。","options":[{"key":"A","text":"《中华人民共和国个人信息保护法》"},{"key":"B","text":"《中华人民共和国密码法》"},{"key":"C","text":"《中华人民共和国数据安全法》"},{"key":"D","text":"《中华人民共和国反不正当竞争法》"}],"answer":["《中华人民共和国反不正当竞争法》"],"explanation":"正确答案：《中华人民共和国反不正当竞争法》\n为什么对：本题问哪部法律没有涉及网络安全。反不正当竞争法调整经营者之间的市场竞争秩序，规制仿冒混淆、虚假宣传、商业诋毁、侵犯商业秘密等行为，指向市场竞争，不涉及网络运行安全、数据安全和个人信息处理，因此不属于网络安全领域的法律。\n干扰项分析：《中华人民共和国个人信息保护法》规范个人信息处理活动，与网络环境下的个人信息保护直接相关；《中华人民共和国密码法》规范密码应用和管理，是网络安全的技术基础性法律；《中华人民共和国数据安全法》规范数据处理活动和数据安全保护。三部法律都与网络安全治理相衔接。\n记忆：竞争法管市场秩序，不涉及网络运行安全\n依据：《中华人民共和国反不正当竞争法》与《中华人民共和国网络安全法》","memoryTip":"竞争法管市场秩序，不涉及网络运行安全","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-pptxcaoe79","type":"choice","stem":"( )森林覆盖率成为世界上增速最快的地区。","options":[{"key":"A","text":"美国"},{"key":"B","text":"德国"},{"key":"C","text":"英国"},{"key":"D","text":"中国"}],"answer":["中国"],"explanation":"正确答案：中国\n为什么对：我国持续开展大规模国土绿化行动，森林覆盖率和森林蓄积量多年保持增长，是全球森林资源增长最快、增量最多的国家。题干所说的森林覆盖率增速最快的地区指向中国，这与生态文明建设和生态安全维护的成效相对应。\n干扰项分析：「美国」「德国」「英国」的林业管理水平较高，森林覆盖率长期处在相对稳定的状态，不具备题干所说的增速特征。三者与我国大规模造林绿化的实际情况不同。\n记忆：全球森林增长最快、增量最多的是中国\n依据：教材表述","memoryTip":"全球森林增长最快、增量最多的是中国","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-rn4hptqern","type":"choice","stem":"坚持以政治安全为根本，维护( )是基础。","options":[{"key":"A","text":"中国共产党的领导和执政地位"},{"key":"B","text":"社会主义意识形态安全"},{"key":"C","text":"人民民主专政的国家政权安全"},{"key":"D","text":"中国特色社会主义制度安全"}],"answer":["中国特色社会主义制度安全"],"explanation":"正确答案：中国特色社会主义制度安全\n为什么对：坚持以政治安全为根本，维护中国特色社会主义制度安全是基础。政治安全包含政权安全、制度安全和意识形态安全，制度安全指向国家根本制度、基本制度和重要制度不受颠覆。制度稳固，政权和意识形态才有依托，所以它构成基础环节。\n干扰项分析：「中国共产党的领导和执政地位」是政治安全的核心内容，位置高于基础这一层次；「社会主义意识形态安全」是政治安全的思想防线；「人民民主专政的国家政权安全」是政治安全的政权维度。三者都是政治安全的组成部分，与题干限定的基础不对应。\n记忆：政治安全为根本，制度安全是基础\n依据：教材表述","memoryTip":"政治安全为根本，制度安全构成基础","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-l58vxw6mdg","type":"choice","stem":"党的十八大以来，党中央将保障人民健康作为党为人民奋斗的重要目标，作出( )重大决策部署，把\"健康中国\"列为全面建设社会主义现代化国家的重要任务。","options":[{"key":"A","text":"\"推进健康中国建设，提高人民健康水平\""},{"key":"B","text":"\"加快推进健康中国建设\""},{"key":"C","text":"\"全面推进健康中国建设\""},{"key":"D","text":"\"推进健康中国建设\""}],"answer":["\"全面推进健康中国建设\""],"explanation":"正确答案：\"全面推进健康中国建设\"\n为什么对：党的十八大以来，党中央把保障人民健康放在优先发展的战略位置，就健康中国建设作出全面推进健康中国建设的重大决策部署，把健康中国列为全面建设社会主义现代化国家的重要任务。题干问的是这一决策部署的规范表述，全面二字不可省略。\n干扰项分析：「\"推进健康中国建设，提高人民健康水平\"」把部署名称与工作目标合并，改变了原表述；「\"加快推进健康中国建设\"」用加快替换全面，重点转向速度；「\"推进健康中国建设\"」缺少全面这一限定，范围表述不完整。\n记忆：健康中国建设的部署提法是全面推进\n依据：教材表述","memoryTip":"健康中国建设的部署提法是全面推进","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-syxkubv2i9e","type":"choice","stem":"( )这\"四种危险\"仍长期存在，侵蚀党的思想道德基础，损害党内政治生态和党的形象。","options":[{"key":"A","text":"精神懈怠危险、官僚主义危险、脱离群众危险、消极腐败危险"},{"key":"B","text":"精神懈怠危险、能力不足危险、脱离群众危险、奢靡之风危险"},{"key":"C","text":"精神懈怠危险、能力不足危险、脱离群众危险、消极腐败危险"},{"key":"D","text":"精神懈怠危险、官僚主义危险、脱离群众危险、奢靡之风危险"}],"answer":["精神懈怠危险、能力不足危险、脱离群众危险、消极腐败危险"],"explanation":"正确答案：精神懈怠危险、能力不足危险、脱离群众危险、消极腐败危险\n为什么对：四种危险是党长期面对的执政风险，分别指向精神状态、能力本领、党群关系、廉洁自律四个方面。四项合起来说明风险来自党内，题干所说的侵蚀思想道德基础、损害政治生态和党的形象，正对应这四个方面。\n干扰项分析：「精神懈怠危险、官僚主义危险、脱离群众危险、消极腐败危险」用官僚主义替换能力不足，官僚主义属于四风问题；「精神懈怠危险、能力不足危险、脱离群众危险、奢靡之风危险」用奢靡之风替换消极腐败，奢靡之风同样属于四风；「精神懈怠危险、官僚主义危险、脱离群众危险、奢靡之风危险」两处都被四风内容替换，四种危险的完整表述被破坏。\n记忆：四种危险：懈怠、能力不足、脱离群众、消极腐败\n依据：教材表述","memoryTip":"四种危险：懈怠、能力不足、脱离群众、消极腐败","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-qg8aham7f","type":"choice","stem":"守住了( )这条底线，就守住了发展的立足点和生命线。","options":[{"key":"A","text":"稳定"},{"key":"B","text":"经济"},{"key":"C","text":"安全"},{"key":"D","text":"发展"}],"answer":["安全"],"explanation":"正确答案：安全\n为什么对：安全是发展的前提。守住安全这条底线，发展的立足点才稳固，发展的生命线才有保障；安全底线一旦被突破，发展成果也会受到冲击。题干把安全放在立足点和生命线的位置，与统筹发展和安全的要求一致。\n干扰项分析：「稳定」是社会秩序层面的状态，属于安全的具体表现；「经济」是发展的内容；「发展」与安全互为条件，本身不能充当底线的表述对象。三者都不能与守住了这条底线构成完整搭配。\n记忆：守住安全底线，就守住发展的立足点和生命线\n依据：教材表述","memoryTip":"守住安全底线，就守住发展的立足点和生命线","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-lp1fndyrr8s","type":"choice","stem":"巩固提高一体化国家战略体系和能力是一个系统工程，关键是要在( )上下功夫，实现国家战略能力最大化。","options":[{"key":"A","text":"一体化"},{"key":"B","text":"战略体系建设"},{"key":"C","text":"巩固提高"},{"key":"D","text":"战略能力提升"}],"answer":["一体化"],"explanation":"正确答案：一体化\n为什么对：巩固提高一体化国家战略体系和能力是系统工程，关键要在一体化上下功夫。战略体系与战略能力分属不同主体和领域，只有把经济建设和国防建设、平时与战时、军与民统筹起来，才能实现国家战略能力最大化，题干的关键词就是一体化。\n干扰项分析：「战略体系建设」只覆盖体系一侧，缺少能力生成；「巩固提高」是工作总要求，没有指明着力点；「战略能力提升」只覆盖能力一侧，统摄不了体系和能力两个方面。三者都是题干表述的组成部分，与关键的提问不对应。\n记忆：战略体系加战略能力，关键在一体化\n依据：党的二十大报告与教材表述","memoryTip":"战略体系加战略能力，关键在一体化","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-ao92rabq1dv","type":"choice","stem":"在忧患意识中培养( )，参与和推动新时代伟大斗争，是中华民族伟大复兴事业赋予新时代大学生的庄严使命。","options":[{"key":"A","text":"坚强意志"},{"key":"B","text":"斗争精神"},{"key":"C","text":"素质能力"},{"key":"D","text":"安全意识"}],"answer":["斗争精神"],"explanation":"正确答案：斗争精神\n为什么对：在忧患意识中培养斗争精神，参与和推动新时代伟大斗争，是民族复兴事业赋予新时代大学生的使命。忧患意识提供风险警觉，斗争精神把警觉转化为行动，题干强调的是从认识到行动的这个转化环节。\n干扰项分析：「坚强意志」是斗争精神的支撑要素；「素质能力」是斗争本领的组成部分；「安全意识」属于认识层面。三者都是成长中的素质要求，承担不了题干所说在忧患意识中培养并参与推动伟大斗争的完整含义。\n记忆：忧患意识育警觉，斗争精神见行动\n依据：教材表述","memoryTip":"忧患意识育警觉，斗争精神见于行动","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-mfz23kugbz","type":"choice","stem":"( )既立足于伟大斗争，是伟大斗争的产物，又对伟大斗争起了巨大的精神引领作用。","options":[{"key":"A","text":"斗争精神"},{"key":"B","text":"奋斗精神"},{"key":"C","text":"斗争意识"},{"key":"D","text":"艰苦奋斗"}],"answer":["斗争精神"],"explanation":"正确答案：斗争精神\n为什么对：斗争精神既立足于伟大斗争，是伟大斗争的产物，又对伟大斗争起巨大的精神引领作用。这一表述说明精神与实践的双向关系：实践孕育精神，精神反过来指导实践，题干的两个分句正是这一关系的展开。\n干扰项分析：「奋斗精神」侧重艰苦奋斗的作风，不含斗争的方向性；「斗争意识」停留在认识层面，缺乏精神引领的分量；「艰苦奋斗」是作风要求，与伟大斗争的产物对应不上。\n记忆：斗争孕育斗争精神，斗争精神引领斗争\n依据：教材表述","memoryTip":"斗争孕育斗争精神，斗争精神引领斗争","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-y3d2i1h4ipo","type":"choice","stem":"完善全球安全治理体系，需要各国政府和国际组织及专门力量发挥积极作用，也需要国际社会各方面共同参与，不断提高全球安全治理的( )。","options":[{"key":"A","text":"互动性和平衡性"},{"key":"B","text":"公平性和合理性"},{"key":"C","text":"系统性和有效性"},{"key":"D","text":"整体性和协同性"}],"answer":["整体性和协同性"],"explanation":"正确答案：整体性和协同性\n为什么对：完善全球安全治理体系，既需要各国政府和国际组织及专门力量发挥作用，也需要国际社会各方面共同参与。参与主体多、议题相互关联，治理成效取决于各方面能否形成整体合力、能否协调行动，因此要提高全球安全治理的整体性和协同性。\n干扰项分析：「互动性和平衡性」强调主体之间的往来和力量均衡，没有点出治理体系的整体合力；「公平性和合理性」指向治理规则的价值取向；「系统性和有效性」指向治理体系的完备程度和实际效果。三者都是全球安全治理的追求，与题干各方面共同参与相呼应的表述是整体性和协同性。\n记忆：全球安全治理重在整体性和协同性\n依据：教材表述","memoryTip":"全球安全治理重在整体性和协同性","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-2e86ql9ltk6","type":"choice","stem":"下列哪一项不属于\"全球发展倡议\"的主要内容?( )","options":[{"key":"A","text":"坚持人与自然和谐共生"},{"key":"B","text":"坚持以人民为中心"},{"key":"C","text":"坚持创新优先"},{"key":"D","text":"坚持普惠包容"}],"answer":["坚持创新优先"],"explanation":"正确答案：坚持创新优先\n为什么对：本题问哪一项不属于全球发展倡议的主要内容。倡议提出六个坚持，包括坚持发展优先、坚持以人民为中心、坚持普惠包容、坚持创新驱动、坚持人与自然和谐共生、坚持行动导向。其中的表述是创新驱动，该项写成创新优先，把以创新驱动发展改成了创新排在优先位置，因此不属于倡议内容。\n干扰项分析：「坚持人与自然和谐共生」是六个坚持之一，对应绿色发展；「坚持以人民为中心」是六个坚持之一，对应发展目的；「坚持普惠包容」是六个坚持之一，对应发展的覆盖面。三项都是倡议的原有表述。\n记忆：全球发展倡议讲创新驱动，不讲创新优先\n依据：教材表述（全球发展倡议六个坚持）","memoryTip":"全球发展倡议讲创新驱动，不讲创新优先","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-t9murngbfb","type":"choice","stem":"各种敌对势力从来没有停止对中国共产党领导和我国社会主义制度进行颠覆破坏活动，他们下功夫最大的一个领域，就是争夺我们的( )。","options":[{"key":"A","text":"民主党派"},{"key":"B","text":"科教工作者"},{"key":"C","text":"青少年"},{"key":"D","text":"无党派人士"}],"answer":["青少年"],"explanation":"正确答案：青少年\n为什么对：各种敌对势力对中国共产党领导和我国社会主义制度的颠覆破坏活动从未停止，他们下功夫最大的一个领域就是争夺青少年。青少年处在价值观形成的关键阶段，谁赢得青少年，谁就影响国家未来的走向，题干因此指向青少年。\n干扰项分析：「民主党派」是统一战线工作对象，敌对势力的渗透指向政党制度；「科教工作者」是知识分子群体的组成部分；「无党派人士」同样属于统一战线范畴。三者都是敌对势力渗透的对象，题干问的是争夺的重点。\n记忆：敌对势力下功夫最大的领域是争夺青少年\n依据：教材表述","memoryTip":"敌对势力下功夫最大的领域是争夺青少年","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-b9uxywqw0vi","type":"choice","stem":"关于中国特色社会主义理论自信，以下说法错误的是( )。","options":[{"key":"A","text":"中国特色社会主义理论自信蕴含着中国共产党运用马克思主义正确回答时代和实践提出的重大问题的卓越理论能力"},{"key":"B","text":"中国特色社会主义理论自信源于中国特色社会主义伟大实践的深刻变革"},{"key":"C","text":"中国特色社会主义理论自信源于马克思主义中国化时代化创新成果的科学性"},{"key":"D","text":"坚定理论自信是为了确保维护政治安全的正确方向"}],"answer":["坚定理论自信是为了确保维护政治安全的正确方向"],"explanation":"正确答案：坚定理论自信是为了确保维护政治安全的正确方向\n为什么对：本题问关于理论自信说法错误的一项。该项把理论自信的功能说成确保维护政治安全的正确方向，把理论自信的来源和依据换成了对政治安全的作用，与理论自信的命题指向不一致，按题库答案判定为错误项。\n干扰项分析：“中国特色社会主义理论自信蕴含着中国共产党运用马克思主义正确回答时代和实践提出的重大问题的卓越理论能力”从理论回答时代之问的能力说明自信依据，成立；“中国特色社会主义理论自信源于中国特色社会主义伟大实践的深刻变革”从实践基础说明自信来源，成立；“中国特色社会主义理论自信源于马克思主义中国化时代化创新成果的科学性”从理论本身的科学性说明自信依据，成立。\n记忆：理论自信讲来源与依据，讲到政治安全作用就换了话题。\n依据：教材表述。","memoryTip":"理论自信讲来源与依据，讲到政治安全作用就换了话题。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-ry88362nvb","type":"choice","stem":"健全完整有效的国家科技体系，要牢牢把握科技进步大方向，强化( )，加快构筑支撑高端引领的先发优势，以完整有效的国家科技体系支撑建设科技强国和维护科技安全。","options":[{"key":"A","text":"创新导向和体系引导"},{"key":"B","text":"战略导向和目标引导"},{"key":"C","text":"战略导向和体系引导"},{"key":"D","text":"实力导向和目标引导"}],"answer":["战略导向和目标引导"],"explanation":"正确答案：战略导向和目标引导\n为什么对：健全完整有效的国家科技体系，要牢牢把握科技进步大方向，强化战略导向和目标引导。战略导向解决科技发展朝哪个方向用力，目标引导解决近期和长远要达成什么，二者结合才能构筑支撑高端引领的先发优势，以完整有效的科技体系支撑科技强国建设和科技安全维护。\n干扰项分析：「创新导向和体系引导」把导向放在创新上，与题干把握科技进步大方向的战略层面不符；「战略导向和体系引导」保留了战略导向，把目标引导换成体系引导，丢掉了目标牵引；「实力导向和目标引导」把战略导向换成实力导向，方向性被削弱。\n记忆：健全科技体系，强化战略导向和目标引导\n依据：教材表述","memoryTip":"健全科技体系，强化战略导向和目标引导","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-2o7ej4doyx2","type":"choice","stem":"要完整、准确、全面贯彻党的宗教信仰自由政策，尊重群众宗教信仰，依法管理宗教事务，坚持( )原则，积极引导宗教与社会主义社会相适应。","options":[{"key":"A","text":"协同治理"},{"key":"B","text":"独立自主自办"},{"key":"C","text":"独立自治自办"},{"key":"D","text":"独立自主自治"}],"answer":["独立自主自办"],"explanation":"正确答案：独立自主自办\n为什么对：我国宗教事务坚持独立自主自办原则，宗教团体、宗教院校、宗教活动场所和宗教事务不受外国势力支配。贯彻宗教信仰自由政策、依法管理宗教事务，都要在这一原则下进行，才能引导宗教与社会主义社会相适应。\n干扰项分析：「协同治理」是宗教事务管理的工作方式，替代不了处理对外关系的原则；「独立自治自办」把自主改成自治，改变了原则的表述；「独立自主自治」漏掉自办，同样缺了原则原话。三者都缺少宗教事务对外关系原则的规范表述。\n记忆：宗教事务对外原则是独立自主自办\n依据：《中华人民共和国国家安全法》第二十七条与《宗教事务条例》","memoryTip":"宗教事务对外原则是独立自主自办","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-qnug45hf0y","type":"choice","stem":"自2011年12月起，中国和老挝、缅甸、泰国执法部门共同开展湄公河联合巡逻执法，确保湄公河航运安全。截至2024年6月，共开展了( )次联合巡逻执法。","options":[{"key":"A","text":"150"},{"key":"B","text":"145"},{"key":"C","text":"146"},{"key":"D","text":"142"}],"answer":["142"],"explanation":"正确答案：142\n为什么对：自2011年12月首航以来，中老缅泰四国执法部门持续开展湄公河联合巡逻执法，到2024年6月累计开展142次。联巡执法覆盖湄公河重点水域，打击跨境违法犯罪，为澜沧江湄公河国际航运提供安全保障，题干问的正是这一累计次数。\n干扰项分析：「150」高出实际累计次数8次；「145」高出3次；「146」高出4次。三个数字都大于142，与截至2024年6月的累计次数不符。\n记忆：湄公河联合巡逻执法累计一百四十二次\n依据：教材表述","memoryTip":"湄公河联合巡逻执法累计一百四十二次","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-x338aycmd8o","type":"choice","stem":"加快建设现代化产业体系，要坚持把发展经济的着力点放在( )上，推动资源要素向实体经济集聚，推进新型工业化，形成具有可持续竞争力和支撑力的工业体系。","options":[{"key":"A","text":"虚拟经济"},{"key":"B","text":"制造业"},{"key":"C","text":"实体经济"},{"key":"D","text":"服务业"}],"answer":["实体经济"],"explanation":"正确答案：实体经济\n为什么对：加快建设现代化产业体系，要坚持把发展经济的着力点放在实体经济上。实体经济提供产品和服务，是就业和收入的基础，也是抵御外部冲击的根基；推动资源要素向实体经济集聚、推进新型工业化，才能形成具有可持续竞争力和支撑力的工业体系。\n干扰项分析：「虚拟经济」以金融和资产交易为主，脱离实体经济过度扩张会积累风险；「制造业」是实体经济的重要组成部分，范围窄于实体经济；「服务业」也包含在实体经济范围内，覆盖不了题干所指的整个着力点。\n记忆：发展经济的着力点放在实体经济上\n依据：党的二十大报告","memoryTip":"发展经济的着力点放在实体经济上","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-cfehsj92eu","type":"choice","stem":"( )是国家发展的最重要基石，也是各种安全形态中最大的安全。","options":[{"key":"A","text":"政治安全"},{"key":"B","text":"经济安全"},{"key":"C","text":"国家安全"},{"key":"D","text":"国土安全"}],"answer":["国家安全"],"explanation":"正确答案：国家安全\n为什么对：国家安全是国家发展的最重要基石，也是各种安全形态中最大的安全。国家安全的整体状态决定政治、经济、军事、科技、文化、社会等各领域安全能否成立，各领域安全都服务于国家安全这个整体，题干把国家安全放在基石和最大安全的位置。\n干扰项分析：「政治安全」是国家安全体系的根本，属于国家安全的一个领域；「经济安全」是国家安全的基础，同样是一个领域；「国土安全」是国家安全在领土空间上的体现。三者都是国家安全的组成部分，与各种安全形态中最大的安全不对应。\n记忆：国家安全是基石，也是最大的安全\n依据：教材表述","memoryTip":"国家安全既是基石，也是最大的安全","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-pxua8bh8yqq","type":"choice","stem":"无论是中国还是世界的经验都表明，只有( )才能推动高水平安全。","options":[{"key":"A","text":"高质量发展"},{"key":"B","text":"可持续发展"},{"key":"C","text":"深层次改革"},{"key":"D","text":"高水平开放"}],"answer":["高质量发展"],"explanation":"正确答案：高质量发展\n为什么对：中国和世界的经验都表明，只有高质量发展才能推动高水平安全。发展是安全的基础，产业的层次、科技的水平、治理的能力决定安全能力的上限；以高质量发展促进高水平安全，又以高水平安全保障高质量发展，这是统筹发展和安全的基本逻辑。\n干扰项分析：「可持续发展」是发展方式的要求，侧重资源环境的代际公平；「深层次改革」是发展的动力来源；「高水平开放」是发展的外部条件。三者都为高质量发展提供支撑，替代不了题干所问的发展形态。\n记忆：高质量发展才能推动高水平安全\n依据：教材表述","memoryTip":"只有高质量发展才能推动高水平安全","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-ejydzhwjgkw","type":"choice","stem":"必须自觉坚守人民立场，坚持和贯彻以人民为中心的发展思想，深入认识最大的国家安全是( )的安全。","options":[{"key":"A","text":"人民生命"},{"key":"B","text":"人民财产"},{"key":"C","text":"人民江山"},{"key":"D","text":"人民生活"}],"answer":["人民江山"],"explanation":"正确答案：人民江山\n为什么对：必须自觉坚守人民立场，坚持和贯彻以人民为中心的发展思想，深入认识最大的国家安全是人民江山的安全。江山就是人民，人民就是江山，守江山守的是人民的心；把人民生命、财产、生活等具体利益放在江山的整体上看，才能理解人民安全为什么是宗旨。\n干扰项分析：「人民生命」是人民安全中最基本的利益，范围限于生命安全；「人民财产」指向财产权益的保护；「人民生活」指向生活水平与民生保障。三者都是人民安全的具体内容，题干要的是统摄这些内容的整体表述。\n记忆：最大的国家安全是人民江山的安全\n依据：教材表述","memoryTip":"最大的国家安全是人民江山的安全","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-8z1h69b8n1p","type":"choice","stem":"总体国家安全观科学阐释了安全和发展( )的关系，强调二者要共同发力、同步推进、一体建设。","options":[{"key":"A","text":"辩证统一"},{"key":"B","text":"相互促进"},{"key":"C","text":"和谐共生"},{"key":"D","text":"对立统一"}],"answer":["辩证统一"],"explanation":"正确答案：辩证统一\n为什么对：总体国家安全观科学阐释了安全和发展辩证统一的关系，强调二者共同发力、同步推进、一体建设。安全是发展的前提，发展是安全的保障，二者互为条件、相互支撑，用辩证统一的表述才能说明这种既相区别又相联系的关系。\n干扰项分析：「相互促进」只讲了二者之间的正向作用，概括不了共同发力、一体建设的整体要求；「和谐共生」多用于人与自然关系的表述；「对立统一」突出矛盾双方的斗争性，与题干强调的协同推进不符。\n记忆：安全和发展是辩证统一、一体建设的关系\n依据：教材表述（统筹发展和安全的要求）","memoryTip":"安全和发展是辩证统一、一体建设的关系","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-4ma4yakp0wv","type":"choice","stem":"中国共产党的百余年奋斗历程和新时代党和国家事业取得的历史性成就、发生的历史性变革反复证明，没有( )，一切都无从谈起。","options":[{"key":"A","text":"改革和开放"},{"key":"B","text":"安全和稳定"},{"key":"C","text":"安全和发展"},{"key":"D","text":"发展和稳定"}],"answer":["安全和稳定"],"explanation":"正确答案：安全和稳定\n为什么对：中国共产党的百余年奋斗历程和新时代党和国家事业取得的历史性成就、发生的历史性变革反复证明，没有安全和稳定，一切都无从谈起。安全和稳定是国家生存发展的前提，失去这个前提，改革发展、民生改善都失去依托。\n干扰项分析：「改革和开放」是发展的动力，须以安全和稳定为条件；「安全和发展」把稳定并入安全，与题干没有一切都无从谈起的固定表述不符；「发展和稳定」漏掉安全，同样缺了题干原话。三者都不能完整复现这一表述。\n记忆：没有安全和稳定，一切都无从谈起\n依据：教材表述","memoryTip":"没有安全和稳定，一切事业都无从谈起","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-muxh1q87ah","type":"choice","stem":"( )领域是以货币为媒介交换商品的领域，连接生产和消费的两头，是社会生产不可或缺的一个环节。","options":[{"key":"A","text":"交易"},{"key":"B","text":"发行"},{"key":"C","text":"流通"},{"key":"D","text":"分配"}],"answer":["流通"],"explanation":"正确答案：流通\n为什么对：流通领域是以货币为媒介交换商品的领域，连接生产和消费的两头，是社会生产不可或缺的一个环节。商品在流通中完成价值实现，生产出来的产品才能进入消费，社会再生产才能持续进行，题干描述的正是流通的职能。\n干扰项分析：「交易」是一次具体的买卖行为，涵盖不了连接生产与消费的整个环节；「发行」指货币或证券的投放，属于金融活动的具体环节；「分配」指产品在社会成员之间的分割，处在生产与消费之间的另一环节。\n记忆：以货币为媒介、连接生产与消费的是流通\n依据：教材表述","memoryTip":"以货币为媒介、连接生产与消费的是流通","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-gwta458xelo","type":"choice","stem":"总体国家安全观坚持以人民安全为宗旨，是( )的发展思想的要求和体现。","options":[{"key":"A","text":"以人民为主导"},{"key":"B","text":"以国家为中心"},{"key":"C","text":"以人民为中心"},{"key":"D","text":"以国家为主导"}],"answer":["以人民为中心"],"explanation":"正确答案：以人民为中心\n为什么对：总体国家安全观坚持以人民安全为宗旨，是以人民为中心的发展思想的要求和体现。国家安全一切为了人民、一切依靠人民，维护国家安全的最终目的是人民福祉，题干把宗旨与发展思想联系起来，指向以人民为中心。\n干扰项分析：「以人民为主导」把人民的位置写成主导，与发展思想的规范表述不符；「以国家为中心」把国家安全与人民安全割裂开来；「以国家为主导」同样背离人民立场。三者都缺少发展思想的规范表述。\n记忆：人民安全为宗旨，源自以人民为中心\n依据：《中华人民共和国国家安全法》第三条与教材表述","memoryTip":"人民安全为宗旨，源自以人民为中心","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-7y4clvn2oco","type":"choice","stem":"以( )同志为核心的党中央在准确把握我国国家安全形势新特点、新趋势的基础上，统揽我国国家安全工作全局，创造性提出总体国家安全观。","options":[{"key":"A","text":"习近平"},{"key":"B","text":"胡锦涛"},{"key":"C","text":"江泽民"},{"key":"D","text":"邓小平"}],"answer":["习近平"],"explanation":"正确答案：习近平\n为什么对：2014年4月15日，习近平在中央国家安全委员会第一次会议上首次提出总体国家安全观。这一理念是以习近平同志为核心的党中央在准确把握我国国家安全形势新特点新趋势、统揽国家安全工作全局的基础上创造性提出的，成为新时代国家安全工作的根本遵循。\n干扰项分析：“胡锦涛”“江泽民”“邓小平”是改革开放以来不同时期的中央领导集体核心，各自在所处历史条件下推进了国家安全工作，但总体国家安全观这一重大理念的提出者，对应的是“以习近平同志为核心的党中央”这一固定表述。\n记忆：总体国家安全观，2014年春首提。\n依据：教材表述","memoryTip":"总体国家安全观，2014年4月由习近平首次提出。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-1gubp6m7atn","type":"choice","stem":"( )是国家安全的重要体现，一头连着经济社会发展，一头连着千家万户，是最基本的民生。","options":[{"key":"A","text":"文化安全"},{"key":"B","text":"公共安全"},{"key":"C","text":"生态安全"},{"key":"D","text":"经济安全"}],"answer":["公共安全"],"explanation":"正确答案：公共安全\n为什么对：公共安全是国家安全的重要体现，一头连着经济社会发展，一头连着千家万户，是最基本的民生。它涵盖安全生产、食品药品、公共卫生、社会治安等方面，直接关系每个人的生命健康和日常生活，是国家安全体系中贴近群众的安全防线。\n干扰项分析：“文化安全”关系意识形态和价值观，属于精神层面的安全；“生态安全”关系生态环境质量和资源承载能力；“经济安全”是国家安全的基础，指经济体系运行稳定、产业链供应链可靠。三者都重要，却都不承担题干所说的“连着千家万户、最基本的民生”这一定位。\n记忆：公共安全连着经济社会和千家万户。\n依据：教材表述","memoryTip":"公共安全连着经济社会和千家万户，是最基本的民生。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-ghldbty88nn","type":"choice","stem":"( )是更基础、更广泛和更深厚的自信，是凝聚人心、团结民众的精神血脉和根本纽带。","options":[{"key":"A","text":"理论自信"},{"key":"B","text":"道路自信"},{"key":"C","text":"制度自信"},{"key":"D","text":"文化自信"}],"answer":["文化自信"],"explanation":"正确答案：文化自信\n为什么对：文化自信是更基础、更广泛、更深厚的自信，是凝聚人心、团结民众的精神血脉和根本纽带。它植根于中华优秀传统文化、革命文化和社会主义先进文化，为道路自信、理论自信、制度自信提供深层支撑，也是更基本、更深沉、更持久的力量。\n干扰项分析：“理论自信”“道路自信”“制度自信”与文化自信共同构成“四个自信”，但题干中“更基础、更广泛、更深厚”是专用于文化自信的固定评价，其余三个自信没有这一表述，不能替换。\n记忆：文化自信，更基础、更广泛、更深厚。\n依据：教材表述","memoryTip":"文化自信，更基础、更广泛、更深厚的自信。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-wqybfes08pr","type":"choice","stem":"( )就是在总体国家安全观指导下形成的以保障、维护和塑造国家安全为主要目标的具有总体性的国家安全体系。","options":[{"key":"A","text":"新安全格局"},{"key":"B","text":"新发展阶段"},{"key":"C","text":"新发展理念"},{"key":"D","text":"新发展格局"}],"answer":["新安全格局"],"explanation":"正确答案：新安全格局\n为什么对：新安全格局是在总体国家安全观指导下形成的、以保障和维护塑造国家安全为主要目标的总体性国家安全体系。党的二十大报告提出“以新安全格局保障新发展格局”，把安全格局与发展格局对应起来，强调安全要为发展提供保障，发展要为安全奠定基础。\n干扰项分析：“新发展阶段”是我国发展的历史方位；“新发展理念”是创新、协调、绿色、开放、共享的指导原则；“新发展格局”是以国内大循环为主体、国内国际双循环相互促进的发展布局。三者都属于发展范畴，不能用来指称国家安全体系。\n记忆：新安全格局保障新发展格局。\n依据：党的二十大报告","memoryTip":"新安全格局保障新发展格局，安全服务发展。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-e3786neooou","type":"choice","stem":"( )是现代化国家的物质技术基础，是实现经济现代化的重要标志。","options":[{"key":"A","text":"现代化产业体系"},{"key":"B","text":"现代化市场体系"},{"key":"C","text":"数字集群"},{"key":"D","text":"完善的制度体系"}],"answer":["现代化产业体系"],"explanation":"正确答案：现代化产业体系\n为什么对：现代化产业体系是现代化国家的物质技术基础，是实现经济现代化的重要标志。它要求把发展经济的着力点放在实体经济上，推动制造业高端化、智能化、绿色化，巩固传统产业优势，培育战略性新兴产业，为国家发展和安全提供坚实支撑。\n干扰项分析：“现代化市场体系”解决的是要素交易和资源配置机制；“数字集群”是产业发展的一种组织形态；“完善的制度体系”属于治理保障和上层建筑。三者都不能充当“物质技术基础”这一角色。\n记忆：现代化产业体系，现代化国家的物质技术基础。\n依据：教材表述","memoryTip":"现代化产业体系，现代化国家的物质技术基础。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-9wjhxbao7a7","type":"choice","stem":"实践充分证明，我国全过程人民民主是( )的民主，开创了人类民主的新形态。","options":[{"key":"A","text":"全链条、全领域、全覆盖"},{"key":"B","text":"全链条、全方位、全领域"},{"key":"C","text":"全链条、全方位、全覆盖"},{"key":"D","text":"全领域、全方位、全覆盖"}],"answer":["全链条、全方位、全覆盖"],"explanation":"正确答案：全链条、全方位、全覆盖\n为什么对：全过程人民民主是全链条、全方位、全覆盖的民主，实现了过程民主和成果民主、程序民主和实质民主、直接民主和间接民主、人民民主和国家意志相统一，开创了人类民主的新形态，是最广泛、最真实、最管用的社会主义民主。\n干扰项分析：“全链条、全领域、全覆盖”“全链条、全方位、全领域”“全领域、全方位、全覆盖”三组表述都在改动固定搭配，有的把“全方位”换成“全领域”，有的把“全覆盖”换成“全领域”，用词和组合都与官方概括不一致，属于拼凑干扰。\n记忆：全过程人民民主，全链条、全方位、全覆盖。\n依据：教材表述","memoryTip":"全过程人民民主：全链条、全方位、全覆盖。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-lccmv1jtcz","type":"choice","stem":"( )对总体国家安全观作了进一步阐述，强调要把握好国家安全工作的\"五个统筹\"。","options":[{"key":"A","text":"党的十九届六中全会"},{"key":"B","text":"党的十九届五中全会"},{"key":"C","text":"党的十九届四中全会"},{"key":"D","text":"党的十九届三中全会"}],"answer":["党的十九届六中全会"],"explanation":"正确答案：党的十九届六中全会\n为什么对：党的十九届六中全会通过《中共中央关于党的百年奋斗重大成就和历史经验的决议》，对党百年奋斗的重大成就和历史经验作出系统总结，其中对总体国家安全观作了进一步阐述，强调把握好国家安全工作的“五个统筹”，即统筹发展和安全、统筹开放和安全、统筹传统安全和非传统安全、统筹自身安全和共同安全、统筹维护和塑造国家安全。\n干扰项分析：“党的十九届五中全会”主要审议“十四五”规划建议；“党的十九届四中全会”聚焦坚持和完善中国特色社会主义制度、推进国家治理体系和治理能力现代化；“党的十九届三中全会”聚焦党和国家机构改革。三次全会各有主题，均未承担题干所说的任务。\n记忆：十九届六中全会提出五个统筹。\n依据：教材表述","memoryTip":"十九届六中全会提出五个统筹，把握国家安全工作。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-y59a9oiy72","type":"choice","stem":"经济全球化是推动世界经济增长的引擎，虽然它带来了新问题，但不能就此把经济全球化一棍子打死，必须坚决反对( )行为和思潮，消解经济全球化的负面影响，引导经济全球化健康发展。","options":[{"key":"A","text":"单边主义"},{"key":"B","text":"贸易保护主义"},{"key":"C","text":"排外主义"},{"key":"D","text":"逆全球化"}],"answer":["逆全球化"],"explanation":"正确答案：逆全球化\n为什么对：经济全球化是推动世界经济增长的引擎。它带来新问题，需要通过完善全球治理加以解决，不能因此否定经济全球化本身。教材要求坚决反对逆全球化的行为和思潮，消解经济全球化的负面影响，引导经济全球化健康发展，让发展成果惠及各国人民。\n干扰项分析：“单边主义”指个别国家绕开多边机制自行其是；“贸易保护主义”指设置关税和非关税壁垒限制贸易；“排外主义”指排斥外来人口、文化和商品。三者都是逆全球化的具体表现或政策工具，题干要求填的是能够涵盖“行为和思潮”的总体概念。\n记忆：经济全球化有问题，要反对逆全球化思潮。\n依据：教材表述","memoryTip":"经济全球化有问题，要反对逆全球化思潮。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-1u38abdxdath","type":"choice","stem":"在坚持安全和发展并重、维护和塑造国家安全统一中实现安全效果上的( )，成为总体国家安全观的鲜明特征。","options":[{"key":"A","text":"全面性"},{"key":"B","text":"系统性"},{"key":"C","text":"统筹性"},{"key":"D","text":"可持续性"}],"answer":["可持续性"],"explanation":"正确答案：可持续性\n为什么对：总体国家安全观坚持安全和发展并重、维护和塑造国家安全相统一，追求安全效果上的可持续性，即安全能够长期维持、不断巩固，经受住风险挑战的反复冲击。这一特征使国家安全工作着眼于长远，避免只顾眼前、透支未来的做法。\n干扰项分析：“全面性”指安全领域覆盖广泛；“系统性”指各领域安全相互关联、构成整体；“统筹性”指统筹处理各类安全关系。三者都是总体国家安全观的特征，但题干中“安全效果上的”这一限定指向安全能否持久，对应可持续性。\n记忆：安全效果要长久，可持续性是鲜明特征。\n依据：教材表述","memoryTip":"安全效果要长久，可持续性是鲜明特征。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-u429mzfyz9l","type":"choice","stem":"当今世界，全球科技创新进入空前密集活跃的时期。以( )为目标的能源技术加速发展将引发全球能源变革。","options":[{"key":"A","text":"绿色化"},{"key":"B","text":"智能化"},{"key":"C","text":"服务化"},{"key":"D","text":"清洁高效可持续"}],"answer":["清洁高效可持续"],"explanation":"正确答案：清洁高效可持续\n为什么对：全球科技创新进入密集活跃期，能源技术以清洁、高效、可持续为目标加速突破，推动能源结构、能源生产和消费方式发生深刻变革，引发全球能源变革。这一目标兼顾减少污染、提高利用效率和保障长期供给三个方面。\n干扰项分析：“绿色化”只强调环境友好一个维度；“智能化”强调数字技术与能源系统融合；“服务化”强调能源业态向服务延伸。三者都是能源变革的表现或手段，不能完整概括能源技术发展的目标定位。\n记忆：能源技术以清洁高效可持续为目标发展。\n依据：教材表述","memoryTip":"能源技术以清洁高效可持续为目标发展。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-v5oce32dy2","type":"choice","stem":"全面提高国家综合防灾减灾救灾能力要坚持( )，坚持常态减灾和非常态救灾相统一，努力实现从注重灾后救助向注重灾前预防转变，从应对单一灾种向综合减灾转变，从减少灾害损失向减轻灾害风险转变，全面提升全社会抵御自然灾害的综合防范能力。","options":[{"key":"A","text":"以救为主、防救相结合"},{"key":"B","text":"以减灾为主、防救相结合"},{"key":"C","text":"以防为主、防抗救相结合"},{"key":"D","text":"以救为主、防抗相结合"}],"answer":["以防为主、防抗救相结合"],"explanation":"正确答案：以防为主、防抗救相结合\n为什么对：防灾减灾救灾工作坚持以防为主、防抗救相结合，坚持常态减灾和非常态救灾相统一，推动从注重灾后救助向注重灾前预防转变、从应对单一灾种向综合减灾转变、从减少灾害损失向减轻灾害风险转变，全面提升全社会抵御自然灾害的综合防范能力。\n干扰项分析：“以救为主、防救相结合”“以减灾为主、防救相结合”“以救为主、防抗相结合”都把重心放在灾后救助或减灾环节，与预防为主的方针相反，也缺少“防抗救”三位一体的完整表述。\n记忆：防灾减灾坚持以防为主、防抗救相结合。\n依据：教材表述","memoryTip":"防灾减灾坚持以防为主、防抗救相结合。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-sq7x3s0k3j","type":"choice","stem":"主张\"治乱安危，存亡荣辱之施，非一人之力也\"，体现了中华优秀传统战略文化( )。","options":[{"key":"A","text":"推崇张弛有度"},{"key":"B","text":"重视群策群力"},{"key":"C","text":"力求内外兼顾"},{"key":"D","text":"看重内省慎独"}],"answer":["重视群策群力"],"explanation":"正确答案：重视群策群力\n为什么对：“治乱安危，存亡荣辱之施，非一人之力也”意思是国家的治乱安危、存亡荣辱，靠的不只是君主一个人的力量。这句话把治理成效归于众人合力，体现中华优秀传统战略文化重视群策群力、依靠集体智慧的价值取向。\n干扰项分析：“推崇张弛有度”讲的是节奏收放有节；“力求内外兼顾”讲的是对内对外两方面兼顾；“看重内省慎独”讲的是个人修养和自律。三者分别指向治理节奏、内外关系和个人德行，与题干强调的“非一人之力”不合。\n记忆：治乱安危非一人之力，故重视群策群力。\n依据：教材表述","memoryTip":"治乱安危非一人之力，故重视群策群力。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-yl89ys4pa8","type":"choice","stem":"2008年国际金融危机是典型的由( )风险引发的危机。","options":[{"key":"A","text":"\"大白象\""},{"key":"B","text":"\"灰犀牛\""},{"key":"C","text":"\"大白鲨\""},{"key":"D","text":"\"黑天鹅\""}],"answer":["\"灰犀牛\""],"explanation":"正确答案：“灰犀牛”\n为什么对：2008年国际金融危机爆发前，金融体系杠杆过高、房地产泡沫、监管缺失等问题长期积累，风险信号明显却未被及时处置，属于发生概率很大、影响巨大的潜在危机，符合“灰犀牛”的含义。危机的成因具有可预见性，是长期积累的风险集中释放。\n干扰项分析：“黑天鹅”指发生概率很小但影响巨大的事件，与本次危机风险长期积累、早有预警的特征不符；“大白象”指维护成本高昂而价值有限的资产或项目；“大白鲨”并非风险管理的规范术语。三者都不能准确概括2008年国际金融危机的成因特征。\n记忆：风险长期积累、早有预警，是典型的灰犀牛。\n依据：教材表述","memoryTip":"风险长期积累、早有预警，是典型的灰犀牛。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-u5vp8zsjmma","type":"choice","stem":"在国家安全体系中，( )与人民群众切身利益关系最密切，是人民群众安全感的晴雨表和社会安定的风向标。","options":[{"key":"A","text":"军事安全"},{"key":"B","text":"社会安全"},{"key":"C","text":"科技安全"},{"key":"D","text":"经济安全"}],"answer":["社会安全"],"explanation":"正确答案：社会安全\n为什么对：社会安全与人民群众切身利益关系最密切，涵盖社会治安、公共安全、社会矛盾化解等方面，直接体现为群众的安全感，因此被称为人民群众安全感的晴雨表和社会安定的风向标。社会安全稳固，国家安全才有坚实的社会基础。\n干扰项分析：“军事安全”关系主权和领土完整，是保底手段；“科技安全”关系关键核心技术和产业竞争力；“经济安全”是国家安全的基础，关系经济体系稳定运行。三者都关系国家全局，却不直接以群众日常感受作为衡量尺度。\n记忆：社会安全连着群众利益，是晴雨表和风向标。\n依据：教材表述","memoryTip":"社会安全连着群众利益，是晴雨表和风向标。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-72uucfgq8l8","type":"choice","stem":"经人类开发利用后，在短期内无法恢复的资源，称为( )。","options":[{"key":"A","text":"不可再生资源"},{"key":"B","text":"可再生资源"},{"key":"C","text":"自然资源"},{"key":"D","text":"稀缺资源"}],"answer":["不可再生资源"],"explanation":"正确答案：不可再生资源\n为什么对：不可再生资源指经人类开发利用后，在短期内无法恢复的资源，如煤炭、石油、天然气和多数矿产资源。它们的形成需要漫长地质年代，储量有限，用完难以再生，因此开发利用必须节约集约、提高效率并积极寻找替代。\n干扰项分析：“可再生资源”指在合理利用条件下能够自我更新或循环再生的资源，如森林、水、太阳能；“自然资源”是包括可再生与不可再生资源在内的上位概念；“稀缺资源”按供求关系划分，强调供给相对不足，与能否再生无关。\n记忆：开发利用后短期无法恢复，称不可再生资源。\n依据：教材表述","memoryTip":"开发利用后短期无法恢复，称不可再生资源。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-x4a278i0hg","type":"choice","stem":"推进国家安全体系和能力现代化必须与时俱进，不断创新安全工作( )、体制机制、手段方法。","options":[{"key":"A","text":"民意基础"},{"key":"B","text":"领导机关"},{"key":"C","text":"战略战术"},{"key":"D","text":"法律依据"}],"answer":["战略战术"],"explanation":"正确答案：战略战术\n为什么对：推进国家安全体系和能力现代化必须与时俱进，不断创新安全工作战略战术、体制机制、手段方法。战略战术解决谋划和打法问题，体制机制解决组织运转问题，手段方法解决技术工具问题，三者配套推进，才能提高国家安全治理效能。\n干扰项分析：“民意基础”是国家安全工作的社会支撑，需要巩固，却属于群众基础范畴；“领导机关”是组织载体，其设置归入体制机制；“法律依据”是依法开展工作的规范来源。三者都不能与“体制机制、手段方法”构成并列的创新内容。\n记忆：安全工作要创新战略战术、体制机制、手段方法。\n依据：教材表述","memoryTip":"安全工作要创新战略战术、体制机制、手段方法。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-4ci7q3fduvx","type":"choice","stem":"以下说法错误的是( )。","options":[{"key":"A","text":"当前，非传统安全威胁持续蔓延"},{"key":"B","text":"当前，传统安全威胁已经消除"},{"key":"C","text":"当前，传统和非传统安全威胁相互交织"},{"key":"D","text":"只有发展才会带来真正的安全"}],"answer":["当前，传统安全威胁已经消除"],"explanation":"正确答案：当前，传统安全威胁已经消除\n为什么对：题干预设为选出错误说法。当前传统安全威胁依然存在，霸权主义、强权政治、领土和海洋权益争端、地区冲突等仍在发生，传统安全威胁没有消除，并与非传统安全威胁相互交织，所以“已经消除”的判断与客观形势相反。\n干扰项分析：“当前，非传统安全威胁持续蔓延”符合疫情、气候变化、网络攻击、金融风险等挑战加剧的现实；“当前，传统和非传统安全威胁相互交织”符合总体国家安全观对安全形势的基本判断；“只有发展才会带来真正的安全”强调发展是安全的基础，安全要靠发展来保障，与统筹发展和安全的表述一致。\n记忆：传统安全威胁未消除，两类威胁相互交织。\n依据：教材表述","memoryTip":"传统安全威胁未消除，两类威胁相互交织。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-plqozl14iaq","type":"choice","stem":"要坚持( )相结合，引导广大人民群众认真学习贯彻总体国家安全观，增强国家安全意识，提升维护国家安全的能力。","options":[{"key":"A","text":"正面性教育和重点性教育"},{"key":"B","text":"集中性教育和重点性教育"},{"key":"C","text":"正面性教育和经常性教育"},{"key":"D","text":"集中性教育和经常性教育"}],"answer":["集中性教育和经常性教育"],"explanation":"正确答案：集中性教育和经常性教育\n为什么对：国家安全教育要坚持集中性教育和经常性教育相结合。集中性教育依托全民国家安全教育日等节点，形成声势、突出重点；经常性教育融入日常教学、宣传和工作，持续用力、久久为功。两者结合，才能引导群众学习贯彻总体国家安全观，增强意识、提升能力。\n干扰项分析：“正面性教育和重点性教育”“集中性教育和重点性教育”“正面性教育和经常性教育”都把“重点性教育”或“正面性教育”塞进固定搭配。国家安全教育当然要坚持正面引导、突出重点，但题干所问的教育方式组合，规范表述是集中性教育与经常性教育。\n记忆：国家安全教育，集中性与经常性相结合。\n依据：教材表述","memoryTip":"国家安全教育，集中性与经常性相结合。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-r7nuol5uj5c","type":"choice","stem":"做好新时代国家安全工作，必须毫不动摇地坚持( )这一根本原则。","options":[{"key":"A","text":"总体国家安全观"},{"key":"B","text":"深化改革开放"},{"key":"C","text":"党对国家安全工作的绝对领导"},{"key":"D","text":"全面依法治国"}],"answer":["党对国家安全工作的绝对领导"],"explanation":"正确答案：党对国家安全工作的绝对领导\n为什么对：中国共产党领导是中国特色社会主义最本质的特征，党对国家安全工作的绝对领导是做好新时代国家安全工作的根本原则。国家安全工作事关全局，必须坚持党中央集中统一领导，形成集中统一、高效权威的国家安全领导体制，确保国家安全工作始终沿着正确方向前进。\n干扰项分析：“总体国家安全观”是新时代国家安全工作的指导思想；“深化改革开放”是推动发展的路径举措；“全面依法治国”是治国理政的基本方略。三者分别属于指导思想、发展路径和治理方略，题干所问的“根本原则”对应党的领导。\n记忆：国安工作千头万绪，党的绝对领导是根本。\n依据：《中华人民共和国国家安全法》第四条；教材表述","memoryTip":"国安工作千头万绪，党的绝对领导是根本。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-jnsi72qrimh","type":"choice","stem":"生物、太空、深海、极地、金融、粮食等领域安全都是随着国家安全实践的发展而被纳入的。这生动体现了总体国家安全观的( )特征。","options":[{"key":"A","text":"统筹性"},{"key":"B","text":"系统性"},{"key":"C","text":"可持续性"},{"key":"D","text":"全面性"}],"answer":["全面性"],"explanation":"正确答案：全面性\n为什么对：总体国家安全观涵盖政治、军事、国土、经济、金融、文化、社会、科技、网络、粮食、生态、资源、核、海外利益、太空、深海、极地、生物、人工智能等诸多领域，并随实践发展不断扩展。领域不断被纳入，说明安全工作覆盖全局，体现全面性特征。\n干扰项分析：“系统性”强调各领域安全相互联系、构成有机整体；“统筹性”强调统筹处理发展和安全、外部和内部等重大关系；“可持续性”强调安全效果能够长期维持。三者都不直接回答安全领域范围不断扩展这一现象。\n记忆：安全领域不断扩展，体现全面性特征。\n依据：教材表述","memoryTip":"安全领域不断扩展，体现全面性特征。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-u9o6brliic8","type":"choice","stem":"在文化权益保障上，推进社会主义文化强国建设。坚持把( )放在首位，推进社会效益和经济效益相统一，深化文化体制改革，完善文化经济政策，促进文化事业和文化产业全面发展，全面保障人民群众的文化权益。","options":[{"key":"A","text":"优质精神产品"},{"key":"B","text":"社会效益"},{"key":"C","text":"经济效益"},{"key":"D","text":"权益保护"}],"answer":["社会效益"],"explanation":"正确答案：社会效益\n为什么对：推进社会主义文化强国建设，坚持把社会效益放在首位，社会效益和经济效益相统一。文化产品具有意识形态属性，首先要看是否有利于弘扬社会主义核心价值观、满足人民精神文化需求；在此基础上再讲经济效益，实现两个效益的统一。\n干扰项分析：“优质精神产品”是文化建设要提供的成果；“经济效益”若放在首位，就颠倒了文化建设的价值次序；“权益保护”是文化建设要保障的结果。三者都不能填入“把……放在首位”这一固定表述。\n记忆：文化建设把社会效益放在首位，两个效益统一。\n依据：教材表述","memoryTip":"文化建设把社会效益放在首位，两个效益统一。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-5cgfexs9ytd","type":"choice","stem":"在新时代新征程上，我们必须增强( )、始终居安思危，贯彻总体国家安全观，统筹发展和安全。","options":[{"key":"A","text":"核心意识"},{"key":"B","text":"大局意识"},{"key":"C","text":"忧患意识"},{"key":"D","text":"看齐意识"}],"answer":["忧患意识"],"explanation":"正确答案：忧患意识\n为什么对：新时代新征程上，必须增强忧患意识、始终居安思危，贯彻总体国家安全观，统筹发展和安全。忧患意识要求清醒认识风险挑战，做到居安思危、未雨绸缪，把防范化解重大风险摆在突出位置，为应对各种不确定因素做好思想准备和工作准备。\n干扰项分析：“核心意识”“大局意识”“看齐意识”与“政治意识”共同构成“四个意识”，是政治建设的要求，与“居安思危”所要求的风险警觉不属于同一层面的表述。\n记忆：新时代必须居安思危，增强忧患意识。\n依据：党的二十大报告","memoryTip":"新时代必须居安思危，增强忧患意识。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-bzfgk6stfut","type":"choice","stem":"党的二十大报告提出推进国家安全体系和能力现代化总要求，其中强调要以( )为宗旨。","options":[{"key":"A","text":"政治安全"},{"key":"B","text":"促进国际安全"},{"key":"C","text":"人民安全"},{"key":"D","text":"经济安全"}],"answer":["人民安全"],"explanation":"正确答案：人民安全\n为什么对：党的二十大报告提出推进国家安全体系和能力现代化的总要求，强调坚持以人民安全为宗旨、以政治安全为根本、以经济安全为基础、以军事科技文化社会安全为保障、以促进国际安全为依托。人民安全居于宗旨位置，回答国家安全为了谁、依靠谁的问题。\n干扰项分析：“政治安全”是根本；“经济安全”是基础；“促进国际安全”是依托。三者分别对应总体国家安全观五大要素中的其他位置，都不能填入“为宗旨”的位置。\n记忆：人民安全居宗旨之位，政治安全是根本。\n依据：党的二十大报告；《中华人民共和国国家安全法》第三条","memoryTip":"人民安全居宗旨之位，政治安全是根本。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-84847ndyop","type":"choice","stem":"安全问题是( )，只顾一个国家安全而罔顾其他国家安全，牺牲别国安全谋求自身的所谓绝对安全，不仅是不可取的，而且最终会贻害自己。","options":[{"key":"A","text":"复杂的、综合的"},{"key":"B","text":"相对的、关联的"},{"key":"C","text":"多方的、持久的"},{"key":"D","text":"双向的、联动的"}],"answer":["双向的、联动的"],"explanation":"正确答案：双向的、联动的\n为什么对：安全问题是双向的、联动的。各国安全相互联系、相互影响，一国安全不能建立在别国不安全的基础之上。只顾自身安全、牺牲别国安全谋求绝对安全，既损害他国，也会反噬自身，最终没有赢家。这一判断是共同安全理念的重要依据。\n干扰项分析：“复杂的、综合的”描述安全问题的构成特点；“多方的、持久的”描述参与主体和持续时间；“相对的、关联的”与“联动的”意思接近，但官方固定表述是“双向的、联动的”，词语组合不能替换。\n记忆：安全问题双向联动，各国不能独善其身。\n依据：教材表述","memoryTip":"安全问题双向联动，各国不能独善其身。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-6ngi2qmmql7","type":"choice","stem":"关于推进国家安全体系和能力现代化，以下说法有误的是( )。","options":[{"key":"A","text":"是满足人民群众美好生活需要的必然要求"},{"key":"B","text":"是以中国式现代化全面推进中华民族伟大复兴的必然要求"},{"key":"C","text":"是与发达国家安全理念和体系接轨的必然要求"},{"key":"D","text":"是推进国家治理体系和治理能力现代化、续写\"中国之治\"新辉煌的必然要求"}],"answer":["是与发达国家安全理念和体系接轨的必然要求"],"explanation":"正确答案：是与发达国家安全理念和体系接轨的必然要求\n为什么对：题干预设为选出错误说法。推进国家安全体系和能力现代化，是立足中国国情、走中国特色国家安全道路的必然选择，目的在于满足人民美好生活需要、服务中国式现代化、推进国家治理体系和治理能力现代化。它没有同发达国家安全理念和体系接轨的目标，各国安全道路由本国国情决定。\n干扰项分析：“是满足人民群众美好生活需要的必然要求”“是以中国式现代化全面推进中华民族伟大复兴的必然要求”“是推进国家治理体系和治理能力现代化、续写‘中国之治’新辉煌的必然要求”分别从民生需要、民族复兴、治理现代化三个角度说明必要性，均符合官方表述。\n记忆：安全现代化走中国道路，无接轨之说。\n依据：教材表述","memoryTip":"安全现代化走中国道路，无接轨之说。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-i7ewcsm1tc","type":"choice","stem":"( )是推动历史发展和社会进步的重要力量，其发展水平反映了一个民族的思维能力、精神品格、文明素质，体现了一个国家的综合国力和国际竞争力。","options":[{"key":"A","text":"思想道德水平"},{"key":"B","text":"科技创新"},{"key":"C","text":"中华优秀传统文化"},{"key":"D","text":"哲学社会科学"}],"answer":["哲学社会科学"],"explanation":"正确答案：哲学社会科学\n为什么对：哲学社会科学是推动历史发展和社会进步的重要力量，其发展水平反映一个民族的思维能力、精神品格、文明素质，体现一个国家的综合国力和国际竞争力。它帮助人们认识社会规律、把握发展方向，为国家治理和文明进步提供思想支撑。\n干扰项分析：“思想道德水平”是人的素质表现，属于哲学社会科学发展要影响的方面；“科技创新”是推动发展的重要力量，但题干后面的“思维能力、精神品格、文明素质”更贴合哲学社会科学的属性；“中华优秀传统文化”是文化资源，不是题干所问的力量主体。\n记忆：哲学社会科学水平，反映思维能力和文明素质。\n依据：教材表述","memoryTip":"哲学社会科学水平，反映思维能力和文明素质。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-j3tsnec6q4b","type":"choice","stem":"只有整个国际社会形成了( )安全环境，各国国家安全才会有稳固的可靠依托，各个领域的安全才能得到切实的保障和维护。","options":[{"key":"A","text":"可预期的"},{"key":"B","text":"多维度的"},{"key":"C","text":"稳定的"},{"key":"D","text":"可持续的、良好的"}],"answer":["可持续的、良好的"],"explanation":"正确答案：可持续的、良好的\n为什么对：只有整个国际社会形成可持续的、良好的安全环境，各国国家安全才会有稳固的可靠依托，各个领域的安全才能得到切实保障和维护。这一判断说明国家安全离不开国际安全，促进国际安全是总体国家安全观五大要素中的依托。\n干扰项分析：“可预期的”强调稳定预期；“多维度的”强调安全覆盖多个维度；“稳定的”只讲状态不变。三者都只触及国际安全环境的某一方面，官方固定表述是“可持续的、良好的安全环境”。\n记忆：国际社会形成可持续、良好的安全环境。\n依据：教材表述","memoryTip":"国际社会形成可持续、良好的安全环境。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-f2an6adoqhe","type":"choice","stem":"以下不属于\"颜色革命\"的是( )。","options":[{"key":"A","text":"2003年格鲁吉亚的\"玫瑰革命\""},{"key":"B","text":"2005年吉尔吉斯斯坦的\"郁金香革命\""},{"key":"C","text":"2014年乌克兰的\"广场革命\""},{"key":"D","text":"18世纪末的法国大革命"}],"answer":["18世纪末的法国大革命"],"explanation":"正确答案：18世纪末的法国大革命\n为什么对：题干预设为选出不属于“颜色革命”的选项。颜色革命指21世纪初在一些国家发生的、以某种颜色或花卉命名、由外部势力推波助澜、通过街头抗议推动政权更迭的事件。18世纪末的法国大革命是反对封建专制的资产阶级革命，发生时间、性质、动因都与颜色革命不同。\n干扰项分析：“2003年格鲁吉亚的‘玫瑰革命’”“2005年吉尔吉斯斯坦的‘郁金香革命’”“2014年乌克兰的‘广场革命’”都以颜色或花卉命名，都表现为大规模街头抗议推动政权更迭，并被普遍归入颜色革命范畴，都不符合“不属于”的要求。\n记忆：颜色革命发生在当代，法国大革命不属。\n依据：教材表述","memoryTip":"颜色革命发生在当代，法国大革命不属。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-u0hif7wktj8","type":"choice","stem":"维护人民安全首要的是保护人民群众的( )安全。","options":[{"key":"A","text":"生命"},{"key":"B","text":"健康"},{"key":"C","text":"信息"},{"key":"D","text":"财产"}],"answer":["生命"],"explanation":"正确答案：生命\n为什么对：维护人民安全首要的是保护人民群众的生命安全。生命权是公民最基本、最根本的权利，失去生命，其他权利无从谈起。国家安全工作坚持以人民安全为宗旨，就要把保护人民生命安全摆在第一位，在安全生产、防灾减灾、公共卫生等工作中守住生命底线。\n干扰项分析：“健康”是生命质量的延伸，属于人民安全的重要内容；“信息”关系个人信息和数据权益；“财产”关系物质利益。三者都受法律保护，但题干中“首要”对应的是生命安全。\n记忆：维护人民安全，首要保护群众生命安全。\n依据：《中华人民共和国国家安全法》第十六条；教材表述","memoryTip":"维护人民安全，首要保护群众生命安全。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-7w81ynvb1q","type":"choice","stem":"坚持( )是维护经济发展道路安全的关键，也是维护国家安全的重要基石。","options":[{"key":"A","text":"独立自主"},{"key":"B","text":"和平发展"},{"key":"C","text":"改革开放"},{"key":"D","text":"社会主义基本经济制度"}],"answer":["改革开放"],"explanation":"正确答案：改革开放\n为什么对：坚持改革开放是维护经济发展道路安全的关键，也是维护国家安全的重要基石。改革破除体制机制障碍，激发发展活力；开放利用两个市场、两种资源，提升国际竞争力。通过改革开放不断壮大经济实力，才能为维护国家安全提供坚实物质基础。\n干扰项分析：“独立自主”是我国外交政策和发展道路的重要原则；“和平发展”是对外战略选择；“社会主义基本经济制度”是经济发展的制度基础。三者都关系经济安全，题干中“关键”和“重要基石”对应的固定表述是改革开放。\n记忆：坚持改革开放，是经济道路安全的关键。\n依据：教材表述","memoryTip":"坚持改革开放，是经济道路安全的关键。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-67gozsqfxqe","type":"choice","stem":"在贯彻党的民族政策和宗教政策过程中，必须严密防范和严厉打击\"三股势力\"，坚持在涉民族和宗教问题上的( )，提升我国民族和宗教工作的国际话语权，不断筑牢民族和宗教领域的思想阵地。","options":[{"key":"A","text":"斗争精神"},{"key":"B","text":"包容精神"},{"key":"C","text":"开放精神"},{"key":"D","text":"疏导方针"}],"answer":["斗争精神"],"explanation":"正确答案：斗争精神\n为什么对：在贯彻党的民族政策和宗教政策过程中，必须严密防范和严厉打击“三股势力”，坚持在涉民族和宗教问题上的斗争精神，提升我国民族和宗教工作的国际话语权，不断筑牢民族和宗教领域的思想阵地。面对分裂渗透，必须旗帜鲜明、敢于斗争。\n干扰项分析：“包容精神”和“开放精神”是对待不同民族、不同文化交流互鉴的态度，不能替代对“三股势力”的防范打击；“疏导方针”是处理人民内部矛盾、开展思想教育的方法。三者都不能回应题干中“严密防范和严厉打击”的斗争要求。\n记忆：涉民族宗教问题，必须坚持斗争精神。\n依据：教材表述","memoryTip":"涉民族宗教问题，必须坚持斗争精神。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-yo4izx8hlar","type":"choice","stem":"在改革开放和社会主义现代化建设新时期，面对时代主题向和平与发展的深刻转变，中国共产党把( )确立为党和国家的中心任务，开启了改革开放伟大历程。","options":[{"key":"A","text":"经济建设"},{"key":"B","text":"文化建设"},{"key":"C","text":"社会建设"},{"key":"D","text":"政治建设"}],"answer":["经济建设"],"explanation":"正确答案：经济建设\n为什么对：改革开放和社会主义现代化建设新时期，面对时代主题向和平与发展的深刻转变，党把经济建设确立为党和国家的中心任务，作出把党和国家工作中心转移到经济建设上来、实行改革开放的历史性决策，开启了改革开放伟大历程。\n干扰项分析：“文化建设”“社会建设”“政治建设”都是社会主义现代化建设总体布局中的重要方面，但党在改革开放初期确立的中心任务是经济建设，其他建设围绕并服务于这一中心。\n记忆：改革开放新时期，中心任务是经济建设。\n依据：教材表述","memoryTip":"改革开放新时期，中心任务是经济建设。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-viljbj4ss7","type":"choice","stem":"人们常用( )比喻发生概率很大且影响巨大的潜在危机。","options":[{"key":"A","text":"\"灰犀牛\""},{"key":"B","text":"\"大白鲨\""},{"key":"C","text":"\"拦路虎\""},{"key":"D","text":"\"黑天鹅\""}],"answer":["\"灰犀牛\""],"explanation":"正确答案：“灰犀牛”\n为什么对：“灰犀牛”比喻发生概率很大且影响巨大的潜在危机。这类风险信号明显、早有征兆，却因侥幸心理或利益掣肘未被及时处置，一旦触发就造成严重损失。防范“灰犀牛”，要求增强风险意识，及早识别、主动化解。\n干扰项分析：“黑天鹅”比喻发生概率很小但影响巨大的事件；“大白鲨”并非风险管理的规范术语；“拦路虎”是日常比喻，指前进道路上的障碍，没有概率大、影响大的特定含义。\n记忆：发生概率很大且影响巨大，称灰犀牛。\n依据：教材表述","memoryTip":"发生概率很大且影响巨大，称灰犀牛。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt"
