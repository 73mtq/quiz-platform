<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#a33b28">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>国家安全教育题库</title>
  <style>
:root {
  --ink: #221815;
  --muted: #71625c;
  --paper: #f7f1e8;
  --surface: #fffaf4;
  --line: #dfd0c0;
  --line-soft: #ebdfd2;
  --accent: #a33b28;
  --accent-strong: #842f21;
  --accent-soft: rgba(163, 59, 40, 0.09);
  --danger: #a62e3b;
  --danger-soft: #fde8e6;
  --success: #2f7a46;
  --success-soft: #e2f2e7;
  --gold: #b88622;
  --gold-soft: rgba(184, 134, 34, 0.14);
  --shadow: 0 12px 30px rgba(34, 24, 21, 0.08);
  --radius: 12px;
  --radius-sm: 8px;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  color: var(--ink);
  background: var(--paper);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button {
  border: 0;
  border-radius: var(--radius-sm);
  padding: 9px 14px;
  color: #fff;
  background: var(--accent);
  font-weight: 700;
  cursor: pointer;
}
button:disabled { cursor: not-allowed; opacity: 0.55; }
button.ghost {
  color: var(--ink);
  border: 1px solid var(--line);
  background: transparent;
}
.app {
  width: min(940px, calc(100% - 28px));
  margin: 0 auto;
  padding: 28px 0 44px;
}
.hero {
  display: grid;
  grid-template-columns: 1fr 150px;
  gap: 18px;
  align-items: end;
  margin-bottom: 18px;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--line);
}
.eyebrow {
  margin: 0 0 6px;
  color: var(--accent);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}
.hero h1 {
  margin: 0 0 6px;
  font-size: 34px;
  line-height: 1.18;
}
.hero p:last-child { margin: 0; color: var(--muted); }
.metric {
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  text-align: center;
  box-shadow: var(--shadow);
}
.metric strong {
  display: block;
  color: var(--accent);
  font-size: 40px;
  line-height: 1;
}
.metric span { color: var(--muted); font-size: 12px; }
.toolbar {
  display: grid;
  grid-template-columns: 230px 1fr auto auto;
  gap: 8px;
  align-items: center;
  margin-bottom: 14px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
}
select, input[type="text"], input[type="search"], input[type="number"] {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 8px 10px;
  background: #fff;
}
.toolbar-meta, .hint, .round-info, .status { color: var(--muted); font-size: 13px; }
.tabs {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 3px;
  margin-bottom: 14px;
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: #efe3d6;
}
.tabs button {
  color: var(--muted);
  background: transparent;
  box-shadow: none;
}
.tabs button.active { color: #fff; background: var(--accent); }
.panel {
  display: none;
  padding: 20px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow);
}
.panel.active { display: block; }
.panel h2 { margin: 0 0 14px; font-size: 19px; }
.practice-head, .review-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.practice-mode-bar, .feedback-settings, .bank-toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  margin: 10px 0 12px;
  padding: 10px;
  border: 1px solid var(--line-soft);
  border-radius: var(--radius-sm);
  background: var(--paper);
  font-size: 13px;
}
.practice-mode-bar label, .feedback-settings label {
  display: inline-flex;
  gap: 5px;
  align-items: center;
}
.practice-mode-label { color: var(--muted); font-weight: 800; }
.number-input { max-width: 72px; text-align: center; }
.exam-time-controls { display: inline-flex; gap: 6px; align-items: center; }
.round-boundary, .accuracy > div, .quiz-card, .bank-item, .review-metric, .review-item, .data-block {
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--paper);
}
.round-boundary {
  margin: 10px 0;
  padding: 10px 12px;
  font-size: 13px;
}
.round-boundary span { color: var(--muted); margin-left: 8px; }
.round-boundary.is-active { border-color: rgba(163, 59, 40, 0.28); background: var(--accent-soft); }
.round-boundary.is-complete { border-color: rgba(47, 122, 70, 0.28); background: var(--success-soft); }
.accuracy {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
  margin: 12px 0;
}
.accuracy > div { padding: 12px; }
.accuracy strong {
  display: block;
  color: var(--accent);
  font-size: 26px;
  line-height: 1.1;
}
.accuracy span { color: var(--muted); font-size: 12px; }
#examTimer.is-danger { color: var(--danger); }
.quiz-card { min-height: 120px; padding: 18px; }
.quiz-card-header {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--line-soft);
}
.quiz-card h3 {
  margin: 0;
  font-size: 16px;
  line-height: 1.75;
}
.bookmark-btn {
  width: 34px;
  height: 34px;
  padding: 0;
  color: var(--muted);
  border: 1px solid var(--line);
  background: #fff;
}
.bookmark-btn.active { color: var(--gold); border-color: var(--gold); background: var(--gold-soft); }
.option-list {
  display: grid;
  gap: 8px;
  margin-top: 12px;
}
.option {
  display: flex;
  gap: 9px;
  align-items: flex-start;
  padding: 11px 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: #fff;
}
.option input { margin-top: 4px; accent-color: var(--accent); }
.option b { color: var(--accent); }
.option.is-correct { border-color: var(--success); background: var(--success-soft); }
.option.is-wrong { border-color: var(--danger); background: var(--danger-soft); }
.multi-hint, .wrong-count-tag, .stats-tag {
  display: inline-block;
  margin-left: 5px;
  padding: 1px 7px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  vertical-align: middle;
}
.multi-hint, .stats-tag { color: var(--accent); background: var(--accent-soft); }
.wrong-count-tag, .stats-tag.is-pending { color: var(--danger); background: var(--danger-soft); }
.stats-tag.is-mastered { color: var(--success); background: var(--success-soft); }
#answerResult:not(:empty) {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--line-soft);
}
.correct, .wrong {
  padding: 12px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  line-height: 1.8;
  white-space: pre-line;
}
.correct { border: 1px solid rgba(47,122,70,.22); background: var(--success-soft); }
.correct strong { color: var(--success); }
.wrong { border: 1px solid rgba(166,46,59,.18); background: var(--danger-soft); }
.wrong strong { color: var(--danger); }
.fill-blank-area { display: grid; gap: 8px; margin-top: 12px; }
.fill-blank-input { border: 1px solid var(--line); border-bottom: 2px solid var(--accent); border-radius: var(--radius-sm); padding: 10px 12px; }
.sticky-actions {
  position: sticky;
  bottom: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 14px;
  padding: 12px 0;
  border-top: 1px solid var(--line);
  background: var(--surface);
  z-index: 5;
}
.empty, .round-state, .exam-empty-state { color: var(--muted); text-align: center; padding: 22px 12px; }
.round-state strong, .exam-summary h3 { color: var(--ink); font-size: 17px; }
.exam-summary-grid, .review-summary-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
  margin: 12px 0;
}
.exam-summary-grid div, .review-metric { padding: 12px; }
.review-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.review-insights { display: grid; gap: 14px; }
.review-metric strong { display: block; color: var(--accent); font-size: 25px; line-height: 1.1; }
.review-metric span { color: var(--muted); font-size: 12px; }
.review-section { display: grid; gap: 8px; }
.review-section h3 { margin: 0; font-size: 15px; }
.review-item { padding: 12px; }
.review-item h4 { margin: 0 0 5px; font-size: 14px; line-height: 1.6; }
.review-item p, .bank-item p, .data-block p { margin: 3px 0; color: var(--muted); font-size: 12px; }
.bank-item p { white-space: pre-line; }
.bank-toolbar input { flex: 1; min-width: 170px; }
.bank-list { display: grid; gap: 8px; }
.bank-item { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 13px; }
.bank-item h3 { margin: 0 0 5px; font-size: 14px; line-height: 1.6; }
.bank-options { display: grid; gap: 2px; margin: 6px 0; }
.bank-actions { display: flex; flex-direction: column; gap: 6px; }
.bank-actions button { padding: 6px 10px; font-size: 12px; }
.active-filter { color: #fff !important; border-color: var(--accent) !important; background: var(--accent) !important; }
.data-summary { display: grid; gap: 10px; }
.data-block { padding: 13px; overflow-wrap: anywhere; }
.course-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.course-pill { padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: #fff; font-size: 13px; }
.ok { color: var(--success); font-weight: 800; }
.danger { color: var(--danger); font-weight: 800; }
@media (hover: hover) {
  button:hover { background: var(--accent-strong); }
  button.ghost:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .option:hover { border-color: var(--accent); background: var(--accent-soft); }
}
@media (max-width: 760px) {
  .app { width: calc(100% - 18px); padding: 18px 0 32px; }
  .hero { grid-template-columns: 1fr; }
  .hero h1 { font-size: 25px; }
  .metric { display: flex; gap: 12px; align-items: center; justify-content: center; }
  .metric strong { font-size: 34px; }
  .toolbar { grid-template-columns: 1fr; }
  .panel { padding: 15px; }
  .quiz-card { padding: 14px; }
  .tabs button { padding: 8px 6px; }
  .exam-summary-grid, .review-summary-grid, .course-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .bank-item { grid-template-columns: 1fr; }
  .bank-actions { flex-direction: row; }
  .bank-actions button { flex: 1; }
}
@media (max-width: 430px) {
  .panel h2 { font-size: 17px; }
  .quiz-card h3 { font-size: 14px; }
  .quiz-card-header { flex-direction: column-reverse; }
  .bookmark-btn { align-self: flex-end; }
  .exam-summary-grid, .review-summary-grid, .course-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <p class="eyebrow">Offline Quiz</p>
        <h1>国家安全教育题库</h1>
        <p>单文件 HTML，可直接在手机浏览器打开；题库内嵌只读，答题进度保存在当前浏览器。</p>
      </div>
      <div class="metric">
        <strong id="questionCount">0</strong>
        <span>当前章节题数</span>
      </div>
    </header>

    <section class="toolbar">
      <select id="courseSelect" aria-label="选择章节"></select>
      <div id="courseMeta" class="toolbar-meta"></div>
      <button id="exportProgressBtn" class="ghost" type="button">导出进度</button>
      <button id="importProgressBtn" class="ghost" type="button">导入进度</button>
      <input id="progressFileInput" type="file" accept="application/json" hidden>
    </section>

    <p id="storageWarning" class="status" style="display:none;color:var(--danger)">当前浏览器禁止写入本地存储，本次进度不会自动保存；请用“导出进度”备份。</p>

    <nav class="tabs" aria-label="页面">
      <button class="active" data-tab="practicePanel" type="button">刷题</button>
      <button data-tab="reviewPanel" type="button">复习</button>
      <button data-tab="bankPanel" type="button">题库</button>
      <button data-tab="dataPanel" type="button">数据</button>
    </nav>

    <section id="practicePanel" class="panel active">
      <div class="practice-head">
        <h2>随机刷题</h2>
        <button id="resetRoundBtn" class="ghost" type="button">重置本轮</button>
      </div>
      <div class="practice-mode-bar">
        <span class="practice-mode-label">模式</span>
        <label><input type="radio" name="practiceMode" value="all"> 全部题目</label>
        <label><input type="radio" name="practiceMode" value="count"> 指定数量</label>
        <label><input type="radio" name="practiceMode" value="wrong"> 错题重做</label>
        <label><input type="radio" name="practiceMode" value="exam"> 限时模拟</label>
        <input id="practiceCountInput" class="number-input" type="number" min="1" value="10">
        <span id="practiceCountHint" class="hint">题</span>
        <span id="examTimeControls" class="exam-time-controls">
          <input id="examMinutesInput" class="number-input" type="number" min="1" value="20">
          <span class="hint">分钟</span>
        </span>
      </div>
      <p id="roundInfo" class="round-info"></p>
      <div id="roundBoundary" class="round-boundary"></div>
      <div id="accuracy" class="accuracy"></div>
      <div class="feedback-settings">
        <label><input id="showAnswerToggle" type="checkbox"> 答后显示答案</label>
        <label><input id="showExplanationToggle" type="checkbox"> 答后显示解析</label>
        <label><input id="autoNextToggle" type="checkbox"> 答对自动下一题</label>
        <label><input id="shuffleOptionsToggle" type="checkbox"> 选项乱序</label>
      </div>
      <article id="quizCard" class="quiz-card"></article>
      <div class="sticky-actions">
        <button id="submitBtn" type="button">提交答案</button>
        <button id="prevBtn" class="ghost" type="button">上一题</button>
        <button id="nextBtn" type="button">下一题</button>
        <button id="finishExamBtn" class="ghost" type="button">结束模拟</button>
      </div>
    </section>

    <section id="reviewPanel" class="panel">
      <div class="review-head">
        <h2>复习分析</h2>
        <div class="review-actions">
          <button data-review-action="practice-wrong" type="button">开始错题重做</button>
          <button class="ghost" data-review-action="open-wrong-bank" type="button">打开错题列表</button>
        </div>
      </div>
      <div id="reviewInsights" class="review-insights"></div>
    </section>

    <section id="bankPanel" class="panel">
      <h2>题库浏览</h2>
      <div id="bankToolbar" class="bank-toolbar"></div>
      <div id="bankList" class="bank-list"></div>
    </section>

    <section id="dataPanel" class="panel">
      <h2>迁移校验</h2>
      <div id="dataSummary" class="data-summary"></div>
    </section>
  </main>

  <script type="application/json" id="quiz-data">{"metadata":{"title":"国家安全教育题库","courseName":"国家安全教育","storageKey":"national-security-quiz-progress-v1","settingsKey":"quiz-html-settings-%E5%9B%BD%E5%AE%B6%E5%AE%89%E5%85%A8%E6%95%99%E8%82%B2-v1","progressFileName":"国家安全教育题库刷题进度","autoNotes":false,"explanationCount":290,"memoryTipCount":290,"generatedAt":"2026-11-26T03:24:46.792Z","sourceFile":"content/national-security/course.json","sourceMtime":"2026-11-26T02:59:34.959Z","sourceSha256":"a9b97e50c7e4bb4e60a512e94122563e690c6407ae2f31bc31ee7374a2e2008b","sourceQuestionCoreSha256":"7dad7dded8875ed8291ec0c95a5b6e835c98db0282cb826efe4cc4d8eb5cd04b","questionBankSha256":"59e046a9496f25dce9b80540d7f9b4bb197f761cfeed55b529ba8de0d720de96","totalCourses":1,"totalQuestions":290,"extraction":{"method":"course-name","sourceCourseNames":["国家安全教育"]},"generatedNotes":{"scanned":0,"updated":0,"explanationAdded":0,"memoryTipAdded":0,"skipped":true}},"activeCourseId":"course-1794391527929-wvc61gg9gbb","courses":[{"id":"course-1794391527929-wvc61gg9gbb","name":"国家安全教育","questions":[{"id":"question-1794391527948-wnjxakuvlyj","type":"choice","stem":"以下说法错误的是( )。","options":[{"key":"A","text":"总体国家安全观强调国家安全全面覆盖各重点领域"},{"key":"B","text":"总体国家安全观未超越传统安全和非传统安全\"非此即彼\"的思维模式"},{"key":"C","text":"总体国家安全观涵盖的重点领域根据安全形势的发展而不断扩展"},{"key":"D","text":"总体国家安全观强调各领域各方面安全共同构成总体国家安全"}],"answer":["总体国家安全观未超越传统安全和非传统安全\"非此即彼\"的思维模式"],"explanation":"正确答案：总体国家安全观未超越传统安全和非传统安全\"非此即彼\"的思维模式\n为什么对：总体国家安全观恰恰超越把传统安全与非传统安全对立起来的非此即彼思维，强调两类安全相互关联、统筹兼顾。《中华人民共和国国家安全法》第八条要求统筹传统安全和非传统安全，二者要一起谋划，不能顾此失彼，因此“未超越”与官方立场相反。\n干扰项分析：“总体国家安全观强调国家安全全面覆盖各重点领域”成立，政治、经济、军事、网络等领域都在其中；“总体国家安全观涵盖的重点领域根据安全形势的发展而不断扩展”成立，领域范围随形势变化而丰富；“总体国家安全观强调各领域各方面安全共同构成总体国家安全”成立，国家安全是整体，不等于单个领域安全。\n记忆：总体安全观统筹两类安全，拒绝非此即彼。\n依据：《中华人民共和国国家安全法》第八条；教材表述。","memoryTip":"总体安全观统筹传统与非传统安全，拒绝非此即彼","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-0cn6vvkxlcg","type":"choice","stem":"( )是全球研发投入最集中、创新最活跃、应用最广泛、辐射带动作用最大的技术创新领域，是全球技术创新的竞争高地。","options":[{"key":"A","text":"网络信息技术"},{"key":"B","text":"国家安全技术"},{"key":"C","text":"核技术"},{"key":"D","text":"生命科学技术"}],"answer":["网络信息技术"],"explanation":"正确答案：网络信息技术\n为什么对：网络信息技术覆盖面广、渗透性强，是全球研发投入最集中、创新最活跃、应用最广泛、辐射带动作用最大的技术创新领域，也是各国争夺技术主导权的竞争高地。它同时具备基础性、通用性和带动性，因而被视为全球技术创新的竞争高地。\n干扰项分析：“国家安全技术”按安全需求划分技术门类，不具有题干描述的全社会研发投入最集中、应用最广泛的特征；“核技术”投入大、门槛高，应用集中在能源、医疗等特定领域，辐射带动面有限；“生命科学技术”发展迅速，但产业化规模和辐射范围仍不足以称为全球技术创新的竞争高地。\n记忆：研发投入最集中、应用最广泛的是网络信息技术。\n依据：教材表述。","memoryTip":"全球技术创新竞争高地是网络信息技术","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-ah3b4pyd55c","type":"choice","stem":"( )受制于人是我国网络安全领域的重大隐患。","options":[{"key":"A","text":"硬件技术"},{"key":"B","text":"互联网技术"},{"key":"C","text":"互联网核心技术"},{"key":"D","text":"软件技术"}],"answer":["互联网核心技术"],"explanation":"正确答案：互联网核心技术\n为什么对：互联网核心技术是网络安全的根基。我国在网络基础设施、终端设备和应用生态上规模领先，但部分芯片、操作系统、数据库等互联网核心技术仍依赖外部，一旦供应被限制，网络安全和产业链安全就会受制于人，这是我国网络安全领域的重大隐患。\n干扰项分析：“硬件技术”只是互联网核心技术的一个组成部分，把隐患范围缩小到硬件，遗漏了软件和基础架构；“互联网技术”范围过宽，我国互联网应用技术整体具备较强实力，笼统说互联网技术受制于人不准确；“软件技术”同样只是一个方面，不能覆盖核心技术的全部内容。\n记忆：命门在互联网核心技术，受制于人是重大隐患。\n依据：教材表述。","memoryTip":"互联网核心技术受制于人是网络安全重大隐患","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-cye1cn2rvhs","type":"choice","stem":"防范化解各类风险隐患，积极应对外部环境变化带来的冲击挑战，关键在于( )。","options":[{"key":"A","text":"办好自己的事情"},{"key":"B","text":"对历史经验的继承和发扬"},{"key":"C","text":"坚持极限思维"},{"key":"D","text":"坚持底线思维"}],"answer":["办好自己的事情"],"explanation":"正确答案：办好自己的事情\n为什么对：防范化解各类风险隐患、应对外部环境变化带来的冲击挑战，关键在于把国家和民族发展放在自己力量的基点上，集中精力办好自己的事情。自身实力增强、发展基础牢固，外部冲击才难以撼动大局，这是应对外部环境变化的根本依托。\n干扰项分析：“对历史经验的继承和发扬”有助于把握规律，但历史经验要落到当前发展和安全的具体工作上；“坚持极限思维”要求设想最坏情况、争取最好结果，属于思维方法；“坚持底线思维”强调守住底线、防范最坏结果，同样属于思维方法。两者都不能替代增强自身实力这一关键。\n记忆：外部冲击再大，关键是把自家的事情办好。\n依据：教材表述。","memoryTip":"应对外部冲击的关键是办好自己的事情","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-m2m4mafn9ij","type":"choice","stem":"习近平关于( )的重要思想是维护我国网络安全的根本指导思想。","options":[{"key":"A","text":"网络强国"},{"key":"B","text":"网络安全"},{"key":"C","text":"科技强国"},{"key":"D","text":"科技安全"}],"answer":["网络强国"],"explanation":"正确答案：网络强国\n为什么对：习近平关于网络强国的重要思想系统回答了为什么建设网络强国、怎样建设网络强国等重大问题，是新时代网络安全和信息化工作的根本遵循，因而成为维护我国网络安全的根本指导思想。网络安全是网络强国建设的重要内容，二者统一于网络强国战略。\n干扰项分析：“网络安全”只是网络强国建设的一个方面，单提网络安全无法涵盖信息化发展、核心技术突破等内容；“科技强国”是范围更广的科技发展战略目标，不专门回答网络安全问题；“科技安全”是国家安全的一个领域，不能等同于指导网络安全工作的思想体系。\n记忆：维护网络安全的根本指导思想是网络强国重要思想。\n依据：教材表述。","memoryTip":"网络强国重要思想是维护网络安全的根本指导","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-jrbs8678mk","type":"choice","stem":"忧患意识是中华民族的重要精神特质，是贯穿( )的鲜明精神主线和深厚战略文化。","options":[{"key":"A","text":"社会主义发展史"},{"key":"B","text":"中国共产党发展史"},{"key":"C","text":"中华民族发展史"},{"key":"D","text":"中华人民共和国发展史"}],"answer":["中华民族发展史"],"explanation":"正确答案：中华民族发展史\n为什么对：忧患意识是中华民族在长期生存发展中形成的重要精神特质，贯穿中华民族发展史，构成鲜明的精神主线和深厚的战略文化。题干两处限定都指向中华民族这一主体，因此与之对应的历史坐标是中华民族发展史。\n干扰项分析：“社会主义发展史”时间跨度短于中华民族发展史，无法承载中华民族的精神特质；“中国共产党发展史”是忧患意识集中彰显的阶段，但党诞生以前的漫长历史同样存在忧患意识；“中华人民共和国发展史”时间更短，只覆盖新中国成立以来的历程。\n记忆：忧患意识贯穿中华民族发展史，是民族精神特质。\n依据：教材表述。","memoryTip":"忧患意识是贯穿中华民族发展史的精神主线","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-e62shhuqinj","type":"choice","stem":"前进道路不可能一帆风顺，越是取得成绩的时候，越是要有如履薄冰的谨慎，越是要有居安思危的忧患，绝不能犯( )。","options":[{"key":"A","text":"全局性、颠覆性错误"},{"key":"B","text":"战略性、妥协性错误"},{"key":"C","text":"全局性、妥协性错误"},{"key":"D","text":"战略性、颠覆性错误"}],"answer":["战略性、颠覆性错误"],"explanation":"正确答案：战略性、颠覆性错误\n为什么对：这一表述强调形势越好越要保持清醒，成绩越大越要谨慎。战略性错误影响方向全局，颠覆性错误动摇根本，二者一旦发生就难以挽回。题干用如履薄冰、居安思危铺垫的正是这种对根本性失误的警惕。\n干扰项分析：“全局性、颠覆性错误”把战略性换成了全局性，偏离固定表述；“战略性、妥协性错误”中的妥协性不是这一论断的用词，妥协不等于根本性失误；“全局性、妥协性错误”两处都偏离原文，既丢了战略性，又多了妥协性。\n记忆：居安思危，绝不犯战略性、颠覆性错误。\n依据：教材表述。","memoryTip":"越有成绩越谨慎，绝不犯战略性颠覆性错误","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-fb881smuiop","type":"choice","stem":"发展( )是推动高质量发展的内在要求和重要着力点，必须继续做好创新这篇大文章。","options":[{"key":"A","text":"优秀生产力"},{"key":"B","text":"高质生产力"},{"key":"C","text":"优质生产力"},{"key":"D","text":"新质生产力"}],"answer":["新质生产力"],"explanation":"正确答案：新质生产力\n为什么对：新质生产力由创新起主导作用，摆脱传统经济增长方式，具有高科技、高效能、高质量特征。发展新质生产力是推动高质量发展的内在要求和重要着力点，必须继续做好创新这篇大文章，以科技创新推动产业创新。\n干扰项分析：“优秀生产力”“高质生产力”“优质生产力”都不是规范表述，属于把新质随意替换成近义词拼出的词语，无法指代以创新为主导、具有高科技高效能高质量特征的先进生产力形态。\n记忆：高质量发展抓新质生产力，关键在创新。\n依据：教材表述。","memoryTip":"高质量发展的重要着力点是新质生产力","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-t30aea8efx","type":"choice","stem":"高等学校开设国家安全教育公共基础课程，是落实( )关于\"将国家安全教育纳入国民教育体系\"规定的要求。","options":[{"key":"A","text":"《中华人民共和国爱国主义教育法》"},{"key":"B","text":"《中华人民共和国民法典》"},{"key":"C","text":"《中华人民共和国宪法》"},{"key":"D","text":"《中华人民共和国国家安全法》"}],"answer":["《中华人民共和国国家安全法》"],"explanation":"正确答案：《中华人民共和国国家安全法》\n为什么对：《中华人民共和国国家安全法》明确要求将国家安全教育纳入国民教育体系。高等学校开设国家安全教育公共基础课程，正是把这一法定要求落实到国民教育体系中的具体举措，课程定位与学时安排都服务于增强全民国家安全意识。\n干扰项分析：“《中华人民共和国爱国主义教育法》”规范爱国主义教育，与国家安全教育课程的直接依据不同；“《中华人民共和国民法典》”调整民事关系，不涉及国家安全教育纳入国民教育体系；“《中华人民共和国宪法》”是根本法，规定公民维护国家安全的基本义务，但不作国民教育体系的具体安排。\n记忆：国家安全教育进课堂，依据是国家安全法。\n依据：《中华人民共和国国家安全法》；《大中小学国家安全教育指导纲要》。","memoryTip":"国家安全教育纳入国民教育体系的依据是国家安全法","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-ti4vn6zocms","type":"choice","stem":"我国的国家安全归根到底是维护和保障( )的安全和利益。","options":[{"key":"A","text":"统治阶级"},{"key":"B","text":"人民群众"},{"key":"C","text":"精英阶层"},{"key":"D","text":"整个国家"}],"answer":["人民群众"],"explanation":"正确答案：人民群众\n为什么对：我国国家安全以人民安全为宗旨，国家安全一切为了人民、一切依靠人民。维护国家安全归根到底是维护和保障人民群众的安全和利益，人民福祉是国家安全定义的组成部分，也是国家安全工作的出发点和落脚点。\n干扰项分析：“统治阶级”把国家安全窄化为少数人的安全，与我国国家性质不符；“精英阶层”只覆盖少数群体，背离人民立场；“整个国家”表述笼统，题干问的是国家安全归根到底为了谁，落点应当是人民群众的安全和利益。\n记忆：国家安全一切为了人民、一切依靠人民。\n依据：《中华人民共和国国家安全法》第一条、第三条。","memoryTip":"国家安全归根到底保障人民群众的安全和利益","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-kpydw5vuaxi","type":"choice","stem":"中国要强盛、要复兴，就一定要坚持新型举国体制，实现科学技术( )，努力成为世界主要科学技术中心和创新高地，不断强化对外部打压遏制风险的抗压力、应变力和反制力，确保国家核心利益和安全不受外部科技优势危害。","options":[{"key":"A","text":"\"引进来\"与\"走出去\"相结合"},{"key":"B","text":"融合发展"},{"key":"C","text":"自主发展"},{"key":"D","text":"创新引领"}],"answer":["自主发展"],"explanation":"正确答案：自主发展\n为什么对：坚持新型举国体制，实现科学技术自主发展，才能把关键核心技术掌握在自己手中，成为世界主要科学中心和创新高地，从而增强对外部打压遏制风险的抗压力、应变力和反制力，确保国家核心利益和安全不受外部科技优势危害。\n干扰项分析：“\"引进来\"与\"走出去\"相结合”是对外开放中的技术交流方式，无法保证关键核心技术自主可控；“融合发展”指技术与产业、领域之间的结合，不回答科技发展依靠谁的问题；“创新引领”强调创新在全局中的带动作用，与题干的落点不同。\n记忆：举国体制攻关，科技必须自主发展。\n依据：教材表述。","memoryTip":"新型举国体制下科技要实现自主发展","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-9lipnt84b8","type":"choice","stem":"公有制经济是全体人民的宝贵财富，( )是中国特色社会主义的重要物质基础和政治基础。","options":[{"key":"A","text":"外资企业"},{"key":"B","text":"民营企业"},{"key":"C","text":"合资企业"},{"key":"D","text":"国有企业"}],"answer":["国有企业"],"explanation":"正确答案：国有企业\n为什么对：国有企业属于全民所有，是中国特色社会主义的重要物质基础和政治基础，是我们党执政兴国的重要支柱和依靠力量。题干先说公有制经济是全体人民的宝贵财富，接着落到国有企业的定位，前后主体一致。\n干扰项分析：“外资企业”由境外资本控制，不属于公有制经济；“民营企业”属于非公有制经济，是社会主义市场经济的重要组成部分，但不构成题干所说的物质基础和政治基础；“合资企业”是混合所有制形式，同样不能承担这一政治定位。\n记忆：国有企业是重要物质基础和政治基础。\n依据：教材表述。","memoryTip":"国有企业是重要物质基础和政治基础","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-aqlqfiiczb","type":"choice","stem":"下列选项中不属于\"逆全球化\"危害的是( )。","options":[{"key":"A","text":"阻碍世界经济沿着普惠包容的方向健康发展"},{"key":"B","text":"全球贫富差距缩小"},{"key":"C","text":"导致各国利益和人类利益受到损害"},{"key":"D","text":"扰乱了全球产业链供应链安全稳定"}],"answer":["全球贫富差距缩小"],"explanation":"正确答案：全球贫富差距缩小\n为什么对：本题选不属于逆全球化危害的选项。逆全球化的实际后果之一是全球贫富差距扩大，发展中国家和弱势群体受冲击更重，因此全球贫富差距缩小与逆全球化的危害方向相反，不属于其危害。\n干扰项分析：“阻碍世界经济沿着普惠包容的方向健康发展”是危害，逆全球化筑墙设垒，削弱世界经济增长动能；“导致各国利益和人类利益受到损害”是危害，贸易保护主义使各方都付出代价；“扰乱了全球产业链供应链安全稳定”是危害，断链脱钩推高成本、冲击生产秩序。\n记忆：逆全球化拉大贫富差距，缩小差距不算危害。\n依据：教材表述。","memoryTip":"逆全球化拉大贫富差距，缩小差距不属危害","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-108psd9r5i8e","type":"choice","stem":"全面提高国家综合防灾减灾救灾能力要强化应急管理装备技术支撑，优化整合各类科技资源，依靠( )提高应急管理的科学化、专业化、智能化、精细化水平。","options":[{"key":"A","text":"制度支撑"},{"key":"B","text":"人工智能"},{"key":"C","text":"科技自主创新"},{"key":"D","text":"人才保障"}],"answer":["科技自主创新"],"explanation":"正确答案：科技自主创新\n为什么对：应急管理要科学化、专业化、智能化、精细化，离不开装备技术支撑。题干已点明强化应急管理装备技术支撑、优化整合各类科技资源，紧接着的落点自然是依靠科技自主创新，把关键技术掌握在自己手中，提升监测预警和处置救援能力。\n干扰项分析：“制度支撑”属于体制机制保障，不能直接转化为装备技术水平；“人工智能”只是科技手段中的一项具体技术，范围过窄，无法概括优化整合各类科技资源的整体要求；“人才保障”是重要条件，但题干问的是依靠什么提高应急管理水平，落点在科技。\n记忆：应急管理上水平，靠科技自主创新。\n依据：教材表述。","memoryTip":"应急管理科学化智能化靠科技自主创新","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-7tx5l7tzdt2","type":"choice","stem":"2020年12月，习近平在十九届中央政治局第二十六次集体学习时，就贯彻总体国家安全观提出( )的要求。","options":[{"key":"A","text":"\"八个坚持\""},{"key":"B","text":"\"十一个坚持\""},{"key":"C","text":"\"十个坚持\""},{"key":"D","text":"\"九个坚持\""}],"answer":["\"十个坚持\""],"explanation":"正确答案：\"十个坚持\"\n为什么对：2020年12月，习近平在十九届中央政治局第二十六次集体学习时，就贯彻总体国家安全观提出“十个坚持”，包括坚持党对国家安全工作的绝对领导、坚持中国特色国家安全道路、坚持以人民安全为宗旨、坚持统筹发展和安全等，构成总体国家安全观的行动纲领。\n干扰项分析：“八个坚持”“九个坚持”“十一个坚持”都与这次集体学习提出的数量不符，属于用邻近数字设置的干扰。记准十个坚持，并知道它以坚持党对国家安全工作的绝对领导为首要一条，就不容易被数字迷惑。\n记忆：总体国家安全观行动纲领是十个坚持。\n依据：《总体国家安全观学习纲要》；教材表述。","memoryTip":"总体国家安全观的行动纲领是十个坚持","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-f75guy9gd67","type":"choice","stem":"人们常用( )比喻发生概率很小但影响巨大的事件。","options":[{"key":"A","text":"\"黑天鹅\""},{"key":"B","text":"\"大白鲨\""},{"key":"C","text":"\"灰犀牛\""},{"key":"D","text":"\"拦路虎\""}],"answer":["\"黑天鹅\""],"explanation":"正确答案：\"黑天鹅\"\n为什么对：黑天鹅指发生概率很小但影响巨大的事件，难以预测却可能造成严重冲击。题干给出的两个限定是概率小、影响大，与黑天鹅的定义完全对应，防范这类事件要靠底线思维和预案准备。\n干扰项分析：“大白鲨”不是风险分析中的固定比喻；“灰犀牛”指发生概率很大且影响巨大的潜在危机，概率特征与题干相反；“拦路虎”是日常比喻，指前进中的障碍，不具备概率小而影响大的特定含义。\n记忆：概率小影响大是黑天鹅，概率大影响大是灰犀牛。\n依据：教材表述。","memoryTip":"概率很小但影响巨大的事件叫黑天鹅","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-q0yxz1xvd3h","type":"choice","stem":"在国家安全体系中，( )始终是维护国家安全的保底手段。","options":[{"key":"A","text":"文化安全"},{"key":"B","text":"科技安全"},{"key":"C","text":"军事安全"},{"key":"D","text":"政治安全"}],"answer":["军事安全"],"explanation":"正确答案：军事安全\n为什么对：军事安全始终是维护国家安全的保底手段。国防和军队建设为国家生存和发展提供坚强后盾，其他领域安全一旦遇到外部武力威胁，最终要靠军事力量托底，因此军事安全在国家安全体系中具有保底作用。\n干扰项分析：“文化安全”是国家安全的重要保障，作用在凝聚认同、掌握意识形态主导权；“科技安全”是保障，作用在支撑自主可控和核心竞争力；“政治安全”是最根本的安全，居于首要位置，但题干问的是保底手段，指向军事安全。\n记忆：政治安全最根本，军事安全是保底手段。\n依据：教材表述。","memoryTip":"维护国家安全的保底手段是军事安全","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-el5hrq1v7tu","type":"choice","stem":"践行( )，自觉维护国家安全，是全社会承担的重要责任，也是新时代大学生肩负的重要责任。","options":[{"key":"A","text":"国家安全观"},{"key":"B","text":"社会主义核心价值观"},{"key":"C","text":"科学的人生观"},{"key":"D","text":"总体国家安全观"}],"answer":["总体国家安全观"],"explanation":"正确答案：总体国家安全观\n为什么对：总体国家安全观是新时代国家安全工作的根本遵循和行动指南。践行总体国家安全观，自觉维护国家安全，是全社会承担的重要责任，也是新时代大学生肩负的重要责任，大学生要增强国家安全意识、履行维护国家安全的义务。\n干扰项分析：“国家安全观”缺少总体这一限定，泛指一般的安全观念，不能指代新时代的国家安全指导思想；“社会主义核心价值观”是价值准则，覆盖社会道德层面；“科学的人生观”属于个人人生选择，都不能替代总体国家安全观。\n记忆：践行总体国家安全观，维护国家安全人人有责。\n依据：教材表述。","memoryTip":"践行总体国家安全观是全社会的重要责任","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-aoru5ckzt2","type":"choice","stem":"充分发挥党总揽全局、协调各方的领导核心作用，在具体的政治实践中，要通过( )保证党的路线方针政策和决策部署在国家工作中得到全面贯彻和有效执行。","options":[{"key":"A","text":"民族区域自治制度"},{"key":"B","text":"多党合作和政治协商制度"},{"key":"C","text":"人民代表大会制度"},{"key":"D","text":"基层群众自治制度"}],"answer":["人民代表大会制度"],"explanation":"正确答案：人民代表大会制度\n为什么对：人民代表大会制度是我国的根本政治制度，党通过国家权力机关把党的主张转化为国家意志。发挥党总揽全局、协调各方的领导核心作用，在具体政治实践中要通过人民代表大会制度，保证党的路线方针政策和决策部署在国家工作中得到全面贯彻和有效执行。\n干扰项分析：“民族区域自治制度”解决民族聚居地区的治理问题；“多党合作和政治协商制度”是协商民主的重要渠道；“基层群众自治制度”处理城乡基层公共事务。三者都是基本政治制度，各有适用范围，不能承担把党的主张转化为国家意志这一全局性职能。\n记忆：党的主张变国家意志，靠人民代表大会制度。\n依据：教材表述。","memoryTip":"党的路线方针政策全面贯彻靠人民代表大会制度","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-snznv5gesz","type":"choice","stem":"全球发展倡议提出打造开放、公平、公正、( )的科技发展环境。","options":[{"key":"A","text":"可持续"},{"key":"B","text":"共享"},{"key":"C","text":"非歧视"},{"key":"D","text":"绿色"}],"answer":["非歧视"],"explanation":"正确答案：非歧视\n为什么对：全球发展倡议主张共同推动科技发展，打造开放、公平、公正、非歧视的科技发展环境。非歧视针对科技合作中的歧视性限制和排他性做法，强调各国平等参与科技合作、共享科技成果。\n干扰项分析：“可持续”多用于发展方式和环境领域；“共享”讲的是发展成果由各方共同享有，与题干并列的开放、公平、公正搭配不当；“绿色”属于发展理念和生态领域。三者都不是全球发展倡议中科技发展环境的固定表述。\n记忆：全球发展倡议的科技环境是开放、公平、公正、非歧视。\n依据：教材表述。","memoryTip":"全球发展倡议要求科技发展环境非歧视","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-negmvkpkc5","type":"choice","stem":"核安全无国界，加强核安全国际合作是构建( )的全球核安全治理体系的必然要求。","options":[{"key":"A","text":"公平、互利、共赢"},{"key":"B","text":"公平、协调、共赢"},{"key":"C","text":"公平、合作、共赢"},{"key":"D","text":"公平、合作、互信"}],"answer":["公平、合作、共赢"],"explanation":"正确答案：公平、合作、共赢\n为什么对：核安全无国界，任何一国发生核事故都可能波及周边乃至全球。加强核安全国际合作，是要构建公平、合作、共赢的全球核安全治理体系，使各国在平等基础上共同应对核安全风险、共享核安全成果。\n干扰项分析：“公平、互利、共赢”把合作换成互利，偏离固定表述；“公平、协调、共赢”中的协调不是该体系的固定用词；“公平、合作、互信”把共赢换成互信，互信是合作的前提，不能替代治理体系的目标。\n记忆：全球核安全治理体系讲公平、合作、共赢。\n依据：教材表述。","memoryTip":"全球核安全治理体系追求公平合作共赢","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-ojdrf1mek6","type":"choice","stem":"我国人民依法实行( )，这既有效防止了西方民主选举时漫天许诺、事后却无人过问的现象，也扩大了人民有序政治参与，集中反映了全过程人民民主的要求。","options":[{"key":"A","text":"民主选举、民主协商、民主决策、民主管理、民主审议"},{"key":"B","text":"民主自治、民主协商、民主决策、民主管理、民主审议"},{"key":"C","text":"民主自治、民主协商、民主决策、民主管理、民主监督"},{"key":"D","text":"民主选举、民主协商、民主决策、民主管理、民主监督"}],"answer":["民主选举、民主协商、民主决策、民主管理、民主监督"],"explanation":"正确答案：民主选举、民主协商、民主决策、民主管理、民主监督\n为什么对：全过程人民民主贯通选举、协商、决策、管理、监督各个环节。人民依法实行这五个方面的民主，既有选举时的授权，也有日常的协商、决策、管理和监督，从而防止选举时漫天许诺、事后无人过问，扩大人民有序政治参与。\n干扰项分析：“民主选举、民主协商、民主决策、民主管理、民主审议”把末位换成民主审议，审议是人大行使职权的方式，不属于五个民主的固定表述；“民主自治、民主协商、民主决策、民主管理、民主审议”同时把民主选举换成民主自治、把民主监督换成民主审议，两处偏离；“民主自治、民主协商、民主决策、民主管理、民主监督”只把民主选举换成民主自治，自治对应基层群众自治，不能替代选举环节。\n记忆：五个民主是选举、协商、决策、管理、监督。\n依据：教材表述。","memoryTip":"全过程人民民主五个环节：选举协商决策管理监督","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-8iazkqo463f","type":"choice","stem":"2018年以来开展的为期三年的( )专项斗争取得重要阶段性成果，黑恶势力得到有效铲除。","options":[{"key":"A","text":"防范化解各类风险隐患"},{"key":"B","text":"扫黑除恶"},{"key":"C","text":"打击电诈"},{"key":"D","text":"联合扫毒"}],"answer":["扫黑除恶"],"explanation":"正确答案：扫黑除恶\n为什么对：2018年至2020年，全国开展为期三年的扫黑除恶专项斗争，依法打击黑恶势力及其保护伞，黑恶势力得到有效铲除，社会治安环境明显改善，人民群众安全感提升。题干的时间、期限和成效都指向这场专项斗争。\n干扰项分析：“防范化解各类风险隐患”是国家安全领域的经常性工作，没有为期三年的专项斗争安排；“打击电诈”针对电信网络诈骗，时间起点和部署方式与题干不符；“联合扫毒”是禁毒领域的专项行动，打击对象与黑恶势力不同。\n记忆：2018至2020年，三年扫黑除恶专项斗争。\n依据：教材表述。","memoryTip":"2018年起开展为期三年的扫黑除恶专项斗争","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-szieehhiuif","type":"choice","stem":"( )是关系人民生命财产安全的大事，是经济社会协调健康发展的标志，是党和政府对人民利益高度负责的要求。","options":[{"key":"A","text":"公共卫生"},{"key":"B","text":"自然灾害"},{"key":"C","text":"安全生产"},{"key":"D","text":"社会安全"}],"answer":["安全生产"],"explanation":"正确答案：安全生产\n为什么对：安全生产关系人民生命财产安全，是经济社会协调健康发展的标志，体现党和政府对人民利益高度负责。题干三句判断层层递进，先说事关生命财产，再说发展标志，最后落到对人民利益负责，指向的正是安全生产。\n干扰项分析：“公共卫生”关系人民健康，但题干强调的是生产过程中的安全；“自然灾害”是外部致灾因素，本身不是一项工作，也不能称为协调健康发展的标志；“社会安全”范围过宽，涵盖社会治安等多方面，不是题干特指的安全生产。\n记忆：安全生产事关生命财产，是协调发展的标志。\n依据：教材表述。","memoryTip":"事关生命财产与协调发展的标志是安全生产","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-4luds713msd","type":"choice","stem":"实现中华民族伟大复兴，保证人民安居乐业，( )是头等大事。","options":[{"key":"A","text":"国家安全"},{"key":"B","text":"社会进步"},{"key":"C","text":"文化繁荣"},{"key":"D","text":"经济发展"}],"answer":["国家安全"],"explanation":"正确答案：国家安全\n为什么对：实现中华民族伟大复兴，保证人民安居乐业，国家安全是头等大事。没有安全稳定的环境，发展成果随时可能被风险冲击侵蚀，人民安居乐业也无从谈起，因此国家安全在全局工作中居于头等重要的位置。\n干扰项分析：“社会进步”“文化繁荣”“经济发展”都是国家发展的重要目标，但都依赖安全稳定的前提。题干用头等大事强调优先地位，指向的是保障其他目标得以实现的国家安全。\n记忆：复兴与安居乐业，国家安全是头等大事。\n依据：教材表述。","memoryTip":"实现复兴与安居乐业，国家安全是头等大事","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-bufoa17ie0l","type":"choice","stem":"习近平在2020年9月22日第75届联合国大会上向全世界宣布，中国二氧化碳排放力争于( )年前达到峰值，努力争取( )年前实现碳中和。","options":[{"key":"A","text":"2030;2060"},{"key":"B","text":"2035;2060"},{"key":"C","text":"2040;2060"},{"key":"D","text":"2045;2060"}],"answer":["2030;2060"],"explanation":"正确答案：2030;2060\n为什么对：2020年9月22日，习近平在第75届联合国大会上宣布，中国二氧化碳排放力争于2030年前达到峰值，努力争取2060年前实现碳中和。这一目标被称为双碳目标，是我国对国际社会的庄严承诺。\n干扰项分析：“2035;2060”“2040;2060”“2045;2060”都把达峰时间推迟到2030年之后，与我国承诺的节点不符；碳中和时间在各选项中一致，区别只在达峰年份，对准2030年即可排除。\n记忆：双碳目标要记牢，2030年前碳达峰，2060年前碳中和。\n依据：教材表述。","memoryTip":"双碳目标为2030年前碳达峰、2060年前碳中和","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-ntwksp1irbf","type":"choice","stem":"《中华人民共和国国家安全法》规定每年( )为全民国家安全教育日。","options":[{"key":"A","text":"3月20日"},{"key":"B","text":"6月15日"},{"key":"C","text":"4月15日"},{"key":"D","text":"5月10日"}],"answer":["4月15日"],"explanation":"正确答案：4月15日\n为什么对：《中华人民共和国国家安全法》第十四条规定，每年4月15日为全民国家安全教育日。这个日期对应2014年4月15日中央国家安全委员会第一次会议首次提出总体国家安全观，具有标志性意义。\n干扰项分析：“3月20日”“6月15日”“5月10日”都不是法定的全民国家安全教育日。这类日期题容易与消费者权益日等日期混淆，记住4月15日与总体国家安全观提出日相同即可。\n记忆：记住每年4月15日为全民国家安全教育日。\n依据：《中华人民共和国国家安全法》第十四条。","memoryTip":"记住每年4月15日为全民国家安全教育日","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-omn6aokr2y","type":"choice","stem":"( )是新时代党领导文化建设实践经验的理论总结，丰富和发展了马克思主义文化理论，标志着中国共产党对中国特色社会主义文化建设规律的认识达到了新高度。","options":[{"key":"A","text":"马克思主义理论"},{"key":"B","text":"习近平文化思想"},{"key":"C","text":"毛泽东思想"},{"key":"D","text":"社会主义文化思想"}],"answer":["习近平文化思想"],"explanation":"正确答案：习近平文化思想\n为什么对：习近平文化思想是新时代党领导文化建设实践经验的理论总结，丰富和发展了马克思主义文化理论，标志着我们党对中国特色社会主义文化建设规律的认识达到了新高度，为新的文化使命提供了根本遵循。\n干扰项分析：“马克思主义理论”是范围更大的理论体系，不专门总结新时代文化建设实践；“毛泽东思想”是革命和建设时期形成的理论成果，时间与新时代不符；“社会主义文化思想”不是规范的理论名称，无法指代这一思想成果。\n记忆：新时代文化建设理论总结是习近平文化思想。\n依据：教材表述。","memoryTip":"新时代文化建设实践的理论总结是习近平文化思想","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-asnpddak06s","type":"choice","stem":"关于国家安全体系和能力现代化，以下说法有误的是( )。","options":[{"key":"A","text":"凝结着党领导国家安全工作的理论创新"},{"key":"B","text":"凝结着党领导国家安全工作的战略创新"},{"key":"C","text":"凝结着党领导国家安全工作的制度创新"},{"key":"D","text":"凝结着党领导国家安全工作的实践创新"}],"answer":["凝结着党领导国家安全工作的战略创新"],"explanation":"正确答案：凝结着党领导国家安全工作的战略创新\n为什么对：本题选说法有误的一项。教材把新时代国家安全体系和能力现代化的成就，归纳为凝结着党领导国家安全工作的理论创新、实践创新、制度创新，没有把战略创新列入这一组表述，故该项与教材归纳不符。\n干扰项分析：“凝结着党领导国家安全工作的理论创新”成立，总体国家安全观就是重大理论创新；“凝结着党领导国家安全工作的制度创新”成立，国家安全领导体制和法治体系不断健全；“凝结着党领导国家安全工作的实践创新”成立，防范化解重大风险的实践探索积累了经验。\n记忆：体系和能力现代化凝结理论、实践、制度三重创新。\n依据：教材表述。","memoryTip":"国家安全体系和能力现代化凝结理论实践制度创新","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-aljcfouctnk","type":"choice","stem":"《网络安全法》《数据安全法》《个人信息保护法》属于维护( )的法律。","options":[{"key":"A","text":"网络安全"},{"key":"B","text":"涉外安全"},{"key":"C","text":"政治安全"},{"key":"D","text":"军事安全"}],"answer":["网络安全"],"explanation":"正确答案：网络安全\n为什么对：《中华人民共和国网络安全法》《中华人民共和国数据安全法》《中华人民共和国个人信息保护法》共同构成网络与数据领域的基础性法律，服务于维护网络空间主权、网络和数据安全以及公民个人信息权益，属于维护网络安全的法律。\n干扰项分析：“涉外安全”主要依靠对外关系领域的法律法规调整；“政治安全”由维护政权、制度安全的相关法律保障；“军事安全”由国防和军事领域的法律法规保障。三部法律调整的是网络空间秩序与数据处理活动，不归入上述领域。\n记忆：网安法、数安法、个保法共同守护网络安全。\n依据：《中华人民共和国网络安全法》《中华人民共和国数据安全法》《中华人民共和国个人信息保护法》。","memoryTip":"网络安全法、数据安全法、个人信息保护法守护网络安全","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-wpvfimk4v4d","type":"choice","stem":"国家安全涉及方方面面，其中最核心、最重要的就是( )安全。","options":[{"key":"A","text":"文化"},{"key":"B","text":"人民"},{"key":"C","text":"政治"},{"key":"D","text":"国土"}],"answer":["人民"],"explanation":"正确答案：人民\n为什么对：人民安全是国家安全最核心的部分，是总体国家安全观的精髓所在。总体国家安全观以人民安全为宗旨，国家安全一切为了人民、一切依靠人民，维护国家安全归根到底是维护人民群众的安全和利益；政治安全是最根本的安全，两者分属宗旨与根本两个层面，并不矛盾。\n干扰项分析：“文化安全”是保障，作用在凝聚认同；“政治安全”是最根本的安全，居于首要位置，但题干问的是最核心、最重要，题库按人民安全作答；“国土安全”是立国之基，属于基础性安全领域。\n记忆：人民安全是宗旨，也是国家安全最核心的部分。\n依据：《总体国家安全观学习纲要》；教材表述。","memoryTip":"人民安全是宗旨，也是国家安全最核心的部分。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-eqqyywyq2l6","type":"choice","stem":"2019年( )月15日，习近平对国家网络安全宣传周作出指示强调:\"国家网络安全工作要坚持网络安全为人民、网络安全靠人民，保障个人信息安全，维护公民在网络空间的合法权益。\"","options":[{"key":"A","text":"8"},{"key":"B","text":"7"},{"key":"C","text":"6"},{"key":"D","text":"9"}],"answer":["9"],"explanation":"正确答案：9\n为什么对：2019年9月，国家网络安全宣传周举办期间，习近平对国家网络安全宣传周作出指示，强调国家网络安全工作要坚持网络安全为人民、网络安全靠人民，保障个人信息安全，维护公民在网络空间的合法权益。题干给出的日期是9月15日。\n干扰项分析：“8”“7”“6”都不是宣传周举办的月份，把月份写错即偏离事实。国家网络安全宣传周通常在9月举办，记住9月这一时间节点即可排除其余选项。\n记忆：牢记2019年9月，网络安全为人民、网络安全靠人民。\n依据：教材表述。","memoryTip":"牢记2019年9月，网络安全为人民、网络安全靠人民","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-9ibvjo3aqwt","type":"choice","stem":"( )是立国之基，是国家生存和发展的基本条件，是人民安居乐业的基本保障。","options":[{"key":"A","text":"生态空间安全"},{"key":"B","text":"国土安全"},{"key":"C","text":"资源安全"},{"key":"D","text":"生态安全"}],"answer":["国土安全"],"explanation":"正确答案：国土安全\n为什么对：国土安全是立国之基，是国家生存和发展的基本条件，是人民安居乐业的基本保障。领土主权完整是国家存在的前提，国土安全一旦失守，其他领域安全就失去依托，因此它属于基础性安全。\n干扰项分析：“生态空间安全”属于生态安全范畴，保障的是生态系统和空间格局；“资源安全”关系能源资源供应，是发展的重要支撑；“生态安全”是国家安全的重要领域，但不承担立国之基的定位。\n记忆：国土安全是立国之基，是生存发展的基本条件。\n依据：教材表述。","memoryTip":"立国之基是国家生存发展基本条件的国土安全","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-pqbrd03uad","type":"choice","stem":"经过党的十八大以来不懈推进全面从严治党，党找到了( )这一跳出治乱兴衰历史周期率的第二个答案。","options":[{"key":"A","text":"反腐惩恶"},{"key":"B","text":"善于斗争"},{"key":"C","text":"自我完善"},{"key":"D","text":"自我革命"}],"answer":["自我革命"],"explanation":"正确答案：自我革命\n为什么对：经过党的十八大以来不懈推进全面从严治党，党找到了自我革命这一跳出治乱兴衰历史周期率的第二个答案。自我革命依靠党自身的力量发现和解决问题，保持先进性和纯洁性，是党长期执政条件下解决自身问题的根本途径。\n干扰项分析：“反腐惩恶”是自我革命的重要内容和具体举措，不能概括第二个答案；“善于斗争”讲的是斗争本领，属于能力要求；“自我完善”只是自我革命的一个方面，完整表述是自我净化、自我完善、自我革新、自我提高。\n记忆：跳出历史周期率的第二个答案是自我革命。\n依据：党的二十大报告。","memoryTip":"跳出治乱兴衰历史周期率的第二个答案是自我革命","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-ds10rw8ji97","type":"choice","stem":"在重大风险面前，必须坚持( )和极限思维，唯有主动迎战、坚决斗争才能赢得尊严、求得发展。","options":[{"key":"A","text":"历史思维"},{"key":"B","text":"底线思维"},{"key":"C","text":"战略思维"},{"key":"D","text":"辩证思维"}],"answer":["底线思维"],"explanation":"正确答案：底线思维\n为什么对：在重大风险面前，必须坚持底线思维和极限思维。底线思维要求守住不发生系统性风险的底线，极限思维要求设想最坏情况、争取最好结果。二者结合，才能在风险来临前做好准备，主动迎战、坚决斗争。\n干扰项分析：“历史思维”着眼于从历史中把握规律；“战略思维”着眼于全局和长远谋划；“辩证思维”着眼于全面、发展地看问题。三者都是重要思维方法，但题干与极限思维并列使用，固定搭配是底线思维。\n记忆：风险面前，底线思维加极限思维。\n依据：教材表述。","memoryTip":"重大风险面前坚持底线思维和极限思维","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-df054kt7ovm","type":"choice","stem":"增强维护国家安全能力，要提高防范化解重大风险能力，严密防范( )，严厉打击敌对势力渗透、破坏、颠覆、分裂活动。","options":[{"key":"A","text":"经济风险"},{"key":"B","text":"政治风险"},{"key":"C","text":"系统性金融风险"},{"key":"D","text":"系统性安全风险"}],"answer":["系统性安全风险"],"explanation":"正确答案：系统性安全风险\n为什么对：党的二十大报告提出，提高防范化解重大风险能力，严密防范系统性安全风险，严厉打击敌对势力渗透、破坏、颠覆、分裂活动。系统性安全风险一旦发生会牵动全局，因此要严密防范，并同步打击敌对势力的破坏活动。\n干扰项分析：“经济风险”“政治风险”只是风险的具体类别，范围窄于系统性安全风险；“系统性金融风险”专门指向金融领域，是经济安全中的重点，不能覆盖国家安全全局。题干与敌对势力破坏活动并列，落点是系统性安全风险。\n记忆：严密防范系统性安全风险，打击渗透破坏颠覆分裂。\n依据：党的二十大报告。","memoryTip":"严密防范系统性安全风险，打击渗透破坏颠覆分裂","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-9rrmhgr1u79","type":"choice","stem":"( )是把忧患意识转化为科学认识方法论所形成的思维方法和思维特征，是在忧患意识和斗争精神的基础上形成的对发展中风险的预判、防范和化解。","options":[{"key":"A","text":"战略思维"},{"key":"B","text":"辩证思维"},{"key":"C","text":"系统思维"},{"key":"D","text":"底线思维"}],"answer":["底线思维"],"explanation":"正确答案：底线思维\n为什么对：底线思维是把忧患意识转化为科学认识方法论所形成的思维方法和思维特征，在忧患意识和斗争精神的基础上，对发展中风险进行预判、防范和化解。它要求从最坏处着眼，向最好处努力，守住不发生重大风险的底线。\n干扰项分析：“战略思维”着眼于全局和长远；“辩证思维”着眼于矛盾分析和全面看问题；“系统思维”着眼于要素关联和整体推进。三者都不以忧患意识转化为方法论为定义特征，与题干定义不对应。\n记忆：底线思维由忧患意识转化而来，重在预判防范化解。\n依据：教材表述。","memoryTip":"底线思维把忧患意识转化为科学认识方法论","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-95r22tshpn","type":"choice","stem":"只有统筹好( )，不断解放和发展社会生产力，不断增强经济实力、科技实力、综合国力，不断增强人民群众的获得感、幸福感、安全感，才能够使中华民族伟大复兴的巨轮乘风破浪、行稳致远。","options":[{"key":"A","text":"发展和安全"},{"key":"B","text":"改革和开放"},{"key":"C","text":"守正和创新"},{"key":"D","text":"经济与社会"}],"answer":["发展和安全"],"explanation":"正确答案：发展和安全\n为什么对：总体国家安全观把统筹发展和安全作为基本要求，发展是安全的基础，安全是发展的条件。只有把两者放在同一盘棋上谋划，才能在增强经济实力、科技实力、综合国力的同时守住安全底线，让民族复兴的进程行稳致远。\n干扰项分析：“改革和开放”指向发展的动力来源，题干强调的是安全与发展之间的统筹关系；“守正和创新”是推进理论创新和实践创新的要求，与题干语境不合；“经济与社会”只覆盖经济社会两个领域，缺少安全这一关键维度。\n记忆：发展安全两手抓，两件大事一盘棋。\n依据：《总体国家安全观学习纲要》；教材表述。","memoryTip":"发展和安全要统筹，两件大事一盘棋","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-jxlvnlc9smn","type":"choice","stem":"高质量发展，就是能够很好满足人民日益增长的( )需要的发展，是体现新发展理念的发展，是创新成为第一动力、协调成为内生特点、绿色成为普遍形态、开放成为必由之路、共享成为根本目的的发展。","options":[{"key":"A","text":"物质生活"},{"key":"B","text":"美好生活"},{"key":"C","text":"精神生活"},{"key":"D","text":"文化生活"}],"answer":["美好生活"],"explanation":"正确答案：美好生活\n为什么对：党的十九大作出我国社会主要矛盾转化的判断，人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾成为主要矛盾。高质量发展正是为满足这一需要而提出的发展要求，并以创新、协调、绿色、开放、共享的新发展理念为内涵。\n干扰项分析：“物质生活”只涉及物质层面，覆盖不了人民对民主、法治、公平、正义、安全、环境等方面的需要；“精神生活”同样只是其中一个方面；“文化生活”范围更窄，无法概括新时代人民需要的整体内容。\n记忆：主要矛盾变了，需要前面加美好。\n依据：党的十九大报告；教材表述。","memoryTip":"新时代主要矛盾，指向美好生活需要","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-11tpulh48d9","type":"choice","stem":"( )延续着我们国家和民族的精神根脉，这个精神根脉不能丢也不能断。","options":[{"key":"A","text":"马克思主义"},{"key":"B","text":"核心价值观"},{"key":"C","text":"中华优秀传统文化"},{"key":"D","text":"思想道德素养"}],"answer":["中华优秀传统文化"],"explanation":"正确答案：中华优秀传统文化\n为什么对：中华优秀传统文化积淀着中华民族最深层的精神追求，代表着中华民族独特的精神标识，是国家和民族的精神根脉。丢掉这个根脉，文化自信就失去根基，文化安全也无从谈起，因此这一根脉不能丢也不能断。\n干扰项分析：“马克思主义”是我们的指导思想，被比为魂脉，与题干所说的根脉分属不同层次；“核心价值观”是当代中国精神的集中体现，属于价值层面的凝练；“思想道德素养”指向个人品德修养，都不能替代作为精神根脉的传统文化。\n记忆：魂脉是马克思主义，根脉是传统文化。\n依据：教材表述。","memoryTip":"魂脉是马克思主义，根脉是传统文化","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-7kqqtpqdf1x","type":"choice","stem":"中国始终把捍卫( )安全作为维护国家经济安全不可逾越的底线和红线。","options":[{"key":"A","text":"经济主权"},{"key":"B","text":"经济秩序"},{"key":"C","text":"重点经济领域"},{"key":"D","text":"经济发展道路"}],"answer":["经济主权"],"explanation":"正确答案：经济主权\n为什么对：经济主权是国家对本国经济事务的最高支配权力，涉及基本经济制度、重要资源、关键产业和金融命脉。中国在对外开放中始终守住这一底线，把捍卫经济主权作为维护国家经济安全不可逾越的底线和红线，不拿核心利益做交易。\n干扰项分析：“经济秩序”指经济运行的有序状态，属于需要维护的对象，地位达不到底线和红线；“重点经济领域”是安全维护的具体范围，范围表述不能等同于支配权力；“经济发展道路”是道路选择问题，与主权的归属含义不同。\n记忆：经济主权守红线，核心利益不交易。\n依据：教材表述。","memoryTip":"经济主权是底线红线，核心利益不交易","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-01q4ynoeokhz","type":"choice","stem":"现在，民族复兴伟业正处于一个船到中流浪更急、人到半山路更陡的时候，是一个愈进愈难、愈进愈险而又不进则退、非进不可的时候。因此，坚持中国特色国家安全道路必须( )。","options":[{"key":"A","text":"规划伟大布局"},{"key":"B","text":"树立伟大目标"},{"key":"C","text":"进行伟大斗争"},{"key":"D","text":"增强伟大动力"}],"answer":["进行伟大斗争"],"explanation":"正确答案：进行伟大斗争\n为什么对：民族复兴处在船到中流浪更急、人到半山路更陡的阶段，风险和挑战明显增多。坚持中国特色国家安全道路，就要发扬斗争精神，提高斗争本领，在进行伟大斗争中维护国家主权、安全、发展利益。\n干扰项分析：“规划伟大布局”把工作重点放在谋篇布局上，回答不了愈进愈险形势下如何应对风险挑战；“树立伟大目标”解决方向问题，而方向已经明确；“增强伟大动力”讲的是动力来源，与题干强调的攻坚克难不对应。\n记忆：船到中流须斗争，愈进愈险愈要进。\n依据：教材表述。","memoryTip":"船到中流更要斗争，愈进愈险愈要进","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-ydi5g2k4xhe","type":"choice","stem":"拥有( )是实现高水平科技自立自强的基础。","options":[{"key":"A","text":"关键核心技术"},{"key":"B","text":"世界前沿技术"},{"key":"C","text":"高水平科研人员"},{"key":"D","text":"科技创新能力"}],"answer":["关键核心技术"],"explanation":"正确答案：关键核心技术\n为什么对：关键核心技术是要不来、买不来、讨不来的。只有把关键核心技术掌握在自己手里，才能握住科技发展的主动权，为高水平科技自立自强提供基础，也才能避免在重要领域受制于人。\n干扰项分析：“世界前沿技术”范围宽泛，前沿并不等于自主可控，掌握不了的技术再多也靠不住；“高水平科研人员”是人才支撑，属于主体条件；“科技创新能力”是整体能力的表现，本身还需要基础来支撑。\n记忆：核心技术买不来，自立自强靠攻关。\n依据：教材表述。","memoryTip":"关键核心技术买不来，自立自强靠攻关","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-0c1q7bhf4cc8","type":"choice","stem":"按劳分配为主体、多种分配方式并存的分配制度能够最大限度地实现( )，有效解决我国收入分配领域存在的突出矛盾和问题，从而保障我国基本经济制度安全。","options":[{"key":"A","text":"效率与公平的统一"},{"key":"B","text":"供给与需求的统一"},{"key":"C","text":"活力与秩序的统一"},{"key":"D","text":"物质与精神的统一"}],"answer":["效率与公平的统一"],"explanation":"正确答案：效率与公平的统一\n为什么对：按劳分配为主体、多种分配方式并存的分配制度，既承认劳动差别、鼓励多劳多得，又通过再分配和各种调节手段防止差距过大。它把效率与公平统一起来，针对收入分配领域的突出矛盾和问题，从制度上保障基本经济制度安全。\n干扰项分析：“供给与需求的统一”是宏观经济总量平衡的问题，与分配制度的调节功能不对应；“活力与秩序的统一”讲的是经济社会运行状态；“物质与精神的统一”属于文明层面，都不属于分配制度直接实现的目标。\n记忆：分配制度一手效率，一手公平。\n依据：教材表述。","memoryTip":"分配制度兼顾效率与公平，两者统一","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-bal01lgn1u7","type":"choice","stem":"在国家安全体系中，( )是建设社会主义文化强国的前提和基础。","options":[{"key":"A","text":"政治安全"},{"key":"B","text":"经济安全"},{"key":"C","text":"社会安全"},{"key":"D","text":"文化安全"}],"answer":["文化安全"],"explanation":"正确答案：文化安全\n为什么对：文化安全关系意识形态主导权和民族文化生命力。守住文化安全，才能继承弘扬中华优秀传统文化、培育和践行社会主义核心价值观，为建设社会主义文化强国打牢前提和基础。\n干扰项分析：“政治安全”在国家安全体系中处于根本地位，是文化建设的政治保证；“经济安全”是国家安全的基础，为文化建设提供物质条件；“社会安全”是国家安全的重要保障，三者都不承担文化强国建设前提和基础这一特定定位。\n记忆：文化强国建设，先守文化安全底线。\n依据：教材表述。","memoryTip":"建设文化强国，先守住文化安全底线","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-0mc2prnsx4co","type":"choice","stem":"提高公共安全治理水平，要提高防灾减灾救灾和重大突发公共事件处置保障能力，加强国家( )建设。","options":[{"key":"A","text":"协调应急力量"},{"key":"B","text":"区域应急力量"},{"key":"C","text":"整体应急力量"},{"key":"D","text":"总体应急力量"}],"answer":["区域应急力量"],"explanation":"正确答案：区域应急力量\n为什么对：党的二十大报告在提高公共安全治理水平部分提出，提高防灾减灾救灾和重大突发公共事件处置保障能力，加强国家区域应急力量建设。区域应急力量按区域布局、就近响应，能够在突发事件初期快速到位，是处置保障能力的重要依托。\n干扰项分析：“协调应急力量”讲的是力量之间的协调关系；“整体应急力量”是笼统的说法，没有回答布局问题；“总体应急力量”同样停留在总量层面，三者都不是报告中的固定表述。\n记忆：防灾救灾靠就近，区域力量先到位。\n依据：党的二十大报告。","memoryTip":"防灾救灾要靠就近，区域应急力量先到位","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-rka2yfro3z9","type":"choice","stem":"我国药品监管制度逐步完善，药品可及性问题基本解决，公众预防诊断治疗用药基本需求得到满足，已成为全球第( )大医药消费市场、第一大原料药出口国。","options":[{"key":"A","text":"二"},{"key":"B","text":"三"},{"key":"C","text":"一"},{"key":"D","text":"四"}],"answer":["二"],"explanation":"正确答案：二\n为什么对：经过药品审评审批制度改革和监管制度完善，我国药品可及性问题基本解决，公众预防、诊断、治疗用药的基本需求得到满足。我国已成为全球第二大医药消费市场、第一大原料药出口国，这一组数据反映的是医药产业规模和供应能力的位次。\n干扰项分析：“三”与“四”都低于实际位次，与我国医药消费市场的规模不符；“一”对应的是题干后半句的原料药出口国位次，把这个位次安到医药消费市场上就发生了错位。\n记忆：消费市场第二，原料药出口第一。\n依据：教材表述。","memoryTip":"我国消费市场第二大，原料药出口第一","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-jc0bu032syg","type":"choice","stem":"主张\"民惟邦本，本固邦宁\"，体现了中华优秀传统战略文化( )。","options":[{"key":"A","text":"倡导和平共处"},{"key":"B","text":"重视群策群力"},{"key":"C","text":"注重民本思想"},{"key":"D","text":"推崇张弛有度"}],"answer":["注重民本思想"],"explanation":"正确答案：注重民本思想\n为什么对：“民惟邦本，本固邦宁”出自《尚书》，意思是人民是国家的根本，根本稳固国家才能安宁。它把民心向背看作政权安危的关键，体现的是中华优秀传统战略文化中注重民本思想的一面。\n干扰项分析：“倡导和平共处”对应的是协和万邦、亲仁善邻一类主张；“重视群策群力”对应的是集思广益、众志成城一类主张；“推崇张弛有度”对应的是文武之道、一张一弛一类主张，三者的经典依据与题干引文都不相同。\n记忆：民惟邦本，要点在民本。\n依据：教材表述。","memoryTip":"民惟邦本出自尚书，核心是民本思想","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-2g1zl1wqwow","type":"choice","stem":"关于\"颜色革命\"，以下说法错误的是( )。","options":[{"key":"A","text":"\"颜色革命\"往往导致所在国家和地区矛盾激化、社会失序"},{"key":"B","text":"近些年来，一些国家发生的\"颜色革命\"大都以年轻人尤其是学生为主要参与主体"},{"key":"C","text":"\"颜色革命\"往往导致所在国家和地区企业倒闭、资本外流、经济衰退"},{"key":"D","text":"\"颜色革命\"是指20世纪末期开始的发生在中亚、东欧独联体国家和中东北非地区的一系列以暴力方式进行的政权变更运动"}],"answer":["\"颜色革命\"是指20世纪末期开始的发生在中亚、东欧独联体国家和中东北非地区的一系列以暴力方式进行的政权变更运动"],"explanation":"正确答案：“颜色革命”是指20世纪末期开始的发生在中亚、东欧独联体国家和中东北非地区的一系列以暴力方式进行的政权变更运动\n为什么对：这一说法在“以暴力方式”上出了问题。所谓“颜色革命”被包装成街头抗议、选举争议等非暴力形式，打着民主、自由的旗号推动政权更迭，恰恰以非暴力姿态示人，所以题库把它判为错误说法。\n干扰项分析：“颜色革命往往导致所在国家和地区矛盾激化、社会失序”成立，政权更迭过程通常伴随社会撕裂和秩序混乱；“近些年来，一些国家发生的颜色革命大都以年轻人尤其是学生为主要参与主体”成立，青年群体容易被动员和利用；“颜色革命往往导致所在国家和地区企业倒闭、资本外流、经济衰退”成立，政局动荡直接冲击投资和生产经营。\n记忆：颜色革命披非暴力外衣，实为政权更迭。\n依据：教材表述。","memoryTip":"颜色革命披着非暴力外衣，实质是政权更迭","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-qwwgwhease","type":"choice","stem":"随着经济全球化持续深入发展，国家间联系日益紧密，国际社会越来越成为( )的命运共同体。","options":[{"key":"A","text":"携手努力、共同担当"},{"key":"B","text":"风雨同舟、荣辱与共"},{"key":"C","text":"你中有我、我中有你"},{"key":"D","text":"\"和合共生\""}],"answer":["你中有我、我中有你"],"explanation":"正确答案：你中有我、我中有你\n为什么对：经济全球化使生产、贸易、金融、人员往来跨国交织，各国利益深度嵌合。国际社会越来越成为你中有我、我中有你的命运共同体，任何一个国家都难以在封闭状态下独善其身。\n干扰项分析：“携手努力、共同担当”讲的是各方应有的态度和行动；“风雨同舟、荣辱与共”多用于形容紧密的伙伴关系，重心在共担风雨；“和合共生”是一种理念主张，三者都不是描述各国相互嵌入状态的固定表述。\n记忆：经济全球化，各国你中有我我中有你。\n依据：教材表述。","memoryTip":"经济全球化，各国你中有我我中有你","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-irl7k84bat","type":"choice","stem":"( )是指通过法律、经济伦理和行政手段建立起来的基本规则以及经济运行的有序性。","options":[{"key":"A","text":"生产发展安全"},{"key":"B","text":"经济主权"},{"key":"C","text":"经济秩序"},{"key":"D","text":"法律秩序"}],"answer":["经济秩序"],"explanation":"正确答案：经济秩序\n为什么对：经济秩序是通过法律、经济伦理和行政手段建立起来的基本规则，以及经济运行的有序状态。规则健全、运行有序，市场主体的预期才稳定，经济安全才有制度支撑，这正是题干给出的定义。\n干扰项分析：“生产发展安全”不是这一组概念中的规范术语，也概括不了规则与有序性两层含义；“经济主权”讲的是国家对本国经济的最高支配权力，属于权力归属；“法律秩序”只覆盖法律手段一个方面，范围窄于经济秩序。\n记忆：规则健全、运行有序，就是经济秩序。\n依据：教材表述。","memoryTip":"经济秩序靠法律伦理行政共同支撑","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-h26t132ehc9","type":"choice","stem":"( )4月，习近平在十八届中央政治局第十四次集体学习时指出，改革开放以来，中国共产党始终高度重视正确处理改革发展稳定关系，始终把维护国家安全和社会安定作为党和国家的一项基础性工作。","options":[{"key":"A","text":"2016年"},{"key":"B","text":"2014年"},{"key":"C","text":"2015年"},{"key":"D","text":"2017年"}],"answer":["2014年"],"explanation":"正确答案：2014年\n为什么对：十八届中央政治局第十四次集体学习安排在2014年4月，主题是切实维护国家安全和社会安定。习近平总书记在这次学习中回顾改革开放以来处理改革发展稳定关系的经验，强调始终把维护国家安全和社会安定作为党和国家的一项基础性工作。\n干扰项分析：“2016年”“2015年”“2017年”都不符合十八届中央政治局第十四次集体学习的时间。这届中央政治局任期为2012年至2017年，第十四次集体学习发生在任期前段，与2014年相符。\n记忆：二〇一四年四月，十四次集体学习。\n依据：教材表述。","memoryTip":"记住二〇一四年四月十四次集体学习","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-b9ux6u67rnm","type":"choice","stem":"在复杂严峻的国家安全形势下，加强大学生国家安全教育是维护和塑造国家安全的( )，也是培养和造就新时代好青年的应有之义。","options":[{"key":"A","text":"根本举措"},{"key":"B","text":"基本前提"},{"key":"C","text":"必要条件"},{"key":"D","text":"重要基础"}],"answer":["重要基础"],"explanation":"正确答案：重要基础\n为什么对：在复杂严峻的国家安全形势下，大学生群体的国家安全意识直接关系国家安全的社会基础。加强大学生国家安全教育，是在青年中打牢维护和塑造国家安全的根基，也为培养担当民族复兴大任的时代新人提供支撑。\n干扰项分析：“根本举措”把一项教育工作抬到根本位置，与教材对基础性工作的定位不符；“基本前提”在逻辑上把教育置于国家安全之前，颠倒了保障与被保障的关系；“必要条件”只是形式逻辑的表述，不是教材对这一工作的定性。\n记忆：青年教育打基础，基础牢固安全稳。\n依据：教材表述。","memoryTip":"大学生安全教育，夯实国家安全基础","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-qyduk1hbzd","type":"choice","stem":"坚持以促进国际安全为依托，为实现国际社会的共同安全以及顺应( )的时代潮流提供了强有力的保障。","options":[{"key":"A","text":"和平、发展、合作、共赢"},{"key":"B","text":"和平与发展"},{"key":"C","text":"世界格局多极化"},{"key":"D","text":"经济全球化"}],"answer":["和平、发展、合作、共赢"],"explanation":"正确答案：和平、发展、合作、共赢\n为什么对：以促进国际安全为依托，意味着把本国安全放在国际共同安全的大环境中谋划。当今时代潮流是和平、发展、合作、共赢，顺应这一潮流，才能为实现国际社会的共同安全提供有力保障。\n干扰项分析：“和平与发展”是时代主题的经典表述，缺少合作、共赢两层，与题干要求的时代潮流不完全对应；“世界格局多极化”讲的是国际力量对比的走向；“经济全球化”讲的是经济联系的方式，两者都属于趋势判断，不能替代时代潮流。\n记忆：时代潮流八个字，和平发展合作共赢。\n依据：教材表述。","memoryTip":"时代潮流八个字，和平发展合作共赢","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-r5bof394e5i","type":"choice","stem":"水生态安全、土壤生态安全、大气环境安全、海洋环境安全属于哪一范畴?( )","options":[{"key":"A","text":"生态空间安全"},{"key":"B","text":"人居环境安全"},{"key":"C","text":"全球化生态环境应对安全"},{"key":"D","text":"生态系统安全"}],"answer":["人居环境安全"],"explanation":"正确答案：人居环境安全\n为什么对：水生态安全、土壤生态安全、大气环境安全、海洋环境安全指向人直接接触和依赖的水、土、气、海，与城乡居民的日常生活环境密切相关，属于人居环境安全的范围。\n干扰项分析：“生态空间安全”关注生态空间格局和生态保护红线的完整性；“全球化生态环境应对安全”关注跨境和全球性环境问题的应对；“生态系统安全”关注生态系统结构与功能的完整，三者都不以人的居住环境为分类依据。\n记忆：水、土、气、海在身边，归入人居环境。\n依据：教材表述。","memoryTip":"水生态、土壤、大气、海洋都归人居环境","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-gmzajxgohy","type":"choice","stem":"( )是中国特色社会主义的本质特征，是党和国家的重要政治优势，是人民军队的建军之本、强军之魂。","options":[{"key":"A","text":"党对军队的绝对领导"},{"key":"B","text":"人民当家作主"},{"key":"C","text":"军委主席负责制"},{"key":"D","text":"强军兴军战略布局"}],"answer":["党对军队的绝对领导"],"explanation":"正确答案：党对军队的绝对领导\n为什么对：党对人民军队的绝对领导是中国特色社会主义的本质特征，是党和国家的重要政治优势，是人民军队的建军之本、强军之魂。它规定了人民军队的性质宗旨，决定了军队听谁指挥、为谁打仗。\n干扰项分析：“人民当家作主”是社会主义民主政治的本质和核心，指向国家权力归属，与军队建设的定位不同；“军委主席负责制”是党对人民军队绝对领导制度中居于最高层次的制度安排，属于这一根本原则的实现形式；“强军兴军战略布局”是推进强军事业的工作布局。\n记忆：建军之本强军之魂，党对军队绝对领导。\n依据：教材表述。","memoryTip":"建军之本强军之魂，党对军队绝对领导","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-n27n5spapzh","type":"choice","stem":"在外部输入性风险诱导下，一些事件可能升级为影响发展和安全的( )风险问题。","options":[{"key":"A","text":"战略性"},{"key":"B","text":"系统性"},{"key":"C","text":"全局性"},{"key":"D","text":"局部性"}],"answer":["全局性"],"explanation":"正确答案：全局性\n为什么对：外部输入性风险通过产业链、金融、舆论、社会心理等渠道传导，个别事件一旦被放大，就会超出局部范围，演变为影响发展和安全全局的问题。题干用全局性来概括这种扩散效应。\n干扰项分析：“战略性”讲的是问题在国家战略层面的分量，题干强调的是扩散范围；“系统性”多用于金融等领域，指风险在系统内部连锁传导；“局部性”与事件升级的方向相反，事件升级恰恰意味着超出局部。\n记忆：外部输入风险会扩散，局部问题变全局。\n依据：教材表述。","memoryTip":"外部输入风险会扩散，局部问题变全局","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-4qgvyxcl3sa","type":"choice","stem":"每个国家在面对全球性问题时，国家无论大小、强弱都应该树立全球意识、( )、推动全球治理，这一点在国际安全领域尤为迫切和重要。","options":[{"key":"A","text":"解决全球性问题"},{"key":"B","text":"立足全球发展倡议"},{"key":"C","text":"担当全球责任"},{"key":"D","text":"落实全球安全倡议"}],"answer":["担当全球责任"],"explanation":"正确答案：担当全球责任\n为什么对：全球性问题没有哪个国家能够单独解决，国家无论大小强弱都应当树立全球意识、担当全球责任、推动全球治理。三者构成由认识到行动、由行动到机制的递进关系，责任担当处在承上启下的位置。\n干扰项分析：“解决全球性问题”是目标本身，放在树立全球意识与推动全球治理之间，动作层次不匹配；“立足全球发展倡议”和“落实全球安全倡议”都是具体的倡议安排，范围窄于题干要求的普遍责任，也与“立足”这一搭配不合。\n记忆：全球意识、全球责任、全球治理三步走。\n依据：教材表述。","memoryTip":"全球意识、全球责任、全球治理三步走","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-pei1e837kk","type":"choice","stem":"( )是国家的根本法，是治国安邦的总章程，具有最高的法律地位、法律权威、法律效力。","options":[{"key":"A","text":"反分裂国家法"},{"key":"B","text":"民法典"},{"key":"C","text":"刑法"},{"key":"D","text":"宪法"}],"answer":["宪法"],"explanation":"正确答案：宪法\n为什么对：宪法以法律形式确认国家的根本制度和根本任务，规定公民的基本权利和义务，是国家的根本法，是治国安邦的总章程，具有最高的法律地位、法律权威、法律效力。一切法律都不得同宪法相抵触。\n干扰项分析：“反分裂国家法”是维护国家统一、反对分裂的专门法律；“民法典”调整平等主体之间的人身关系和财产关系，是民事领域的基础性法律；“刑法”规定犯罪和刑罚，是刑事领域的基本法律，三者的效力都低于宪法。\n记忆：根本法与总章程，说的都是宪法。\n依据：《中华人民共和国宪法》序言。","memoryTip":"国家的根本法、治国安邦总章程是宪法","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-5xs018npalt","type":"choice","stem":"宏观调控是政府通过行政手段与经济手段，对经济运行状态和经济关系进行( )，以维护经济结构和重大经济关系平衡，推动经济持续、快速、协调、健康发展的活动和过程。","options":[{"key":"A","text":"管制和调整"},{"key":"B","text":"指导和调控"},{"key":"C","text":"干预和限制"},{"key":"D","text":"干预和调整"}],"answer":["干预和调整"],"explanation":"正确答案：干预和调整\n为什么对：宏观调控是政府运用行政手段和经济手段，对经济运行状态和经济关系进行干预和调整，目的在于保持经济结构平衡和重大经济关系平衡，推动经济持续、快速、协调、健康发展。干预说明政府要出手，调整说明出手的方式。\n干扰项分析：“管制和调整”中的管制带有直接命令色彩，与宏观调控以间接调节为主的特点不符；“指导和调控”与题干句末的调控重复，指导也概括不了对经济关系的处理；“干预和限制”中的限制与发展经济的目的相冲突。\n记忆：宏观调控两手抓，一手干预一手调整。\n依据：教材表述。","memoryTip":"宏观调控两手抓，一手干预一手调整","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-o2lyl96ud7b","type":"choice","stem":"中国倡导的和平、发展、公平、正义、民主、自由的( )，勾勒出世界各国人民普遍认同的价值理念和最大同心圆。","options":[{"key":"A","text":"全球安全倡议"},{"key":"B","text":"全人类共同价值"},{"key":"C","text":"全球发展倡议"},{"key":"D","text":"全球文明倡议"}],"answer":["全人类共同价值"],"explanation":"正确答案：全人类共同价值\n为什么对：和平、发展、公平、正义、民主、自由，是中国倡导的全人类共同价值。它超越社会制度和意识形态差异，反映各国人民对美好生活的共同向往，勾勒出世界各国人民普遍认同的价值理念和最大同心圆。\n干扰项分析：“全球安全倡议”着眼安全领域的合作；“全球发展倡议”着眼发展领域的合作；“全球文明倡议”着眼文明交流互鉴，三者都是具体倡议，名称与这六个价值范畴不对应。\n记忆：和平发展公平正义民主自由，即共同价值。\n依据：党的二十大报告；教材表述。","memoryTip":"和平发展公平正义民主自由，即共同价值","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-q3n9ya4iqnl","type":"choice","stem":"改革开放以来，中国特色社会主义制度不断健全，沿着( )的方向不断完善。","options":[{"key":"A","text":"系统完备、协同配合、形式多样"},{"key":"B","text":"系统完备、科学规范、运行有效"},{"key":"C","text":"科学规范、运行有效、形式多样"},{"key":"D","text":"系统完备、形式多样、运行有效"}],"answer":["系统完备、科学规范、运行有效"],"explanation":"正确答案：系统完备、科学规范、运行有效\n为什么对：中国特色社会主义制度沿着系统完备、科学规范、运行有效的方向不断完善。系统完备要求各领域制度配套齐全，科学规范要求制度设计符合规律，运行有效要求制度能够执行到位，三者分别对应制度体系的完整、合理与管用。\n干扰项分析：“系统完备、协同配合、形式多样”和“科学规范、运行有效、形式多样”都掺入了形式多样，制度完善追求的是务实管用，形式多样不构成方向；“系统完备、形式多样、运行有效”同样把形式多样换进固定表述，改变了原意。\n记忆：制度完善三句话，完备、规范、有效。\n依据：教材表述。","memoryTip":"系统完备、科学规范、运行有效十二字","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-s7iue1bsm2h","type":"choice","stem":"不属于人居环境安全的是( )。","options":[{"key":"A","text":"大气环境安全"},{"key":"B","text":"海洋环境安全"},{"key":"C","text":"核安全"},{"key":"D","text":"水生态安全"}],"answer":["核安全"],"explanation":"正确答案：核安全\n为什么对：这道题要求选出不属于人居环境安全的选项。人居环境安全关注与城乡居民日常生活直接相关的环境要素，水、土、气、海都在其中。核安全针对核设施、核材料、核活动和核废料，属于单独设置的核安全领域，因此不属于人居环境安全。\n干扰项分析：“大气环境安全”“海洋环境安全”“水生态安全”都与人的居住环境直接相关，是人居环境安全的组成部分，所以它们成立，不能作为本题答案。\n记忆：人居环境管水土气海，核安全单独成域。\n依据：教材表述。","memoryTip":"人居环境安全包水土气海，核安全单列","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-z1mxn91ci","type":"choice","stem":"准确理解新时代的内涵和意义、深刻把握新时代新征程的使命任务，新时代大学生就能明确当代中国发展的( )，在坚持和发展新时代中国特色社会主义中找准自己的人生定位。","options":[{"key":"A","text":"阶段理念"},{"key":"B","text":"前进动力路径"},{"key":"C","text":"时代背景"},{"key":"D","text":"历史前进方向"}],"answer":["历史前进方向"],"explanation":"正确答案：历史前进方向\n为什么对：准确理解新时代的内涵和意义、深刻把握新时代新征程的使命任务，大学生才能看清当代中国向何处去，明确历史前进方向，进而把个人成长放到坚持和发展新时代中国特色社会主义的大局中定位。\n干扰项分析：“阶段理念”是生硬拼合的说法，构不成发展方向；“前进动力路径”把动力和路径两个不同问题混在一起，与明确方向不搭；“时代背景”是认识的前提，看清背景之后才能判明方向，本身回答不了方向问题。\n记忆：读懂新时代，才知向何处去。\n依据：教材表述。","memoryTip":"把握新时代使命，方知历史前进方向","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-zja2wl3m7y","type":"choice","stem":"军委主席负责制在党对人民军队绝对领导一整套制度中，处于最高层次，居于( )地位，具有牵一发而动全身的决定性作用。","options":[{"key":"A","text":"核心和统领"},{"key":"B","text":"目标和导向"},{"key":"C","text":"联结与纽带"},{"key":"D","text":"前提和基础"}],"answer":["核心和统领"],"explanation":"正确答案：核心和统领\n为什么对：军委主席负责制在党对人民军队绝对领导的一整套制度中处在最高层次，居于核心和统领地位。它把最高领导权和指挥权集中于党中央、中央军委和军委主席，牵一发而动全身，对军队建设全局具有决定性作用。\n干扰项分析：“目标和导向”讲的是努力方向，制度地位不能用目标来概括；“联结与纽带”强调的是连接作用，层次较低；“前提和基础”指的是先行条件，而军委主席负责制处在制度体系的顶端。\n记忆：最高层次、核心统领，军委主席负责制。\n依据：教材表述。","memoryTip":"最高层次、核心统领，指军委主席负责制","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-5fx87ozwu67","type":"choice","stem":"坚持( )，是走好中国特色国家安全道路的必然要求，也是中国式现代化作为走和平发展道路的现代化的必然要求。","options":[{"key":"A","text":"共同安全"},{"key":"B","text":"文化安全"},{"key":"C","text":"人民安全"},{"key":"D","text":"军事安全"}],"answer":["共同安全"],"explanation":"正确答案：共同安全\n为什么对：中国特色国家安全道路坚持促进国际安全为依托，主张各国安全相互依存、不可分割。坚持共同安全，既符合走好中国特色国家安全道路的必然要求，也符合中国式现代化走和平发展道路的必然要求。\n干扰项分析：“文化安全”是国家安全的一个领域，不承担道路层面的要求；“人民安全”是总体国家安全观的宗旨，讲的是为谁的安全；“军事安全”是保底手段，讲的是安全的能力支撑，三者都不能直接对应和平发展道路的要求。\n记忆：各国安全相互依存，共同安全为正解。\n依据：教材表述。","memoryTip":"各国安全相互依存，共同安全为正解","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-fcrqqrrz1zq","type":"choice","stem":"我国要破解面对的突出矛盾和问题，防范化解各类风险隐患，归根到底要靠( )。","options":[{"key":"A","text":"发展"},{"key":"B","text":"预防"},{"key":"C","text":"安全"},{"key":"D","text":"改革"}],"answer":["发展"],"explanation":"正确答案：发展\n为什么对：我国面对的突出矛盾和问题，根子在发展不平衡不充分。破解这些问题、化解各类风险隐患，归根到底要靠发展。发展是提升国家安全实力的基础和前提，要把发展作为解决一切问题的基础和关键。\n干扰项分析：“预防”是做好安全工作的方针，属于方法层面的要求；“安全”是发展的条件，是发展所要维护的状态；“改革”是发展的动力，能够为发展开辟道路，三者都不能替代发展本身成为根本依托。\n记忆：矛盾根子在发展，破解也要靠发展。\n依据：教材表述。","memoryTip":"发展不平衡不充分，最终要靠发展破解","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-g5gf6bsskxn","type":"choice","stem":"提高人民军队打赢能力，要提高军事力量( )运用水平，坚持边斗争、边备战、边建设，坚定灵活开展军事斗争，密切关注国家安全形势变化，着力塑造安全态势，聚精会神备战练兵，确保召之即来、来之能战、战之必胜。","options":[{"key":"A","text":"信息化智能化"},{"key":"B","text":"集约化高效化"},{"key":"C","text":"常态化多样化"},{"key":"D","text":"综合化一体化"}],"answer":["常态化多样化"],"explanation":"正确答案：常态化多样化\n为什么对：党的二十大报告提出，加强军事力量常态化多样化运用，坚定灵活开展军事斗争，塑造安全态势。常态化强调军事力量运用的持续性和经常性，多样化强调运用方式和场景的丰富，二者共同支撑边斗争、边备战、边建设。\n干扰项分析：“信息化智能化”描述战争形态和军队建设方向；“集约化高效化”讲的是资源投入和保障效益；“综合化一体化”讲的是力量融合和联合作战，三者都不是报告中军事力量运用的固定表述。\n记忆：军事力量运用，常态加多样。\n依据：党的二十大报告。","memoryTip":"二十大报告原话：军事力量常态化多样化运用","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.948Z"},{"id":"question-1794391527948-ft0wnb2ey3","type":"choice","stem":"( )不仅是经济社会发展的要求和目标，也是维护和塑造国家安全的要求和目标。","options":[{"key":"A","text":"创新"},{"key":"B","text":"共享"},{"key":"C","text":"可持续性"},{"key":"D","text":"协调"}],"answer":["可持续性"],"explanation":"正确答案：可持续性\n为什么对：可持续性要求在发展过程中兼顾当前和长远，兼顾资源环境承载能力，既关系经济社会能否长久发展，也关系国家安全能否持久稳固。因此它既是经济社会发展的要求和目标，也是维护和塑造国家安全的要求和目标。\n干扰项分析：“创新”是引领发展的第一动力，属于发展动力层面的要求；“共享”是发展的根本目的，属于价值取向；“协调”是发展的内生特点，属于结构要求，三者都不直接回答能不能长久这一层。\n记忆：当前长远要兼顾，可持续性连两头。\n依据：教材表述。","memoryTip":"当前长远要兼顾，可持续性连发展与安全","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-sv28selesqp","type":"choice","stem":"我国《宪法》明确规定:\"公民的合法的私有财产不受侵犯。国家依照法律规定保护公民的私有财产权和( )。\"","options":[{"key":"A","text":"监督权"},{"key":"B","text":"选举权"},{"key":"C","text":"继承权"},{"key":"D","text":"劳动权"}],"answer":["继承权"],"explanation":"正确答案：继承权\n为什么对：我国宪法第十三条规定，公民的合法的私有财产不受侵犯，国家依照法律规定保护公民的私有财产权和继承权。继承权是私有财产权在财产传承环节的延伸，与私有财产权并列受保护，体现对公民财产权利的全链条保障。\n干扰项分析：“监督权”“选举权”属于公民的政治权利，规定在宪法关于公民基本权利的其他条文中；“劳动权”是公民在劳动方面的权利，与财产保护和传承无关。\n记忆：宪法十三条，私有财产加继承权。\n依据：《中华人民共和国宪法》第十三条。","memoryTip":"宪法十三条，私有财产与继承权并列保护","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-qhgaotupw8h","type":"choice","stem":"发展是提升国家安全实力的基础和前提，( )是可持续发展的支撑和保障。","options":[{"key":"A","text":"和平"},{"key":"B","text":"创新"},{"key":"C","text":"安全"},{"key":"D","text":"经济"}],"answer":["安全"],"explanation":"正确答案：安全\n为什么对：发展和安全是一体两面的关系。发展是提升国家安全实力的基础和前提，安全是可持续发展的支撑和保障。没有安全稳定的环境，发展成果随时可能被风险侵蚀，可持续发展就失去依托。\n干扰项分析：“和平”是外部环境条件，属于安全的一个方面；“创新”是发展的第一动力；“经济”是发展的内容，三者都概括不了安全对可持续发展的支撑保障作用。\n记忆：发展打基础，安全作保障。\n依据：教材表述。","memoryTip":"发展是基础，安全是可持续发展的保障","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-btu8ahidpvr","type":"choice","stem":"中国共产党始终高度重视人民群众权利保障工作，在( )权益保障上，坚持人民主体地位，充分体现人民意志、保障人民权益、激发人民创造活力。","options":[{"key":"A","text":"政治"},{"key":"B","text":"文化"},{"key":"C","text":"经济"},{"key":"D","text":"社会"}],"answer":["政治"],"explanation":"正确答案：政治\n为什么对：在政治权益保障上，我国坚持人民主体地位，发展全过程人民民主，保证人民依法通过各种途径和形式管理国家事务、经济文化事业和社会事务，充分体现人民意志、保障人民权益、激发人民创造活力。\n干扰项分析：“文化”权益保障指向文化成果共享和文化参与，侧重精神文化需要；“经济”权益保障指向财产、就业、分配等物质利益；“社会”权益保障指向民生和社会福利，三者都概括不了人民意志和创造活力这一政治内涵。\n记忆：人民意志与创造活力，属于政治权益。\n依据：教材表述。","memoryTip":"人民意志与创造活力，属于政治权益","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-qptqe87kjic","type":"choice","stem":"( )是建设教育强国的龙头，对实现中华民族伟大复兴起着重要作用。","options":[{"key":"A","text":"高等教育"},{"key":"B","text":"中等教育"},{"key":"C","text":"基础教育"},{"key":"D","text":"职业教育"}],"answer":["高等教育"],"explanation":"正确答案：高等教育\n为什么对：高等教育处在教育体系的顶端，承担培养高层次人才、产出高水平科研成果的任务，是建设教育强国的龙头。龙头强，才能带动基础教育和职业教育，支撑高水平科技自立自强，服务民族复兴。\n干扰项分析：“中等教育”处在承上启下的衔接位置，重在学习阶段的过渡；“基础教育”是教育体系的基点，重在打牢成长根基；“职业教育”重在培养技术技能人才，三者都不能承担龙头的定位。\n记忆：教育强国看龙头，龙头是高等教育。\n依据：教材表述。","memoryTip":"教育强国看龙头，龙头就是高等教育","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-okrbj6hles","type":"choice","stem":"新时代党的民族工作的\"纲\"是( )。","options":[{"key":"A","text":"推进各民族共同繁荣发展"},{"key":"B","text":"铸牢中华民族共同体意识"},{"key":"C","text":"全面建设社会主义现代化国家"},{"key":"D","text":"民族平等"}],"answer":["铸牢中华民族共同体意识"],"explanation":"正确答案：铸牢中华民族共同体意识\n为什么对：新时代党的民族工作以铸牢中华民族共同体意识为纲，各项工作都要向这条主线聚焦。它要求引导各族人民牢固树立休戚与共、荣辱与共、命运与共的共同体理念，把民族团结进步事业建立在共同的思想基础上。\n干扰项分析：“推进各民族共同繁荣发展”是民族工作的重要任务；“全面建设社会主义现代化国家”是党和国家事业的总目标，民族工作要服务这个大局；“民族平等”是处理民族关系的基本原则，三者都不是纲的定位。\n记忆：民族工作以铸牢中华民族共同体意识为纲。\n依据：教材表述。","memoryTip":"民族工作以铸牢中华民族共同体意识为纲","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-t4fdacfr8l","type":"choice","stem":"建设科技强国，不断维护和塑造我国科技安全，归根到底要靠高水平( )。","options":[{"key":"A","text":"基础岗位员工"},{"key":"B","text":"基础设施建设"},{"key":"C","text":"科技创新人才"},{"key":"D","text":"科技研发项目"}],"answer":["科技创新人才"],"explanation":"正确答案：科技创新人才\n为什么对：建设科技强国、维护和塑造科技安全，最终还是取决于人的因素。高水平科技创新人才是突破关键核心技术、实现高水平科技自立自强的主体力量，人才队伍的规模和质量直接决定科技安全的水平。\n干扰项分析：“基础岗位员工”是科技活动的辅助力量，难以承担关键核心技术攻关；“基础设施建设”是开展科研的条件；“科技研发项目”是组织攻关的载体，缺少人才都无法转化为现实能力。\n记忆：科技强国靠人才，高水平人才支撑科技安全。\n依据：教材表述。","memoryTip":"科技强国靠人才，高水平人才支撑科技安全。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-c2n7rucsizl","type":"choice","stem":"( )是发展的条件。","options":[{"key":"A","text":"改革"},{"key":"B","text":"稳定"},{"key":"C","text":"创新"},{"key":"D","text":"安全"}],"answer":["安全"],"explanation":"正确答案：安全\n为什么对：统筹发展和安全，二者互为条件。发展是安全的基础，安全是发展的条件；没有安全环境，发展成果可能被风险吞噬，发展进程也会被打断，安全由此成为发展不可缺少的条件。\n干扰项分析：“改革”是发展的动力；“创新”是引领发展的第一动力；“稳定”属于改革发展稳定三者关系的表述，通常与“前提”搭配，题干对应的固定表述是安全。\n记忆：发展是安全的基础，安全是发展的条件。\n依据：教材表述。","memoryTip":"发展是安全的基础，安全是发展的条件。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-rk16jvq9bk","type":"choice","stem":"要充分发挥二十国集团、世界贸易组织、国际货币基金组织、世界银行等全球和区域多边机制的建设性作用，抵制贸易保护主义和单边主义，坚决反对将经贸问题政治化、武器化、泛安全化等经济霸凌行径，维护多边贸易体制，更好建设开放型世界经济，倡导( )的经济全球化。","options":[{"key":"A","text":"共商共建"},{"key":"B","text":"平等有序"},{"key":"C","text":"普惠包容"},{"key":"D","text":"共建共享"}],"answer":["普惠包容"],"explanation":"正确答案：普惠包容\n为什么对：我国倡导平等有序的世界多极化、普惠包容的经济全球化。普惠强调让发展成果惠及各国特别是发展中国家，包容强调尊重不同制度和文化、反对排他性安排，这正是抵制保护主义和单边主义的着力方向。\n干扰项分析：“平等有序”通常与“世界多极化”搭配；“共商共建”“共建共享”是全球治理相关表述，用来修饰经济全球化不符合固定提法。\n记忆：多极化讲平等有序，全球化讲普惠包容。\n依据：教材表述。","memoryTip":"多极化讲平等有序，全球化讲普惠包容。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-dd420h3gxw","type":"choice","stem":"国家领土中最基本的组成部分是( )。","options":[{"key":"A","text":"领陆"},{"key":"B","text":"领空"},{"key":"C","text":"底土"},{"key":"D","text":"领水"}],"answer":["领陆"],"explanation":"正确答案：领陆\n为什么对：国家领土由领陆、领水、领空和底土构成。领陆是国家主权管辖下的陆地及其地下部分，是领土最基本、最原始的组成部分，领水、领空和底土都以领陆为依托并随之确定范围。\n干扰项分析：“领空”是领陆和领水之上的空气空间；“领水”包括内水和领海，依附于陆地；“底土”是领陆和领水下方的地层，三者都由领陆派生。\n记忆：领土由领陆、领水、领空、底土构成，领陆最基本。\n依据：教材表述。","memoryTip":"领土由领陆、领水、领空、底土构成，领陆最基本。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-lgwfkoo2o1s","type":"choice","stem":"加强( )，形成维护和塑造国家安全的合力，使新时代国家安全工作具有广泛的社会基 础和群众基础。","options":[{"key":"A","text":"思想道德教育"},{"key":"B","text":"意识形态教育"},{"key":"C","text":"国家安全教育"},{"key":"D","text":"初心使命教育"}],"answer":["国家安全教育"],"explanation":"正确答案：国家安全教育\n为什么对：维护和塑造国家安全是系统工程，需要全党全社会共同参与。加强国家安全教育能够增强全民国家安全意识、提高风险防范能力，把群众充分发动起来，形成维护和塑造国家安全的合力，使国家安全工作获得广泛社会基础和群众基础。\n干扰项分析：“思想道德教育”服务于道德建设；“意识形态教育”属于意识形态工作；“初心使命教育”属于党的建设，三者各有功能，都不能直接承担动员群众维护国家安全的任务。\n记忆：加强国家安全教育，才能形成维护国家安全的合力。\n依据：教材表述。","memoryTip":"加强国家安全教育，才能形成维护国家安全的合力。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-f66xbi1jc2g","type":"choice","stem":"国家安全( )是国家安全能力的基础。","options":[{"key":"A","text":"体系"},{"key":"B","text":"防范"},{"key":"C","text":"部署"},{"key":"D","text":"法律"}],"answer":["体系"],"explanation":"正确答案：体系\n为什么对：国家安全体系涵盖领导体制、法治体系、战略体系、政策体系和风险监测预警体系等制度安排。体系健全，能力建设才有依托；制度框架不完善，防范处置就缺少稳定支撑，所以国家安全体系是国家安全能力的基础。\n干扰项分析：“防范”是能力运用的具体环节；“部署”是工作安排；“法律”只是国家安全体系的组成部分之一，三者都不能概括能力赖以生成的制度基础。\n记忆：体系是能力的基础，制度稳则能力强。\n依据：教材表述。","memoryTip":"体系是能力的基础，制度稳则能力强。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers"
