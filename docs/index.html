:"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-5keeyw7fxfh","type":"choice","stem":"重大自然灾害、突发疫情严重威胁人民生命健康。以下说法错误的是( )。","options":[{"key":"A","text":"我国是世界上自然灾害最少的国家"},{"key":"B","text":"防范化解重大疫情和重大突发公共卫生风险，是我国必须面对的重大风险"},{"key":"C","text":"我国自然灾害种类多、分布区域广、发生频次高、造成损失重"},{"key":"D","text":"伴随着全球气候变化和极端天气频发，我国应对自然灾害的形势更加严峻"}],"answer":["我国是世界上自然灾害最少的国家"],"explanation":"正确答案：我国是世界上自然灾害最少的国家\n为什么对：题干预设为选出错误说法。我国是世界上自然灾害最为严重的国家之一，灾害种类多、分布区域广、发生频次高、造成损失重。这一基本国情决定了防灾减灾救灾工作在国家治理中的重要地位，“自然灾害最少”的判断与事实相反。\n干扰项分析：“防范化解重大疫情和重大突发公共卫生风险，是我国必须面对的重大风险”符合公共卫生安全的现实；“我国自然灾害种类多、分布区域广、发生频次高、造成损失重”是对我国灾害国情的准确概括；“伴随着全球气候变化和极端天气频发，我国应对自然灾害的形势更加严峻”符合气候变化带来的新挑战。\n记忆：我国灾害种类多、分布广、频次高、损失重。\n依据：教材表述","memoryTip":"我国灾害种类多、分布广、频次高、损失重。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-zy0w5mzyi1","type":"choice","stem":"下列选项对我国资源描述错误的是( )。","options":[{"key":"A","text":"煤炭、油气、水电等资源的消费主要集中在东南地区"},{"key":"B","text":"资源分布不均，资源分布与消费市场逆向分布"},{"key":"C","text":"我国各种自然资源总量丰富，人均量也多"},{"key":"D","text":"土地资源绝对量大，但人均耕地面积少"}],"answer":["我国各种自然资源总量丰富，人均量也多"],"explanation":"正确答案：我国各种自然资源总量丰富，人均量也多\n为什么对：题干预设为选出错误说法。我国自然资源总量丰富，但人口基数大，人均占有量少，多数资源的人均水平低于世界平均水平。说“人均量也多”与基本国情不符，所以这一描述错误。\n干扰项分析：“煤炭、油气、水电等资源的消费主要集中在东南地区”符合我国能源消费集中于东部和东南沿海的实际；“资源分布不均，资源分布与消费市场逆向分布”符合资源富集在西部北部、消费集中在东部南部的格局；“土地资源绝对量大，但人均耕地面积少”符合我国土地资源的基本特点。\n记忆：我国自然资源总量丰富，人均占有量少。\n依据：教材表述","memoryTip":"我国自然资源总量丰富，人均占有量少。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-jud09o7t45","type":"choice","stem":"坚定文化自信，要不断推进马克思主义基本原理( )相结合，推动构建中华民族现代文明。","options":[{"key":"A","text":"同中国具体实际、同时代精神"},{"key":"B","text":"同中国具体实际、同中华优秀传统文化"},{"key":"C","text":"同中国具体实际、同民族精神"},{"key":"D","text":"同新发展阶段、同中国精神"}],"answer":["同中国具体实际、同中华优秀传统文化"],"explanation":"正确答案：同中国具体实际、同中华优秀传统文化\n为什么对：坚定文化自信，要不断推进马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合。“两个结合”揭示了马克思主义在中国生根开花的结果，也指明理论创新和文化建设的路径，在此基础上推动构建中华民族现代文明。\n干扰项分析：“同中国具体实际、同时代精神”把第二个结合错置为时代精神；“同中国具体实际、同民族精神”把中华优秀传统文化替换为民族精神；“同新发展阶段、同中国精神”把两个结合都换成发展方位和精神概念。三组表述都与“两个结合”的固定表述不一致。\n记忆：马克思主义两个结合：具体实际与传统文化。\n依据：党的二十大报告","memoryTip":"马克思主义两个结合：具体实际与传统文化。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-ef4g8eipcjk","type":"choice","stem":"铸就( )新辉煌是国家文化安全新的发展目标，是文化安全的重要导向。","options":[{"key":"A","text":"社会主义道路"},{"key":"B","text":"中华优秀传统文化"},{"key":"C","text":"社会主义文化"},{"key":"D","text":"革命文化"}],"answer":["社会主义文化"],"explanation":"正确答案：社会主义文化\n为什么对：铸就社会主义文化新辉煌是国家文化安全新的发展目标，是文化安全的重要导向。它要求坚持中国特色社会主义文化发展道路，发展面向现代化、面向世界、面向未来的民族的科学的大众的社会主义文化，激发全民族文化创新创造活力。\n干扰项分析：“社会主义道路”是道路层面的概念，不能与“铸就……新辉煌”搭配；“中华优秀传统文化”是文化建设的根基和资源；“革命文化”是文化的重要组成部分。三者都不能构成“铸就……新辉煌”的完整固定表述。\n记忆：文化安全新目标，铸就社会主义文化新辉煌。\n依据：党的二十大报告","memoryTip":"文化安全新目标，铸就社会主义文化新辉煌。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-b6e7bj781mq","type":"choice","stem":"以( )同志为主要代表的中国共产党人，提出\"积极防御\"和\"人民战争\"的战略思想。","options":[{"key":"A","text":"江泽民"},{"key":"B","text":"毛泽东"},{"key":"C","text":"胡锦涛"},{"key":"D","text":"邓小平"}],"answer":["毛泽东"],"explanation":"正确答案：毛泽东\n为什么对：以毛泽东同志为主要代表的中国共产党人在长期革命战争中形成人民战争思想，并把积极防御确立为战略方针，即战略上防御、战役战斗上进攻，依靠动员和武装人民群众夺取胜利。《中华人民共和国国家安全法》第十八条规定的积极防御军事战略，理论源头就在这里。\n干扰项分析：江泽民、胡锦涛、邓小平都不属于这一战略思想的提出者。邓小平时期的军队建设强调服务国家经济建设大局、走精兵之路，江泽民时期推进中国特色军事变革，胡锦涛时期提出新世纪新阶段军队历史使命，与积极防御和人民战争思想的提出归属无关。\n记忆：积极防御加人民战争，源头是毛泽东军事思想。\n依据：《中华人民共和国国家安全法》第十八条；人民战争部分为教材表述。","memoryTip":"积极防御加人民战争，源头是毛泽东军事思想。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-y7ryozaoj9","type":"choice","stem":"在新一轮科技革命和产业变革大势中，必须把( )摆在国家发展全局的突出战略位置，在适应和引领新一轮科技革命中实现产业变革。","options":[{"key":"A","text":"未来产业"},{"key":"B","text":"战略性新兴产业"},{"key":"C","text":"教育"},{"key":"D","text":"抢占全球创新版图优势地位"}],"answer":["抢占全球创新版图优势地位"],"explanation":"正确答案：抢占全球创新版图优势地位\n为什么对：新一轮科技革命和产业变革正在重塑全球创新格局，题干要求把某一事项摆到国家发展全局的突出战略位置，指向的是在全球创新版图中争取先机、赢得主动的战略目标，四个选项中只有这一项表达了在全球竞争中占据优势位置的含义。\n干扰项分析：未来产业、战略性新兴产业是需要培育的具体产业方向，属于执行推进层面；教育是基础性支撑，服务于人才培养。三者都限定在某一领域，无法表达全局性的战略位置。\n记忆：科技变革大势之下，先争全球创新版图站位。\n依据：教材表述。","memoryTip":"科技变革大势之下，先争全球创新版图站位。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-tw04pg1gncb","type":"choice","stem":"切实提升食品药品安全保障水平要坚持产管并重，加快建立健全覆盖生产加工到流通消费的全程监管制度，加快检验检测技术装备和信息化建设，严把从农田到餐桌、从实验室到医院的每一道防线，着力防范( )风险，保障食品药品安全。","options":[{"key":"A","text":"系统性、整体性"},{"key":"B","text":"动态性、整体性"},{"key":"C","text":"系统性、区域性"},{"key":"D","text":"动态性、开放性"}],"answer":["系统性、区域性"],"explanation":"正确答案：系统性、区域性\n为什么对：食品药品安全监管要守住不发生重大事故的底线，把风险控制在局部可控范围，因此着力防范系统性风险和区域性风险。前者指跨环节、跨领域传导扩散的风险，后者指在特定地区集中爆发的风险；产管并重、全程监管、检验检测能力建设都围绕这两类风险展开。\n干扰项分析：系统性、整体性把风险层次说过头，整体性风险通常已包含在系统性风险之内；动态性、整体性和动态性、开放性描述的是风险的变动特征和开放特征，与监管要着力防范的风险类型不符。\n记忆：食药监管防两类：系统性、区域性。\n依据：教材表述。","memoryTip":"食品药品监管防两类风险：系统性、区域性。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-3odoyaiywhp","type":"choice","stem":"构建新发展格局根本支撑是( )。","options":[{"key":"A","text":"科技自立自强"},{"key":"B","text":"高水平的自立自强"},{"key":"C","text":"新质生产力"},{"key":"D","text":"打好关键核心技术攻坚战"}],"answer":["科技自立自强"],"explanation":"正确答案：科技自立自强\n为什么对：构建新发展格局要求畅通国内大循环、塑造参与国际合作和竞争的新优势，根本支撑在科技。只有实现科技自立自强，才能突破关键核心技术受制于人的局面，为产业链供应链自主可控提供支撑，所以它是构建新发展格局的根本支撑。\n干扰项分析：高水平的自立自强对应构建新发展格局最本质的特征，回答的是另一处固定表述；新质生产力是发展成果和着力方向；打好关键核心技术攻坚战是实现科技自立自强的具体任务，三者都不能回答“根本支撑”。\n记忆：格局要畅通，支撑靠科技自立自强。\n依据：教材表述。","memoryTip":"构建新发展格局要畅通，支撑在科技自立自强。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-59jkn8tca4x","type":"choice","stem":"加快推进生态保护修复，要从生态系统整体性岀发，深入实施( )保护和系统治理。","options":[{"key":"A","text":"山水林田湖草沙一体化"},{"key":"B","text":"生态环境"},{"key":"C","text":"生态系统"},{"key":"D","text":"生物多样性"}],"answer":["山水林田湖草沙一体化"],"explanation":"正确答案：山水林田湖草沙一体化\n为什么对：生态系统是相互联系的整体，生态保护修复要从生态系统整体性出发，统筹山上山下、地上地下、陆地海洋各要素，实施山水林田湖草沙一体化保护和系统治理。这一表述是党和国家文件中的固定提法，也是生态保护修复的基本要求。\n干扰项分析：生态环境、生态系统、生物多样性都只是保护和治理的对象或内容，缺少“一体化”所要求的统筹各自然要素的含义，填入后无法与“保护和系统治理”构成完整表述。\n记忆：七字连读：山水林田湖草沙一体化治理。\n依据：教材表述。","memoryTip":"七字连读：山水林田湖草沙一体化治理。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-qhwbn473ivj","type":"choice","stem":"加快推进市域社会治理现代化，强化社会治安整体防控，推进扫黑除恶( )，依法严惩各类违法犯罪活动。","options":[{"key":"A","text":"部门化"},{"key":"B","text":"常态化"},{"key":"C","text":"区域化"},{"key":"D","text":"阶段化"}],"answer":["常态化"],"explanation":"正确答案：常态化\n为什么对：扫黑除恶专项斗争为期三年，结束后工作转入经常性、制度化推进阶段，中央要求推动扫黑除恶常态化，把打击、整治、建设结合起来，持续挤压黑恶势力生存空间，因此这里填常态化。\n干扰项分析：部门化会把打击限定在个别部门，削弱协同配合；区域化把治理局限在特定区域，与市域社会治理整体推进不合；阶段化意味着时紧时松、有始有终，与长期坚持的要求相反。\n记忆：三年专项斗争收官，扫黑除恶转入常态化。\n依据：教材表述。","memoryTip":"三年专项斗争收官，扫黑除恶转入常态化。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-o3dhw2n85xj","type":"choice","stem":"( )是意识形态工作的基本依托。","options":[{"key":"A","text":"信仰"},{"key":"B","text":"秩序"},{"key":"C","text":"阵地"},{"key":"D","text":"理论"}],"answer":["阵地"],"explanation":"正确答案：阵地\n为什么对：意识形态工作要依托具体载体开展，宣传思想文化阵地就是这样的载体。阵地在哪里，声音就在哪里；掌握阵地才能掌握意识形态工作的主动权，因此阵地是意识形态工作的基本依托。\n干扰项分析：信仰是意识形态工作的核心内容，属于要巩固的对象；秩序是工作要达到的状态；理论是工作的内容和武器。三者都不能充当“基本依托”所指的载体角色。\n记忆：意识形态工作有阵地，阵地就是基本依托。\n依据：教材表述。","memoryTip":"意识形态工作有阵地，阵地就是基本依托。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-zrbyj8ldzqk","type":"choice","stem":"( )是社会主义民主政治的本质属性，是最广泛、最真实、最管用的民主。","options":[{"key":"A","text":"全过程人民民主"},{"key":"B","text":"全领域人民民主"},{"key":"C","text":"全流程人民民主"},{"key":"D","text":"全方位人民民主"}],"answer":["全过程人民民主"],"explanation":"正确答案：全过程人民民主\n为什么对：全过程人民民主体现我国社会主义民主政治的本质属性，把选举民主与协商民主、过程民主与成果民主、程序民主与实质民主统一起来，覆盖民主选举、协商、决策、管理、监督各环节，因此是最广泛、最真实、最管用的民主。\n干扰项分析：全领域人民民主、全流程人民民主、全方位人民民主都是把“过程”换成领域、流程、方位后的生造说法，官方固定表述是全过程人民民主，强调民主贯穿全过程各环节。\n记忆：民主贯穿选举到监督，全过程人民民主。\n依据：教材表述。","memoryTip":"民主贯穿选举到监督，全过程人民民主。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-8t1k45idd1f","type":"choice","stem":"新时代维护经济安全，必须深入贯彻( )，聚焦经济建设中心工作和高质量发展首要任务，坚持改革开放的经济发展道路，坚持把保证基本经济制度安全放在首位，维护经济主权安全，巩固经济秩序安全，防范化解重点经济领域安全风险，加快发展新质生产力。","options":[{"key":"A","text":"习近平文化思想"},{"key":"B","text":"习近平法治思想"},{"key":"C","text":"习近平外交思想"},{"key":"D","text":"习近平经济思想"}],"answer":["习近平经济思想"],"explanation":"正确答案：习近平经济思想\n为什么对：题干列举聚焦经济建设中心工作、高质量发展首要任务、基本经济制度安全、经济主权安全、经济秩序安全、发展新质生产力等内容，都属于经济工作的指导理论范畴，新时代维护经济安全贯彻的是习近平经济思想。\n干扰项分析：习近平文化思想指导文化建设与文化安全，习近平法治思想指导全面依法治国，习近平外交思想指导对外工作与国际安全，三者与题干列举的经济领域任务不对应。\n记忆：经济工作怎么走，习近平经济思想指引。\n依据：教材表述。","memoryTip":"经济工作怎么走，习近平经济思想指引。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-7uts7jz1a04","type":"choice","stem":"大学生要加强对( )的学习，相信科学、学习科学、传播科学，树立正确的人生观、价值观。","options":[{"key":"A","text":"马克思主义世界观"},{"key":"B","text":"社会主义核心价值观"},{"key":"C","text":"世界观"},{"key":"D","text":"总体国家安全观"}],"answer":["马克思主义世界观"],"explanation":"正确答案：马克思主义世界观\n为什么对：题干后半句强调相信科学、学习科学、传播科学，针对的是伪科学和邪教蛊惑。马克思主义世界观坚持世界的物质性、坚持无神论，是识别和抵制歪理邪说的思想基础，大学生加强这方面学习，才能树立正确的人生观、价值观。\n干扰项分析：社会主义核心价值观属于价值准则层面的要求；世界观是更宽泛的哲学范畴；总体国家安全观面向国家安全领域。三者与题干针对伪科学、邪教的语境衔接不上。\n记忆：破除迷信靠科学，根子在马克思主义世界观。\n依据：教材表述。","memoryTip":"破除迷信靠科学，根子在马克思主义世界观。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-qxi2w3wfbw","type":"choice","stem":"( )是全面建设社会主义现代化国家的首要任务和本质要求，是新时代的硬道理。","options":[{"key":"A","text":"高水平保护"},{"key":"B","text":"高水平安全"},{"key":"C","text":"可持续发展"},{"key":"D","text":"高质量发展"}],"answer":["高质量发展"],"explanation":"正确答案：高质量发展\n为什么对：党的二十大报告明确高质量发展是全面建设社会主义现代化国家的首要任务；2023年中央经济工作会议进一步提出必须把坚持高质量发展作为新时代的硬道理。题干两个判断与这两处表述对应，因此填高质量发展。\n干扰项分析：高水平保护指向生态环境保护，高水平安全指向国家安全，可持续发展指向资源环境领域的长期性要求。三者都是高质量发展的应有内容或保障条件，不能承担首要任务和新时代硬道理这两个定位。\n记忆：首要任务、新时代硬道理，都指高质量发展。\n依据：教材表述。","memoryTip":"首要任务、新时代硬道理，都指高质量发展。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-9uh8b998e5","type":"choice","stem":"构建新发展格局最本质的特征是实现( )。","options":[{"key":"A","text":"科技自立自强"},{"key":"B","text":"高水平的自立自强"},{"key":"C","text":"生产力蝶变跃升"},{"key":"D","text":"高质量发展"}],"answer":["高水平的自立自强"],"explanation":"正确答案：高水平的自立自强\n为什么对：构建新发展格局，关键在于实现经济循环流转和产业关联畅通，最本质的特征是实现高水平的自立自强：把发展的立足点放在国内，以国内大循环吸引全球资源要素，同时提升自主创新能力，形成参与国际合作和竞争的新优势。\n干扰项分析：科技自立自强是构建新发展格局的根本支撑，对应另一处提问；生产力蝶变跃升描述发展形态的变化；高质量发展是全面建设社会主义现代化国家的首要任务，三者都不能替换“最本质的特征”这一固定表述。\n记忆：新发展格局最本质，高水平自立自强。\n依据：教材表述。","memoryTip":"新发展格局最本质，高水平自立自强。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-lxg0tx97nzg","type":"choice","stem":"要支持和保证人大依法行使( )，更好发挥人大代表作用，使各级人大及其常委会全面担负起宪法法律赋予的各项职责，成为同人民群众保持密切联系的代表机关。","options":[{"key":"A","text":"立法权、监察权、决定权、任免权"},{"key":"B","text":"立法权、监督权、监察权、任免权"},{"key":"C","text":"立法权、监督权、决定权、任免权"},{"key":"D","text":"立法权、监督权、决定权、监察权"}],"answer":["立法权、监督权、决定权、任免权"],"explanation":"正确答案：立法权、监督权、决定权、任免权\n为什么对：人民代表大会是国家权力机关，宪法和法律赋予其立法权、监督权、决定权、任免权四项职权。支持和保证人大依法行使这四项职权，各级人大及其常委会才能全面担负起宪法法律赋予的职责，成为同人民群众保持密切联系的代表机关。\n干扰项分析：立法权、监察权、决定权、任免权，立法权、监督权、监察权、任免权，立法权、监督权、决定权、监察权三个选项都把监察权混入人大职权。监察权由监察委员会依法行使，人大对监察机关行使的是监督权，两种权力不能混同。\n记忆：人大依宪行使四权：立法、监督、决定、任免权。\n依据：《中华人民共和国宪法》；教材表述。","memoryTip":"人大依宪行使四权：立法、监督、决定、任免权。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-5jyma9swpxo","type":"choice","stem":"坚持走中国特色强军之路，要深入贯彻新时代军事战略方针，全面加强练兵备战，如期实现建军一百年奋斗目标，开创国防和军队现代化新局面，到( )基本实现国防和军队现代化，到本世纪中叶把人民军队建设成为世界一流军队。","options":[{"key":"A","text":"2049年"},{"key":"B","text":"2030年"},{"key":"C","text":"2027年"},{"key":"D","text":"2035年"}],"answer":["2035年"],"explanation":"正确答案：2035年\n为什么对：党的二十大报告对国防和军队现代化作出两步安排：到2035年基本实现国防和军队现代化，到本世纪中叶把人民军队建设成为世界一流军队。题干所问的时间节点就是2035年。\n干扰项分析：2049年对应本世纪中叶建成世界一流军队的目标，晚于本题所问；2027年对应实现建军一百年奋斗目标，属于近期目标；2030年没有对应的国防和军队现代化节点。\n记忆：二〇二七建军百年，二〇三五基本实现，世纪中叶世界一流。\n依据：教材表述。","memoryTip":"二〇二七建军百年，二〇三五基本实现，世纪中叶世界一流。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-irq3yzv7qr","type":"choice","stem":"( )是人民生活的安全网和社会运行的稳定器。","options":[{"key":"A","text":"社会保障体系"},{"key":"B","text":"社会服务体系"},{"key":"C","text":"医疗卫生体系"},{"key":"D","text":"就业保障体系"}],"answer":["社会保障体系"],"explanation":"正确答案：社会保障体系\n为什么对：社会保障体系覆盖养老、医疗、失业、工伤、社会救助等方面，为遭遇年老、疾病、失业等风险的居民提供基本生活保障，起到托底作用，因此被称为人民生活的安全网；待遇稳定发放又能调节收入分配、稳定社会预期，因此被称为社会运行的稳定器。\n干扰项分析：社会服务体系主要提供公共服务；医疗卫生体系是社会保障的组成部分之一，覆盖范围有限；就业保障体系同样只是其中一项内容。三者都撑不起社会保障体系的整体功能。\n记忆：安全网加稳定器，说的就是社会保障体系。\n依据：教材表述。","memoryTip":"安全网加稳定器，说的就是社会保障体系。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-ram06ovke7","type":"choice","stem":"新中国成立以来，我国人民的健康水平和身体素质持续提高。2021年，我国人均预期寿命提高到78.2岁;根据《\"健康中国2030\"规划纲要》，到2030年将提高到( )岁。","options":[{"key":"A","text":"79"},{"key":"B","text":"78.5"},{"key":"C","text":"78.8"},{"key":"D","text":"78.6"}],"answer":["79"],"explanation":"正确答案：79\n为什么对：《“健康中国2030”规划纲要》提出，到2030年人均预期寿命达到79岁。题干给出的2021年我国人均预期寿命78.2岁是现实起点，79岁是规划目标值，两者相差不到一岁，符合规划期内稳步提高的安排。\n干扰项分析：78.5、78.6、78.8三个数值都低于规划目标，并且与题干已给出的78.2岁过于接近，属于干扰数值。规划纲要确定的2030年人均预期寿命目标是79岁。\n记忆：健康中国二〇三〇，人均寿命七十九。\n依据：《“健康中国2030”规划纲要》。","memoryTip":"健康中国二〇三〇目标：人均寿命七十九岁。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-a19voo5tpr6","type":"choice","stem":"从我国历代王朝更迭、政权交替中，可以得出一个重要启示:无农不稳，无粮则乱。\"民以食为天\"\"手中有粮、心中不慌\"，这些生动语言深刻反映了( )的极端重要性。","options":[{"key":"A","text":"食品安全"},{"key":"B","text":"农业生产"},{"key":"C","text":"粮食安全"},{"key":"D","text":"农民收入"}],"answer":["粮食安全"],"explanation":"正确答案：粮食安全\n为什么对：题干从历代王朝更迭引出无农不稳、无粮则乱，又引民以食为天、手中有粮心中不慌，指向的都是粮食供给有没有保障。粮食安全是治国理政的头等大事，中国人的饭碗要牢牢端在自己手中，因此这里填粮食安全。\n干扰项分析：食品安全指向食品质量与卫生，与王朝更迭中的粮荒逻辑对不上；农业生产是粮食安全的产业基础，范围小于粮食安全；农民收入是农村工作的目标之一，与题干所引谚语的指向不同。\n记忆：无农不稳、无粮则乱，讲的是粮食安全。\n依据：教材表述。","memoryTip":"无农不稳、无粮则乱，讲的是粮食安全。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-5d2scrc6t86","type":"choice","stem":"坚持按劳分配为主体，多种分配方式并存要完善按( )分配政策制度，探索多种渠道增加中低收入群众要素收入，多渠道增加城乡居民财产性收入。","options":[{"key":"A","text":"市场"},{"key":"B","text":"资源"},{"key":"C","text":"需求"},{"key":"D","text":"要素"}],"answer":["要素"],"explanation":"正确答案：要素\n为什么对：坚持按劳分配为主体、多种分配方式并存，要在坚持按劳分配为主体的同时完善按要素分配政策制度，让劳动、资本、土地、知识、技术、管理、数据等生产要素由市场评价贡献、按贡献决定报酬，探索多种渠道增加中低收入群众要素收入和城乡居民财产性收入。\n干扰项分析：市场、资源、需求都不能与“分配政策制度”构成固定搭配。按市场分配没有对应的政策制度表述，资源、需求属于经济运行范畴，与要素参与分配的指向不符。\n记忆：按劳分配为主体，按要素分配作补充。\n依据：教材表述。","memoryTip":"按劳分配为主体，按要素分配作补充。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-v1ggyu3ggac","type":"choice","stem":"加大环境污染综合治理，要以解决大气、水、土壤污染等突出问题为重点，坚持精准治污、科学治污、( )，持续深入打好蓝天、碧水、净土保卫战。","options":[{"key":"A","text":"依法治污"},{"key":"B","text":"系统治污"},{"key":"C","text":"协同治污"},{"key":"D","text":"协作治污"}],"answer":["依法治污"],"explanation":"正确答案：依法治污\n为什么对：污染防治坚持精准治污、科学治污、依法治污三个要求：精准指问题、时间、区位、对象、措施精准，科学指遵循规律、依靠技术，依法指在法治轨道上推进治理，用法律手段压实责任、惩处违法行为，三者并列构成完整表述。\n干扰项分析：系统治污、协同治污强调治理的统筹性和协作性，协作治污侧重主体之间配合，三个说法都属于工作方法层面，没有进入中国特色治污方略的固定表述，官方连用的是精准、科学、依法。\n记忆：精准科学依法，治污三个要求一起抓。\n依据：教材表述。","memoryTip":"精准科学依法，治污三个要求一起抓。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-ybm9jsrpi1","type":"choice","stem":"新时代新征程上，我国发展所面临的各种风险挑战都要防控，但重点要防控那些可能迟滞或中断中华民族伟大复兴进程的( )风险挑战，这是底线思维的根本含义。","options":[{"key":"A","text":"主导性"},{"key":"B","text":"战略性"},{"key":"C","text":"全局性"},{"key":"D","text":"关键性"}],"answer":["全局性"],"explanation":"正确答案：全局性\n为什么对：底线思维要求把忧患意识转化为科学的方法论，对发展中的风险作预判、防范和化解。各种风险都要防控，重点防控的是可能迟滞甚至中断中华民族伟大复兴进程的全局性风险挑战，因为这类风险一旦发生就动摇战略全局，这正是底线思维的根本含义。\n干扰项分析：主导性、战略性、关键性都只强调重要程度，没有点出这类风险波及全局、动摇战略进程的性质，与“迟滞或中断中华民族伟大复兴进程”的限定对不上。\n记忆：底线思维盯全局，防的是全局性风险。\n依据：教材表述。","memoryTip":"底线思维盯全局，防的是全局性风险。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-j9y031tvnzi","type":"choice","stem":"国家安全能力是国家安全体系表现出来的( )。","options":[{"key":"A","text":"治理方案"},{"key":"B","text":"治理效能"},{"key":"C","text":"治理源头"},{"key":"D","text":"治理条件"}],"answer":["治理效能"],"explanation":"正确答案：治理效能\n为什么对：国家安全体系指制度、体制、机制、法治等构成的整体架构，国家安全能力指这一体系在实际运行中释放出的效果。体系是否健全，最终通过治理效能表现出来，因此国家安全能力是国家安全体系表现出来的治理效能。\n干扰项分析：治理方案是体系设计层面的成果，治理源头指向风险产生的环节，治理条件是开展治理的前提要素。三者都说明不了能力由体系运行产生这一层关系。\n记忆：国家安全体系看架构，国家安全能力看效能。\n依据：教材表述。","memoryTip":"国家安全体系看架构，国家安全能力看效能。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-injn0fu1fn","type":"choice","stem":"在构建地区安全机制上，地区性大国作为主要推动力应发挥积极的带头引领和建设性作用，下列说法错误的是( )。","options":[{"key":"A","text":"要注重发挥地区安全机制与国际安全机制的对接联动作用"},{"key":"B","text":"要维护地区安全稳定，明确国际安全整体走向"},{"key":"C","text":"要注重发挥地区安全机制与国际安全机制的系统联动作用"},{"key":"D","text":"要在国际安全机制的带动下，完善地区安全机制"}],"answer":["要注重发挥地区安全机制与国际安全机制的系统联动作用"],"explanation":"正确答案：要注重发挥地区安全机制与国际安全机制的系统联动作用\n为什么对：本题为否定题。官方表述是地区安全机制与国际安全机制要发挥对接联动作用，强调两类机制在议题、规则、行动上的衔接配合。“系统联动”改动了固定表述中的关键词，成为本题要选出的错误说法。\n干扰项分析：要注重发挥地区安全机制与国际安全机制的对接联动作用符合固定表述；要维护地区安全稳定，明确国际安全整体走向体现地区大国以地区稳定影响国际安全走向的作用；要在国际安全机制的带动下，完善地区安全机制符合地区机制建设的路径。三者都成立。\n记忆：机制讲对接联动，换成系统联动就是错。\n依据：教材表述。","memoryTip":"机制讲对接联动，换成系统联动就是错。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-660u61er7","type":"choice","stem":"关于产业链供应链，以下说法错误的是( )。","options":[{"key":"A","text":"维护产业链供应链稳定安全是构建新发展格局的基础"},{"key":"B","text":"维护产业链供应链稳定安全是推动高质量发展、保障实体经济稳定运行的重要支撑"},{"key":"C","text":"美国是世界上产业门类最齐全、产业体系最完整、全球唯一制造业全产业链国家"},{"key":"D","text":"产业链供应链是现代经济的重要形态，其韧性和安全水平反映一国经济抵抗风险的能力，对现代化经济体系运行具有重要影响"}],"answer":["美国是世界上产业门类最齐全、产业体系最完整、全球唯一制造业全产业链国家"],"explanation":"正确答案：美国是世界上产业门类最齐全、产业体系最完整、全球唯一制造业全产业链国家\n为什么对：本题为否定题。我国是世界上产业门类最齐全、产业体系最完整、拥有联合国产业分类中全部工业门类的国家，把这一判断的主体换成美国，与事实不符，属于本题要选出的错误说法。\n干扰项分析：维护产业链供应链稳定安全是构建新发展格局的基础，说法成立；维护产业链供应链稳定安全是推动高质量发展、保障实体经济稳定运行的重要支撑，说法成立；产业链供应链是现代经济的重要形态，其韧性和安全水平反映一国经济抵抗风险的能力，对现代化经济体系运行具有重要影响，说法也成立。\n记忆：全产业链国家是中国，换成美国即错。\n依据：教材表述。","memoryTip":"全产业链国家是中国，换成美国即错。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-v6ll84aa81c","type":"choice","stem":"( )年，我国设置了国家安全学一级学科，为国家安全教育专门人才培养提供了学科专业平台。","options":[{"key":"A","text":"2020"},{"key":"B","text":"2018"},{"key":"C","text":"2021"},{"key":"D","text":"2019"}],"answer":["2020"],"explanation":"正确答案：2020\n为什么对：2020年12月，我国设置国家安全学一级学科，国家安全学由此获得独立学科地位，为国家安全教育的师资培养和专门人才培养提供了学科专业平台，题干所述设置年份即2020年。\n干扰项分析：2018年、2019年、2021年都不是国家安全学一级学科设置的年份。2021年是《数据安全法》《个人信息保护法》等法律施行的年份，与学科设置无关。\n记忆：国家安全学一级学科，二〇二〇年设置。\n依据：教材表述。","memoryTip":"国家安全学设一级学科，二〇二〇年十二月。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-yuekstlxg8k","type":"choice","stem":"( )提出，发展海洋经济，保护海洋生态环境，加快建设海洋强国。","options":[{"key":"A","text":"党的十八大报告"},{"key":"B","text":"党的二十大报告"},{"key":"C","text":"党的二十届三中全会"},{"key":"D","text":"党的十九大报告"}],"answer":["党的二十大报告"],"explanation":"正确答案：党的二十大报告\n为什么对：党的二十大报告在部署推动绿色发展、促进人与自然和谐共生时提出，发展海洋经济，保护海洋生态环境，加快建设海洋强国。题干三句连用与报告表述一致，因此出处是党的二十大报告。\n干扰项分析：党的十八大报告提出建设海洋强国，还没有发展海洋经济、保护海洋生态环境的完整三句；党的十九大报告提出坚持陆海统筹、加快建设海洋强国；党的二十届三中全会聚焦进一步全面深化改革，与题干引文出处不同。\n记忆：海洋经济加海洋生态，出处是党的二十大报告。\n依据：教材表述。","memoryTip":"海洋经济加海洋生态，出处是党的二十大报告。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-f7mgqddrhs","type":"choice","stem":"只有保证基本经济制度安全，保障分配公平，才能推动( )取得实质性进展。","options":[{"key":"A","text":"科技创新"},{"key":"B","text":"共同富裕"},{"key":"C","text":"法治建设"},{"key":"D","text":"生态环境保护"}],"answer":["共同富裕"],"explanation":"正确答案：共同富裕\n为什么对：基本经济制度决定分配关系的基本格局。只有保证公有制为主体、多种所有制经济共同发展等基本经济制度安全，坚持按劳分配为主体、多种分配方式并存，保障分配公平，才能在做大蛋糕的同时分好蛋糕，推动共同富裕取得实质性进展。\n干扰项分析：科技创新、法治建设、生态环境保护都是需要推进的重要工作，但与基本经济制度安全和分配公平之间缺少直接因果链条，题干强调分配公平，结论只能指向共同富裕。\n记忆：基本制度安全加分配公平，通向共同富裕。\n依据：教材表述。","memoryTip":"基本制度安全加分配公平，通向共同富裕。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-ou7xxw6lg1","type":"choice","stem":"筑牢国家安全人民防线要坚持( )和党的群众路线，注重组织动员社会力量共同参与。","options":[{"key":"A","text":"马克思主义群众观点"},{"key":"B","text":"马克思主义国家安全理论"},{"key":"C","text":"马克思主义实践观"},{"key":"D","text":"马克思主义国家观"}],"answer":["马克思主义群众观点"],"explanation":"正确答案：马克思主义群众观点\n为什么对：国家安全一切为了人民、一切依靠人民。筑牢国家安全人民防线，要把马克思主义群众观点和党的群众路线结合起来，相信群众、依靠群众、发动群众，组织动员社会力量共同参与，形成维护国家安全的合力。\n干扰项分析：马克思主义国家安全理论属于指导思想层面的内容；马克思主义实践观讲认识与实践的关系；马克思主义国家观讲国家的本质与职能。三者都不能与“党的群众路线”直接配对，指向发动群众参与的具体要求。\n记忆：人民防线靠群众，群众观点加群众路线。\n依据：教材表述。","memoryTip":"人民防线靠群众，群众观点加群众路线。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-9po0u6whfef","type":"choice","stem":"上海合作组织于( )年6月15日成立，是第一个由中国参与推动建立并以中国城市命名的区域性合作组织。","options":[{"key":"A","text":"2002"},{"key":"B","text":"2010"},{"key":"C","text":"2005"},{"key":"D","text":"2001"}],"answer":["2001"],"explanation":"正确答案：2001\n为什么对：上海合作组织于2001年6月15日在上海成立，由中国、俄罗斯、哈萨克斯坦、吉尔吉斯斯坦、塔吉克斯坦、乌兹别克斯坦六国共同签署成立宣言，是第一个由中国参与推动建立、以中国城市命名的区域性合作组织。\n干扰项分析：2002年、2005年、2010年都不是上海合作组织成立的年份。2001年6月的上海峰会完成从“上海五国”机制到上海合作组织的转变，成立时间以2001年为准。\n记忆：上合组织，二〇〇一年六月十五日成立于上海。\n依据：教材表述。","memoryTip":"上合组织，二〇〇一年六月十五日成立于上海。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-rdnplw8kyfk","type":"choice","stem":"可再生资源不包括( )。","options":[{"key":"A","text":"土地资源"},{"key":"B","text":"矿产资源"},{"key":"C","text":"水资源"},{"key":"D","text":"生物资源"}],"answer":["矿产资源"],"explanation":"正确答案：矿产资源\n为什么对：可再生资源是在一定时间内能够再生、更新或循环利用的资源，土地资源、水资源、生物资源都能通过自然过程或人工措施恢复更新；矿产资源由地质作用经过漫长年代形成，储量有限，开采后短期内无法再生，属于不可再生资源，因此不包括在可再生资源之内。\n干扰项分析：土地资源可以通过整治恢复肥力，水资源可以通过水循环补给，生物资源可以繁衍更新，三者都属于可再生资源，与题干所问“不包括”相反。\n记忆：矿产挖一点少一点，属于不可再生资源。\n依据：教材表述。","memoryTip":"矿产挖一点少一点，属于不可再生资源。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-hot08dj62yq","type":"choice","stem":"以( )为根本，就是要坚持党的领导和中国特色社会主义制度不动摇，把政权安全、制度安全放在首要位置，为国家安全提供根本政治保证。","options":[{"key":"A","text":"国内安全"},{"key":"B","text":"国际安全"},{"key":"C","text":"经济安全"},{"key":"D","text":"政治安全"}],"answer":["政治安全"],"explanation":"正确答案：政治安全\n为什么对：以政治安全为根本，核心是坚持党的领导和中国特色社会主义制度不动摇，把政权安全、制度安全放在首要位置。政治安全关系国家政权的稳固和制度的存续，为其他领域安全提供根本政治保证，因此这里填政治安全。\n干扰项分析：国内安全是按地域划分的安全范围；国际安全是对外安全环境；经济安全是国家安全的基础。三者在总体国家安全观五大要素中各有定位，都不承担根本地位。\n记忆：政治安全为根本，政权制度放首位。\n依据：《中华人民共和国国家安全法》第三条；教材表述。","memoryTip":"政治安全是根本，政权安全制度安全放首位。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-8m8hkyjlil","type":"choice","stem":"总体国家安全观坚持动态的、发展的、综合的、开放的( )安全理念。","options":[{"key":"A","text":"高质量"},{"key":"B","text":"多层次"},{"key":"C","text":"高水平"},{"key":"D","text":"可持续"}],"answer":["可持续"],"explanation":"正确答案：可持续\n为什么对：总体国家安全观坚持动态的、发展的、综合的、开放的可持续安全理念：动态和发展强调安全形势与安全条件在变化，综合强调各领域安全相互关联，开放强调内外安全相互影响，可持续强调安全的持久性和共同性，四层含义统一于可持续安全。\n干扰项分析：高质量、高水平是对发展水平或安全水平的评价用语，多层次描述安全领域的层次结构。三者都不能与动态、发展、综合、开放并列修饰安全理念。\n记忆：动态发展综合开放，最终指向可持续安全。\n依据：教材表述。","memoryTip":"动态发展综合开放，最终指向可持续安全。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-nws5m2aofi9","type":"choice","stem":"以( )同志为主要代表的中国共产党人，在对外关系中，创造性提出了\"互相尊重主权和领土完整、互不侵犯、互不干涉内政、平等互利、和平共处\"的和平共处五项原则。","options":[{"key":"A","text":"胡锦涛"},{"key":"B","text":"毛泽东"},{"key":"C","text":"江泽民"},{"key":"D","text":"邓小平"}],"answer":["毛泽东"],"explanation":"正确答案：毛泽东\n为什么对：以毛泽东同志为主要代表的中国共产党人在新中国外交实践中创造性提出和平共处五项原则，即互相尊重主权和领土完整、互不侵犯、互不干涉内政、平等互利、和平共处。五项原则后来成为国际关系基本准则，是我国对国际社会的重大贡献。\n干扰项分析：邓小平、江泽民、胡锦涛都不属于提出和平共处五项原则的那一代中国共产党人。邓小平时期外交强调不结盟、不对抗、不针对第三方，江泽民时期提出互信、互利、平等、协作的新安全观，胡锦涛时期倡导建设和谐世界，内容与时间都不对应。\n记忆：和平共处五项原则，出自毛泽东时代。\n依据：教材表述。","memoryTip":"和平共处五项原则，出自毛泽东时代。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-gndtifzn4gh","type":"choice","stem":"( )是科技创新的总源头和所有技术问题的总机关。","options":[{"key":"A","text":"基础研究"},{"key":"B","text":"人才培养"},{"key":"C","text":"科研机构"},{"key":"D","text":"高精尖科技"}],"answer":["基础研究"],"explanation":"正确答案：基础研究\n为什么对：基础研究探索自然规律、揭示基本原理，为技术进步提供源头知识，其他技术突破都要以基础研究的积累为前提。基础研究是整个科学体系的源头，是所有技术问题的总机关，所以这里填基础研究。\n干扰项分析：人才培养提供智力支持，科研机构是组织载体，高精尖科技是研究产出的成果形态。三者都处在基础研究之后或之外，不能称为科技创新的总源头。\n记忆：基础研究是总源头，也是技术总机关。\n依据：教材表述。","memoryTip":"基础研究是总源头，也是技术总机关。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-4dd5s0ugquo","type":"choice","stem":"任何可靠的安全都是建立在坚实的( )基础之上的。","options":[{"key":"A","text":"财富"},{"key":"B","text":"发展"},{"key":"C","text":"改革"},{"key":"D","text":"创造"}],"answer":["发展"],"explanation":"正确答案：发展\n为什么对：发展和安全相辅相成，发展是安全的基础，安全是发展的条件。国家实力、技术能力、制度保障都要靠发展来积累，任何可靠的安全都建立在坚实的发展基础之上，脱离发展谈安全无法持久。\n干扰项分析：财富是发展的结果和表现之一，范围有限；改革是发展的动力；创造是发展的方式。三者都不能替代发展作为安全基础的总体地位。\n记忆：发展是安全的基础，安全是发展的条件。\n依据：教材表述。","memoryTip":"发展是安全的基础，安全是发展的条件。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-p3senz68gg","type":"choice","stem":"我国对\"三股势力\"的遏制和打击取得了重大成效。但是，\"三股势力\"的威胁依然存在，并呈现出更加( )的特点。","options":[{"key":"A","text":"融合、集中"},{"key":"B","text":"隐蔽、集中"},{"key":"C","text":"公开、复杂"},{"key":"D","text":"隐蔽、分散"}],"answer":["隐蔽、分散"],"explanation":"正确答案：隐蔽、分散\n为什么对：我国对暴力恐怖势力、民族分裂势力、宗教极端势力的打击取得重大成效，其公开活动空间被压缩，威胁转向隐蔽渗透，活动呈现分散化、网络化特点，防范难度上升，因此特点是隐蔽、分散。\n干扰项分析：融合、集中和隐蔽、集中都强调集中，与三股势力由公开转向分散的实际不符；公开、复杂把其活动状态说成公开，与打击成效相矛盾。\n记忆：三股势力由明转暗，走向隐蔽、分散。\n依据：教材表述。","memoryTip":"三股势力由明转暗，呈现隐蔽、分散特点。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-9k9ce9tcer","type":"choice","stem":"( )是国家和民族赓续绵延的压舱石。","options":[{"key":"A","text":"改革"},{"key":"B","text":"经济"},{"key":"C","text":"安全"},{"key":"D","text":"发展"}],"answer":["发展"],"explanation":"正确答案：发展\n为什么对：发展是党执政兴国的第一要务，也是国家和民族赓续绵延的压舱石。国家实力增强、民生改善、制度巩固都要靠持续发展来支撑，发展稳得住，全局才稳得住，因此这里填发展。\n干扰项分析：改革是发展的动力，安全是发展的条件，经济是发展的主要内容。三者都通过发展发挥作用，不能直接充当国家和民族赓续绵延的压舱石。\n记忆：压舱石是发展，动力在改革，条件在安全。\n依据：教材表述。","memoryTip":"压舱石是发展，动力在改革，条件在安全。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-5im9oum3che","type":"choice","stem":"以( )同志为主要代表的中国共产党人，提出为维护人类和平和捍卫国家安全积极发展、和平利用核技术的战略思想。","options":[{"key":"A","text":"胡锦涛"},{"key":"B","text":"邓小平"},{"key":"C","text":"毛泽东"},{"key":"D","text":"江泽民"}],"answer":["毛泽东"],"explanation":"正确答案：毛泽东\n为什么对：以毛泽东同志为主要代表的中国共产党人在新中国成立初期作出发展原子弹、导弹等国防尖端技术的战略决策，主张为维护人类和平和捍卫国家安全积极发展、和平利用核技术，打破了核垄断和核讹诈，为国家争取到长期和平环境。\n干扰项分析：邓小平时期核工业转向军民结合、和平利用，江泽民、胡锦涛时期的核能与核安全政策继续推进，但“积极发展、和平利用核技术”的战略思想形成于毛泽东时期，三者的时间与内容都不对应。\n记忆：两弹一星战略决策，定在毛泽东时代。\n依据：教材表述。","memoryTip":"两弹一星战略决策，定在毛泽东时代。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-b4wb8k4sjqf","type":"choice","stem":"( )是一体之两翼、驱动之双轮。","options":[{"key":"A","text":"改革和创新"},{"key":"B","text":"发展和安全"},{"key":"C","text":"改革和发展"},{"key":"D","text":"发展和稳定"}],"answer":["发展和安全"],"explanation":"正确答案：发展和安全\n为什么对：习近平总书记用一体之两翼、驱动之双轮比喻发展与安全的统一关系，指出安全是发展的前提，发展是安全的保障，两者需要同步推进、相互支撑。总体国家安全观统筹发展和安全，正是这一关系的集中体现。\n干扰项分析：“改革和创新”常被并称，与两翼双轮的固定比喻无关；“改革和发展”属于改革发展稳定关系中的表述，没有被这样比喻；“发展和稳定”强调稳定是改革发展的前提，也不是题干所指的固定搭配。\n记忆：发展和安全，一体之两翼、驱动之双轮。\n依据：教材表述；《总体国家安全观学习纲要》。","memoryTip":"发展和安全是一体之两翼、驱动之双轮","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-f5xvtjr65ft","type":"choice","stem":"个别西方国家策划\"颜色革命\"，往往从所针对的国家的( )开始发难，大造舆论，大肆渲染，煽动民众搞街头政治。","options":[{"key":"A","text":"人权保障制度"},{"key":"B","text":"指导思想"},{"key":"C","text":"政治制度特别是政党制度"},{"key":"D","text":"经济制度"}],"answer":["政治制度特别是政党制度"],"explanation":"正确答案：政治制度特别是政党制度\n为什么对：个别西方国家策动颜色革命时，先否定目标国的政治制度和政党制度，借助舆论炒作和街头政治推动政权更迭，改变该国政治走向。教材据此把发难的起点定在政治制度特别是政党制度上。\n干扰项分析：“人权保障制度”常被当作攻击借口，属于舆论议题，不是策动街头政治的切入口；“指导思想”是意识形态渗透的领域，起作用的方式是长期影响；“经济制度”是施压领域，与政权更迭的直接目标不一致。\n记忆：颜色革命先从政治制度和政党制度下手。\n依据：教材表述。","memoryTip":"颜色革命先从政治制度和政党制度下手","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-ejzg6c2h0x","type":"choice","stem":"中国支持其他发展中国家广泛平等参与全球安全治理，反对霸权主义、强权政治，创造持久的安全稳定环境，共同推动构建( )。","options":[{"key":"A","text":"新秩序"},{"key":"B","text":"绿色发展联盟"},{"key":"C","text":"人类安全共同体"},{"key":"D","text":"全天候战略合作伙伴关系"}],"answer":["人类安全共同体"],"explanation":"正确答案：人类安全共同体\n为什么对：中国主张各国广泛平等参与全球安全治理，反对霸权主义和强权政治，通过合作创造持久的安全稳定环境，推动构建人类安全共同体，使安全成果为各国共享。这对应全球安全治理的多边方向。\n干扰项分析：“新秩序”指国际政治经济新秩序，表述不完整，与安全治理的目标不对应；“绿色发展联盟”属于生态环境合作机制，不涉及安全治理；“全天候战略合作伙伴关系”是双边关系定位，无法概括多边安全治理的目标。\n记忆：全球安全治理指向人类安全共同体。\n依据：教材表述。","memoryTip":"全球安全治理指向人类安全共同体","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-hvgeuisyt7","type":"choice","stem":"要进一步加强依法治网，推进网络空间法治化，推动互联网持续健康发展，维护人民群众的( )安全。","options":[{"key":"A","text":"健康"},{"key":"B","text":"信息"},{"key":"C","text":"生存"},{"key":"D","text":"财产"}],"answer":["信息"],"explanation":"正确答案：信息\n为什么对：依法治网的目标是推进网络空间法治化，保障网络运行安全和网络信息安全，落脚点是维护人民群众的信息安全，也就是让个人信息和重要数据不受侵害，权益得到保护。\n干扰项分析：“健康”涉及网络内容对身心健康的影响，属于网络生态治理的附带效果；“生存”范围过宽，不是依法治网直接保护的对象；“财产”是网络安全保障的间接结果，题干指向的是信息权益。\n记忆：依法治网的落脚点是人民群众信息安全。\n依据：《中华人民共和国网络安全法》；教材表述。","memoryTip":"依法治网的落脚点是人民群众信息安全","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-921jutckvtm","type":"choice","stem":"党的十九大报告把( )与精准脱贫、污染防治一起作为\"两个一百年\"奋斗目标的历史交汇期必须打好的三大攻坚战提了出来。","options":[{"key":"A","text":"防范化解重大风险"},{"key":"B","text":"净土保卫战"},{"key":"C","text":"蓝天保卫战"},{"key":"D","text":"碧水保卫战"}],"answer":["防范化解重大风险"],"explanation":"正确答案：防范化解重大风险\n为什么对：党的十九大报告提出坚决打好防范化解重大风险、精准脱贫、污染防治的攻坚战，三者对应两个一百年奋斗目标历史交汇期的重点任务。防范化解重大风险居于首位，关系经济社会全局稳定，是三大攻坚战之一。\n干扰项分析：“净土保卫战”是污染防治攻坚战的组成部分，范围小于三大攻坚战之一；“蓝天保卫战”同样属于污染防治领域的具体战役；“碧水保卫战”也是污染防治的具体行动，都被污染防治所涵盖。\n记忆：三大攻坚战是防风险、精准脱贫、污染防治。\n依据：党的十九大报告。","memoryTip":"三大攻坚战是防风险、精准脱贫、污染防治","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-lu8kztx3c9o","type":"choice","stem":"主张\"亲仁善邻，国之宝也\"，体现了中华优秀传统战略文化( )。","options":[{"key":"A","text":"看重内省慎独"},{"key":"B","text":"力求内外兼顾"},{"key":"C","text":"重视群策群力"},{"key":"D","text":"强调讲信修睦"}],"answer":["强调讲信修睦"],"explanation":"正确答案：强调讲信修睦\n为什么对：亲仁善邻，国之宝也出自《左传》，意思是亲近仁德、与邻国友好相处是国家之宝。这句话讲处理国家间关系的准则，体现中华优秀传统战略文化重视讲信修睦、以和睦邻邦。\n干扰项分析：“看重内省慎独”讲个人修养，不涉及国家间关系；“力求内外兼顾”讲统筹内外两个大局，不是这句话的含义；“重视群策群力”讲依靠众人智慧，与睦邻友好无关。\n记忆：亲仁善邻，国之宝也，讲的是讲信修睦。\n依据：《左传》；教材表述。","memoryTip":"亲仁善邻，国之宝也，讲的是讲信修睦","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-b8coki7e87j","type":"choice","stem":"必须坚持不懈深入学习贯彻( )，树立对中国特色国家安全道路的坚定信念，自觉做总体国家安全观的坚定践行者。","options":[{"key":"A","text":"科学发展观"},{"key":"B","text":"习近平新时代中国特色社会主义思想"},{"key":"C","text":"总体国家安全观"},{"key":"D","text":"社会主义核心价值观"}],"answer":["总体国家安全观"],"explanation":"正确答案：总体国家安全观\n为什么对：总体国家安全观是新时代国家安全工作的根本遵循，坚持不懈深入学习贯彻它，才能树立对中国特色国家安全道路的坚定信念，成为总体国家安全观的自觉践行者，题干前后两处指向同一对象。\n干扰项分析：“科学发展观”是此前的指导思想，没有专门回答国家安全道路问题；“习近平新时代中国特色社会主义思想”是更上位的理论体系，题干问的是国家安全领域的直接内容；“社会主义核心价值观”属于价值层面的要求，不构成国家安全工作的指导思想。\n记忆：国安工作的根本遵循是总体国家安全观。\n依据：教材表述。","memoryTip":"国安工作的根本遵循是总体国家安全观","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.949Z"},{"id":"question-1794391527949-k1pf7impc","type":"choice","stem":"对我国来说，( )这个首要任务就是最大的安全，如果出现发展停滞或不发展则是最大的不安全。","options":[{"key":"A","text":"发展新质生产力"},{"key":"B","text":"实现高质量发展"},{"key":"C","text":"构建新发展格局"},{"key":"D","text":"全面深化改革"}],"answer":["实现高质量发展"],"explanation":"正确答案：实现高质量发展\n为什么对：党的二十大明确高质量发展是全面建设社会主义现代化国家的首要任务。对我国来说，把这个首要任务完成好就是最大的安全；发展停滞或者不发展，则是最大的不安全，说明发展是安全的基础。\n干扰项分析：“发展新质生产力”是推动高质量发展的着力点，层次低于首要任务；“构建新发展格局”是路径选择，服务于高质量发展；“全面深化改革”是发展的动力来源，同样不是题干所说的首要任务。\n记忆：高质量发展是首要任务，也是最大的安全。\n依据：党的二十大报告。","memoryTip":"高质量发展是首要任务，也是最大的安全","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.950Z"},{"id":"question-1794391527950-va054wqczf","type":"choice","stem":"国土安全包含( )。","options":[{"key":"A","text":"领水安全"},{"key":"B","text":"领陆安全"},{"key":"C","text":"领空安全"},{"key":"D","text":"航天安全"}],"answer":["领水安全","领陆安全","领空安全"],"explanation":"正确答案：领水安全、领陆安全、领空安全\n为什么对：国土安全指国家主权管辖下的领陆、领水、领空的安全，三部分共同构成领土主权范围，分别对应陆地边界、内水与领海、领空的管理。这与《国家安全法》保卫领陆、内水、领海、领空安全的规定一致。\n干扰项分析：“航天安全”属于太空等新型领域安全，超出领土主权的范围，不属于国土安全的组成部分。\n记忆：国土安全就是领陆、领水、领空安全。\n依据：《中华人民共和国国家安全法》第十七条。","memoryTip":"国土安全包括领陆、领水、领空三个部分","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.950Z"},{"id":"question-1794391527950-l9fg072c6xa","type":"choice","stem":"总体国家安全观深刻反映了时代变革和发展对国家安全工作的规律性新要求，为增强做好新时代国家安全工作的( )提供了指导。","options":[{"key":"A","text":"政治判断力"},{"key":"B","text":"政治领悟力"},{"key":"C","text":"政治执行力"},{"key":"D","text":"政治洞察力"}],"answer":["政治判断力","政治领悟力","政治执行力"],"explanation":"正确答案：政治判断力、政治领悟力、政治执行力\n为什么对：总体国家安全观揭示新时代国家安全工作的规律，帮助党员干部从政治上观察形势、领会中央精神、落实决策部署，也就是提高政治判断力、政治领悟力、政治执行力。\n干扰项分析：“政治洞察力”是日常用语，没有进入关于干部政治能力的规范提法，与题干所指的三种能力不对应。\n记忆：三种政治能力是判断力、领悟力、执行力。\n依据：教材表述。","memoryTip":"三种政治能力是判断力、领悟力、执行力","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.950Z"},{"id":"question-1794391527950-ra4a3it0u8","type":"choice","stem":"当前，世界之变、时代之变、历史之变正以前所未有的方式展开。( )加重，人类社会面临前所未有的挑战。","options":[{"key":"A","text":"和平赤字"},{"key":"B","text":"发展赤字"},{"key":"C","text":"安全赤字"},{"key":"D","text":"治理赤字"}],"answer":["和平赤字","发展赤字","安全赤字","治理赤字"],"explanation":"正确答案：和平赤字、发展赤字、安全赤字、治理赤字\n为什么对：党的二十大报告指出，世界之变、时代之变、历史之变正以前所未有的方式展开，和平赤字、发展赤字、安全赤字、治理赤字加重，人类社会面临前所未有的挑战。四项并列，构成完整判断。\n干扰项分析：四个选项都是报告原文列举的赤字，本题没有错误项，漏选任何一项都会使表述不完整。\n记忆：四大赤字是和平、发展、安全、治理。\n依据：党的二十大报告。","memoryTip":"四大赤字是和平赤字、发展赤字、安全赤字、治理赤字","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.950Z"},{"id":"question-1794391527950-4f4pnw5saj","type":"choice","stem":"国际社会的共同安全，是指所有国家都平等地共同享有安全权益而不受他国的侵害，即无论国家大小、强弱、贫富，均一律平等地享有其各自的安全利益，以及( )的权利、手段和力量。","options":[{"key":"A","text":"营造国际安全环境"},{"key":"B","text":"推进安全战略"},{"key":"C","text":"维护国家自身安全"},{"key":"D","text":"提出安全诉求"}],"answer":["推进安全战略","维护国家自身安全","提出安全诉求"],"explanation":"正确答案：推进安全战略、维护国家自身安全、提出安全诉求\n为什么对：共同安全强调国家不论大小、强弱、贫富，都平等享有安全利益，并平等拥有推进安全战略、维护国家自身安全、提出安全诉求的权利、手段和力量，安全不可分割。\n干扰项分析：“营造国际安全环境”是各国合作形成的集体结果，属于共同目标，不是每个国家单独享有的权利和手段，与题干所说的各自安全利益不对应。\n记忆：共同安全的三项权利是战略、自保、诉求。\n依据：教材表述。","memoryTip":"共同安全的三项权利是战略、自保、诉求","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.950Z"},{"id":"question-1794391527950-05xzv3hs8opd","type":"choice","stem":"改革开放以来，我国深入推动经济体制改革，不断完善社会主义市场经济体制，极大促进了生产力发展，创造了世所罕见的经济快速发展奇迹。要保证基本经济制度安全，须在( )上推进经济体制改革，构建高水平社会主义市场经济体制。","options":[{"key":"A","text":"更高层次"},{"key":"B","text":"更高效率"},{"key":"C","text":"更高起点"},{"key":"D","text":"更高目标"}],"answer":["更高层次","更高起点","更高目标"],"explanation":"正确答案：更高层次、更高起点、更高目标\n为什么对：《关于新时代加快完善社会主义市场经济体制的意见》提出在更高起点、更高层次、更高目标上推进经济体制改革，构建高水平社会主义市场经济体制，以此保障基本经济制度安全。\n干扰项分析：“更高效率”描述体制运行的效果，属于改革取得的成果，不是文件对改革推进层次的定位，与三个更高的表述不对应。\n记忆：三个更高是起点、层次、目标。\n依据：《关于新时代加快完善社会主义市场经济体制的意见》。","memoryTip":"三个更高是更高起点、更高层次、更高目标","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.950Z"},{"id":"question-1794391527950-va3ae193zge","type":"choice","stem":"新时代大学生要在坚持和发展新时代中国特色社会主义中找准自己的人生定位，实现( )的有机结合，不断为更有时代意义的人生价值努力学习，增长才干，服务祖国。","options":[{"key":"A","text":"国家\"大我\""},{"key":"B","text":"个人\"小我\""},{"key":"C","text":"个人群体"},{"key":"D","text":"国家主体"}],"answer":["国家\"大我\"","个人\"小我\""],"explanation":"正确答案：国家“大我”、个人“小我”\n为什么对：新时代大学生要在坚持和发展中国特色社会主义中找准人生定位，把国家大我与个人小我结合起来，在服务祖国中实现人生价值，让个人发展融入国家发展。\n干扰项分析：“个人群体”不是人生定位的规范表述，无法与国家大我构成对应关系；“国家主体”指国家在法律关系和经济社会活动中的地位，与个人价值追求无关。\n记忆：人生定位要把国家大我和个人小我结合。\n依据：教材表述。","memoryTip":"人生定位要把国家大我和个人小我结合","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.950Z"},{"id":"question-1794391527950-l0c1tavi82c","type":"choice","stem":"关于铸牢中华民族共同体意识，以下说法正确的是( )。","options":[{"key":"A","text":"是维护各民族根本利益的必然要求"},{"key":"B","text":"是严密防范和严厉打击\"三股势力\"的着力点"},{"key":"C","text":"是巩固和发展平等团结互助和谐社会主义民族关系的必然要求"},{"key":"D","text":"是实现中华民族伟大复兴的必然要求"}],"answer":["是维护各民族根本利益的必然要求","是巩固和发展平等团结互助和谐社会主义民族关系的必然要求","是实现中华民族伟大复兴的必然要求"],"explanation":"正确答案：是维护各民族根本利益的必然要求；是巩固和发展平等团结互助和谐社会主义民族关系的必然要求；是实现中华民族伟大复兴的必然要求\n为什么对：铸牢中华民族共同体意识关系各民族根本利益，关系平等团结互助和谐的社会主义民族关系，也关系中华民族伟大复兴。教材用三个必然要求概括它的意义，分别对应利益、关系和复兴。\n干扰项分析：“是严密防范和严厉打击‘三股势力’的着力点”把具体的反分裂反恐怖工作当成铸牢中华民族共同体意识的意义定位，对象和层次都不对应。\n记忆：三个必然要求是民族利益、民族关系、民族复兴。\n依据：教材表述。","memoryTip":"三个必然要求是民族利益、民族关系、民族复兴","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.950Z"},{"id":"question-1794391527950-6lrru4n9bzg","type":"choice","stem":"新时代大学生要厚植爱国主义情怀，用习近平新时代中国特色社会主义思想武装头脑，夯实( )的思想基础。" stion-1794391527950-0cqa75sp9c6q","type":"choice","stem":"2014年5月，习近平提出( )的亚洲安全观，明确了亚洲地区安全的主体、范畴、实现方式和作用效果。","options":[{"key":"A","text":"可持续"},{"key":"B","text":"综合"},{"key":"C","text":"共同"},{"key":"D","text":"合作"}],"answer":["可持续","综合","共同","合作"],"explanation":"正确答案：可持续、综合、共同、合作\n为什么对：2014年5月，习近平在亚洲相互协作与信任措施会议峰会上提出共同、综合、合作、可持续的亚洲安全观。共同指安全主体，综合指安全范畴，合作指实现方式，可持续指作用效果，四个词分别回答了谁来维护安全、维护哪些安全、怎样维护安全、安全能否长久的问题。\n干扰项分析：四个选项都是亚洲安全观的组成要素，本题没有错误项，需要全部选入。\n记忆：亚洲安全观是共同、综合、合作、可持续。\n依据：教材表述。","memoryTip":"亚洲安全观是共同、综合、合作、可持续","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.950Z"},{"id":"question-1794391527950-kjbj9pelnds","type":"choice","stem":"发展壮大群防群治力量，营造见义勇为社会氛围，建设( )的社会治理共同体。","options":[{"key":"A","text":"人人有责"},{"key":"B","text":"人人参与"},{"key":"C","text":"人人享有"},{"key":"D","text":"人人尽责"}],"answer":["人人有责","人人享有","人人尽责"],"explanation":"正确答案：人人有责、人人享有、人人尽责\n为什么对：党的二十大报告提出建设人人有责、人人尽责、人人享有的社会治理共同体，三者分别对应责任分担、行动参与和成果共享。发展壮大群防群治力量正需要这样的格局。\n干扰项分析：“人人参与”表达参与意愿，报告的固定表述是人人有责、人人尽责、人人享有，参与的含义已经包含在尽责之中。\n记忆：治理共同体是人人有责、人人尽责、人人享有。\n依据：党的二十大报告。","memoryTip":"治理共同体是人人有责、人人尽责、人人享有","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.950Z"},{"id":"question-1794391527950-oijp7y8192k","type":"choice","stem":"坚持稳中求进，\"进\"的重点要放在( )上，确保转变经济发展方式和创新驱动发展取得新成效，加快发展新质生产力。","options":[{"key":"A","text":"调整生产关系"},{"key":"B","text":"深化改革开放"},{"key":"C","text":"协调机制构建"},{"key":"D","text":"调整经济结构"}],"answer":["深化改革开放","调整经济结构"],"explanation":"正确答案：深化改革开放、调整经济结构\n为什么对：坚持稳中求进，进的重点要放在调整经济结构和深化改革开放上，通过结构优化和体制突破，确保转变经济发展方式和创新驱动发展取得新成效，加快发展新质生产力。\n干扰项分析：“调整生产关系”是改革的理论内容，不是进的重点的规范表述；“协调机制构建”属于具体工作环节，层次不足以概括进的重点。\n记忆：稳中求进的进，重点是调结构、深改革。\n依据：教材表述。","memoryTip":"稳中求进的进，重点是调结构、深改革","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.950Z"},{"id":"question-1794391527950-o623i6d99n","type":"choice","stem":"关于社会主义市场经济体制，以下说法正确的是( )。","options":[{"key":"A","text":"是中国特色社会主义的重大理论和实践创新"},{"key":"B","text":"是在社会主义公有制基础上，在国家宏观调控下，推动有效市场和有为政府更好结合的一种经济体制"},{"key":"C","text":"社会经济资源主要是由政府配置"},{"key":"D","text":"是对马克思主义政治经济学的原创性贡献"}],"answer":["是中国特色社会主义的重大理论和实践创新","是在社会主义公有制基础上，在国家宏观调控下，推动有效市场和有为政府更好结合的一种经济体制","是对马克思主义政治经济学的原创性贡献"],"explanation":"正确答案：是中国特色社会主义的重大理论和实践创新；是在社会主义公有制基础上，在国家宏观调控下，推动有效市场和有为政府更好结合的一种经济体制；是对马克思主义政治经济学的原创性贡献\n为什么对：社会主义市场经济体制把社会主义制度与市场经济结合起来，是中国特色社会主义的重大理论和实践创新，也是对马克思主义政治经济学的原创性贡献。它在公有制基础上运行，依靠国家宏观调控推动有效市场和有为政府更好结合。\n干扰项分析：“社会经济资源主要是由政府配置”与市场在资源配置中起决定性作用、更好发挥政府作用的定位相违背，资源配置主要由市场决定。\n记忆：社会主义市场经济体制是重大理论和实践创新。\n依据：教材表述。","memoryTip":"社会主义市场经济体制是重大理论和实践创新","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.950Z"},{"id":"question-1794391527950-0tp1lv1d4ex","type":"choice","stem":"生态安全主要包括( )。","options":[{"key":"A","text":"生态空间安全"},{"key":"B","text":"人居环境安全"},{"key":"C","text":"全球生态环境挑战应对安全"},{"key":"D","text":"生态系统安全"}],"answer":["生态空间安全","人居环境安全","全球生态环境挑战应对安全","生态系统安全"],"explanation":"正确答案：生态空间安全、人居环境安全、全球生态环境挑战应对安全、生态系统安全\n为什么对：生态安全包括生态空间格局稳定、生态系统结构与功能完好、人居环境适宜，以及有效应对全球生态环境挑战。四个层面分别从空间、系统、人居和全球维度构成完整内涵。\n干扰项分析：四个选项都属于生态安全内涵，本题没有错误项，需要全部选入。\n记忆：生态安全四层是空间、系统、人居、全球。\n依据：教材表述。","memoryTip":"生态安全四层是空间、系统、人居、全球","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.950Z"},{"id":"question-1794391527950-2whmhblxsq6","type":"choice","stem":"2022年4月，习近平提出全球安全倡议，该倡议以\"六个坚持\"为核心要义，下列属于\"六个坚持\"的是( )。","options":[{"key":"A","text":"坚持共同、综合、合作、可持续的安全观，共同维护世界和平和安全"},{"key":"B","text":"坚持尊重各国主权、领土完整，不干涉别国内政，尊重各国人民自主选择的发展道路和社会制度"},{"key":"C","text":"坚持普惠包容。关注发展中国家特殊需求，通过缓债、发展援助等方式支持发展中国家尤其是困难特别大的脆弱国家，着力解决国家间和各国内部发展不平衡、不充分问题"},{"key":"D","text":"坚持遵守联合国宪章宗旨和原则，摒弃冷战思维，反对单边主义，不搞集团政治和阵营对抗"}],"answer":["坚持共同、综合、合作、可持续的安全观，共同维护世界和平和安全","坚持尊重各国主权、领土完整，不干涉别国内政，尊重各国人民自主选择的发展道路和社会制度","坚持遵守联合国宪章宗旨和原则，摒弃冷战思维，反对单边主义，不搞集团政治和阵营对抗"],"explanation":"正确答案：坚持共同、综合、合作、可持续的安全观，共同维护世界和平和安全；坚持尊重各国主权、领土完整，不干涉别国内政，尊重各国人民自主选择的发展道路和社会制度；坚持遵守联合国宪章宗旨和原则，摒弃冷战思维，反对单边主义，不搞集团政治和阵营对抗。\n为什么对：全球安全倡议以六个坚持为核心要义。上述三项分别对应安全观、主权与不干涉内政、联合国宪章宗旨和反对冷战思维，均为倡议原文内容，落在安全治理的框架之内。\n干扰项分析：“坚持普惠包容。关注发展中国家特殊需求，通过缓债、发展援助等方式支持发展中国家尤其是困难特别大的脆弱国家，着力解决国家间和各国内部发展不平衡、不充分问题”属于全球发展倡议，讲发展合作与债务处理，不在全球安全倡议的六个坚持之内。\n记忆：安全倡议讲安全观、主权、宪章，普惠包容属于发展倡议。\n依据：《全球安全倡议概念文件》。","memoryTip":"安全倡议讲安全观、主权、宪章，普惠包容属于发展倡议。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.950Z"},{"id":"question-1794391527950-p1tl59k6wzh","type":"choice","stem":"以下说法正确的是( )。","options":[{"key":"A","text":"非传统安全中的问题往往与传统安全威胁有着千丝万缕的联系"},{"key":"B","text":"总体国家安全观科学建构了集多种传统安全和非传统安全要素于一体的新型国家安全理论形态"},{"key":"C","text":"总体国家安全观超越了传统安全和非传统安全\"非此即彼\"的思维模式"},{"key":"D","text":"总体国家安全观鲜明体现了对国家安全传统领域和非传统领域进行综合治理的系统思维"}],"answer":["非传统安全中的问题往往与传统安全威胁有着千丝万缕的联系","总体国家安全观科学建构了集多种传统安全和非传统安全要素于一体的新型国家安全理论形态","总体国家安全观超越了传统安全和非传统安全\"非此即彼\"的思维模式","总体国家安全观鲜明体现了对国家安全传统领域和非传统领域进行综合治理的系统思维"],"explanation":"正确答案：非传统安全中的问题往往与传统安全威胁有着千丝万缕的联系；总体国家安全观科学建构了集多种传统安全和非传统安全要素于一体的新型国家安全理论形态；总体国家安全观超越了传统安全和非传统安全\"非此即彼\"的思维模式；总体国家安全观鲜明体现了对国家安全传统领域和非传统领域进行综合治理的系统思维。\n为什么对：总体国家安全观把国家安全视为整体，传统安全与非传统安全相互关联、彼此转化，理论上实现要素整合，实践上要求综合治理，四句话分别对应联系性、理论建构、思维方式和治理要求。\n干扰项分析：四个表述都成立，没有需要排除的内容，四条从不同层次说明同一件事。\n记忆：传统与非传统安全相互关联，理论上整合，实践上综合治理。\n依据：教材表述；《总体国家安全观学习纲要》。","memoryTip":"传统与非传统安全相互关联，理论整合加综合治理。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.950Z"},{"id":"question-1794391527950-tkpqtd1165","type":"choice","stem":"习近平指出，\"人民至上是作出正确抉择的根本前提\"。坚持把人民至上、安全发展理念贯穿于发展的各领域各环节，坚守\"发展决不能以牺牲安全为代价\"这条红线，依靠( )、有力的基础保障和完善的系统治理，充分保障人民在发展中的中心地位，不断在更高质量上推动实现安全发展。","options":[{"key":"A","text":"严格的法治措施"},{"key":"B","text":"有效的体制机制"},{"key":"C","text":"统一的体制机制"},{"key":"D","text":"严密的责任体系"}],"answer":["严格的法治措施","有效的体制机制","严密的责任体系"],"explanation":"正确答案：严格的法治措施、有效的体制机制、严密的责任体系。\n为什么对：题干讲安全发展，靠严格的法治措施提供刚性约束，靠有效的体制机制保证运行顺畅，靠严密的责任体系把领导责任、监管责任、主体责任逐层压实，再配合有力的基础保障和完善的系统治理。\n干扰项分析：\"统一的体制机制\"搭配有误，原文强调体制机制要有效运转，统一并不对应这一位置的表述，其余三项与题干并列成分吻合。\n记忆：安全发展靠三样：法治严格、机制有效、责任严密。\n依据：教材表述。","memoryTip":"安全发展靠三样：法治严格、机制有效、责任严密。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.950Z"},{"id":"question-1794391527950-wkwkkocd9vp","type":"choice","stem":"社会主义核心价值观的确立和践行，能够不断整合社会思想文化和价值观念，不断扩大主流价值观念的影响力，牢牢掌握价值观念领域的( )。","options":[{"key":"A","text":"主动权"},{"key":"B","text":"话语权"},{"key":"C","text":"执法权"},{"key":"D","text":"主导权"}],"answer":["主动权","话语权","主导权"],"explanation":"正确答案：主动权、话语权、主导权。\n为什么对：社会主义核心价值观整合社会思想文化、扩大主流价值观念的影响力，在价值观念领域要同时掌握主动权、话语权和主导权，三者分别对应引领议题、影响表达和确定方向。\n干扰项分析：\"执法权\"是国家机关依法行使的公权力，价值观念领域不存在执法权，把执法权放进这一组搭配属于概念错位。\n记忆：价值观念领域三权：主动权、话语权、主导权。\n依据：《中华人民共和国国家安全法》第二十三条；教材表述。","memoryTip":"价值观念领域要掌握主动权、话语权、主导权。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.950Z"},{"id":"question-1794391527950-gdu6fn6k3kb","type":"choice","stem":"中华文明的统一性，从根本上决定了中华民族各民族文化融为一体、即使遭遇重大挫折也牢固凝聚，决定了( )的共同信念。","options":[{"key":"A","text":"文明不可断"},{"key":"B","text":"国土不可分"},{"key":"C","text":"民族不可散"},{"key":"D","text":"国家不可乱"}],"answer":["文明不可断","国土不可分","民族不可散","国家不可乱"],"explanation":"正确答案：文明不可断、国土不可分、民族不可散、国家不可乱。\n为什么对：中华文明具有突出的统一性，各民族文化融为一体，即使遭遇重大挫折也能牢固凝聚，由此形成四条共同信念，分别指向文明延续、领土完整、民族团结和国家秩序。\n干扰项分析：四条信念都成立，没有错误表述，彼此并列而不互相替代，共同回答统一性决定了什么。\n记忆：文明不断、国土不分、民族不散、国家不乱。\n依据：习近平在文化传承发展座谈会上的讲话。","memoryTip":"文明不断、国土不分、民族不散、国家不乱。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.950Z"},{"id":"question-1794391527950-x87e0yn5x3d","type":"choice","stem":"土地资源安全主要包括( )。","options":[{"key":"A","text":"土地结构安全"},{"key":"B","text":"土地分布安全"},{"key":"C","text":"土地数量安全"},{"key":"D","text":"土地质量安全"}],"answer":["土地结构安全","土地数量安全","土地质量安全"],"explanation":"正确答案：土地结构安全、土地数量安全、土地质量安全。\n为什么对：土地资源安全从三方面衡量，数量上守住耕地和建设用地总量，质量上保持地力和生态功能，结构上保持农用地、建设用地、生态用地比例合理，三者共同支撑粮食安全和生态安全。\n干扰项分析：\"土地分布安全\"不属于这一分类，分布问题可以并入结构层面讨论，单独列为一类缺乏对应的教材表述。\n记忆：土地资源安全看数量、质量、结构三个维度。\n依据：教材表述。","memoryTip":"土地资源安全看数量、质量、结构三个维度。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.950Z"},{"id":"question-1794391527950-41gm4msoxc2","type":"choice","stem":"党的二十大报告提出推进国家安全体系和能力现代化总要求。以下说法正确的是( )。","options":[{"key":"A","text":"要坚持以人民安全为宗旨"},{"key":"B","text":"要坚持以军事、科技、文化、社会安全为保障"},{"key":"C","text":"要坚持以政治安全为根本"},{"key":"D","text":"要坚持以经济安全为依托"}],"answer":["要坚持以人民安全为宗旨","要坚持以军事、科技、文化、社会安全为保障","要坚持以政治安全为根本"],"explanation":"正确答案：要坚持以人民安全为宗旨；要坚持以军事、科技、文化、社会安全为保障；要坚持以政治安全为根本。\n为什么对：总体国家安全观的五大要素中，人民安全是宗旨，政治安全是根本，军事、科技、文化、社会安全是保障，经济安全是基础，促进国际安全是依托，三个选项分别对应宗旨、保障、根本的位置。\n干扰项分析：\"要坚持以经济安全为依托\"把基础与依托的位置弄反，经济安全是基础，充当依托的是促进国际安全。\n记忆：宗旨人民、根本政治、保障军文科社、基础经济、依托国际。\n依据：党的二十大报告；《中华人民共和国国家安全法》第三条。","memoryTip":"宗旨人民、根本政治、保障军文科社、基础经济、依托国际。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.950Z"},{"id":"question-1794391527950-5ug4l5kg856","type":"choice","stem":"2021年10月25日，习近平在中华人民共和国恢复联合国合法席位50周年纪念会议上指出，推动构建人类命运共同体，不是以一种制度代替另一种制度，不是以一种文明代替另一种文明，而是不同社会制度、不同意识形态、不同历史文化、不同发展水平的国家在国际事务中( )，形成共建美好世界的最大公约数。","options":[{"key":"A","text":"权利共享"},{"key":"B","text":"责任共担"},{"key":"C","text":"利益共生"},{"key":"D","text":"风险共担"}],"answer":["权利共享","责任共担","利益共生"],"explanation":"正确答案：权利共享、责任共担、利益共生。\n为什么对：不同社会制度、不同意识形态、不同历史文化、不同发展水平的国家在国际事务中利益共生、权利共享、责任共担，才能形成共建美好世界的最大公约数，三者分别讲利益、权利和责任。\n干扰项分析：\"风险共担\"与这一组固定表述不合，风险问题讲的是共同应对，原文并列的是利益、权利、责任三个方面。\n记忆：国际事务三共：利益共生、权利共享、责任共担。\n依据：习近平在中华人民共和国恢复联合国合法席位50周年纪念会议上的讲话。","memoryTip":"国际事务三共：利益共生、权利共享、责任共担。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.950Z"},{"id":"question-1794391527950-lkpk2nbsmea","type":"choice","stem":"坚持以政治安全为根本，首先要( )。","options":[{"key":"A","text":"坚持多党合作和政治协商、民主监督不动摇"},{"key":"B","text":"坚持宪法确定的中国共产党领导地位不动摇"},{"key":"C","text":"坚持宪法确定的人民民主专政的国体不动摇"},{"key":"D","text":"坚持宪法确定的人民代表大会制度的政体不动摇"}],"answer":["坚持宪法确定的中国共产党领导地位不动摇","坚持宪法确定的人民民主专政的国体不动摇","坚持宪法确定的人民代表大会制度的政体不动摇"],"explanation":"正确答案：坚持宪法确定的中国共产党领导地位不动摇；坚持宪法确定的人民民主专政的国体不动摇；坚持宪法确定的人民代表大会制度的政体不动摇。\n为什么对：政治安全以政权安全和制度安全为核心，宪法确立的领导地位、国体和政体属于根本制度安排，所以首先要守住这三项，守住它们才能谈其他领域的安全。\n干扰项分析：\"坚持多党合作和政治协商、民主监督不动摇\"属于政党制度运行层面的要求，是政治安全的内容之一，但不在首先要守的三项根本之列。\n记忆：守住宪法确立的领导地位、国体、政体。\n依据：教材表述；《中华人民共和国宪法》。","memoryTip":"首先要守三项：领导地位、国体、政体不动摇。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.950Z"},{"id":"question-1794391527950-fqfp5eeisuq","type":"choice","stem":"以下属于海外利益安全范畴的是( )。","options":[{"key":"A","text":"海上战略通道安全"},{"key":"B","text":"人居环境安全"},{"key":"C","text":"海外资产安全"},{"key":"D","text":"海外战略性利益安全"}],"answer":["海上战略通道安全","海外资产安全","海外战略性利益安全"],"explanation":"正确答案：海上战略通道安全、海外资产安全、海外战略性利益安全。\n为什么对：海外利益安全覆盖境外公民、境外资产、战略通道和战略性利益，海上战略通道关系能源资源运输，海外资产和战略性利益关系发展空间，三者都在境外利益范围之内。\n干扰项分析：\"人居环境安全\"属于国内生态和民生领域的安全，指向居民生活环境和健康，与境外利益没有对应关系。\n记忆：海外利益安全涵盖资产、通道和战略性利益。\n依据：教材表述。","memoryTip":"海外利益安全涵盖资产、通道和战略性利益。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.950Z"},{"id":"question-1794391527950-yzfukjokl7","type":"choice","stem":"进入21世纪，\"三股势力\"相互勾结，积极谋划和从事并实施破坏民族团结和祖国统一的阴谋活动，给边疆地区经济社会发展和人民群众生命财产安全造成了重大损失。\"三股势力\"指的是( )。","options":[{"key":"A","text":"暴力恐怖势力"},{"key":"B","text":"民族分裂势力"},{"key":"C","text":"宗教极端势力"},{"key":"D","text":"境外敌对势力"}],"answer":["暴力恐怖势力","民族分裂势力","宗教极端势力"],"explanation":"正确答案：暴力恐怖势力、民族分裂势力、宗教极端势力。\n为什么对：\"三股势力\"是固定提法，指暴力恐怖势力、民族分裂势力、宗教极端势力，三者相互勾结，策划实施破坏民族团结和祖国统一的活动，危害边疆地区经济社会发展和群众生命财产安全。\n干扰项分析：\"境外敌对势力\"是外部因素，属于渗透破坏的来源，不在\"三股势力\"这一固定提法之内。\n记忆：三股势力：暴力恐怖、民族分裂、宗教极端。\n依据：教材表述。","memoryTip":"三股势力：暴力恐怖、民族分裂、宗教极端。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.950Z"},{"id":"question-1794391527950-2b8ul6pta5","type":"choice","stem":"新时代坚持党对国家安全工作的绝对领导，就是要完善( )的国家安全领导体制，目的是要使党对涉及党和国家事业全局的重大工作实施更为有效的统领和协调。","options":[{"key":"A","text":"集中统一"},{"key":"B","text":"高度集中"},{"key":"C","text":"高效权威"},{"key":"D","text":"完全民主"}],"answer":["集中统一","高效权威"],"explanation":"正确答案：集中统一、高效权威。\n为什么对：坚持党对国家安全工作的绝对领导，要靠集中统一、高效权威的国家安全领导体制来保证。集中统一解决统筹协调问题，高效权威解决指挥和执行问题，两者共同支撑党对涉及全局的重大工作实施有效统领。\n干扰项分析：\"高度集中\"只讲权力集中，缺少权威和效率的要求；\"完全民主\"与国家安全领导体制的表述不对应。\n记忆：领导体制八个字：集中统一、高效权威。\n依据：教材表述。","memoryTip":"领导体制八个字：集中统一、高效权威。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.950Z"},{"id":"question-1794391527950-mzoewe961g","type":"choice","stem":"新时代维护和塑造国家安全，必须坚持统筹发展和安全，把维护国家安全贯穿党和国家工作各方面全过程，同经济社会发展一起谋划、一起部署、一体推进，勇于开\"顶风船\"，善于化危为机，努力实现更高质量( )的发展。","options":[{"key":"A","text":"更为安全"},{"key":"B","text":"更可持续"},{"key":"C","text":"更加公平"},{"key":"D","text":"更有效率"}],"answer":["更为安全","更可持续","更加公平","更有效率"],"explanation":"正确答案：更为安全、更可持续、更加公平、更有效率。\n为什么对：统筹发展和安全要求发展在质量、效率、公平、可持续和安全五个维度同时提升，题干已给出更高质量，其余四个并列成分共同构成完整表述，五个维度互相支撑，缺一项都不完整。\n干扰项分析：四个成分都属于这一组并列要求，没有错误表述，彼此并列而不冲突。\n记忆：发展五更：质量、效率、公平、可持续、安全。\n依据：党的二十大报告；教材表述。","memoryTip":"发展五更：质量、效率、公平、可持续、安全。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.950Z"},{"id":"question-1794391527950-2orkkjc35ll","type":"choice","stem":"坚持以人民安全为宗旨，是中国共产党全心全意为人民服务的根本宗旨在国家安全工作领域的集中要求和必然反映，( )。","options":[{"key":"A","text":"体现时代进步要求"},{"key":"B","text":"符合历史前进规律"},{"key":"C","text":"彰显深厚人民情怀"},{"key":"D","text":"是总体国家安全观的精髓所在"}],"answer":["体现时代进步要求","符合历史前进规律","彰显深厚人民情怀","是总体国家安全观的精髓所在"],"explanation":"正确答案：体现时代进步要求；符合历史前进规律；彰显深厚人民情怀；是总体国家安全观的精髓所在。\n为什么对：以人民安全为宗旨，把人民生命安全放在首位，既回应时代对安全的需求，也符合社会发展的客观规律，体现党全心全意为人民服务的根本宗旨。人民安全是总体国家安全观的精髓所在，四句话分别从时代、规律、情怀和理论地位说明同一命题。\n干扰项分析：四个表述都成立，没有需要排除的内容，彼此并列而不互相替代。\n记忆：人民安全四重意义：顺时代、合规律、显情怀、居精髓。\n依据：《总体国家安全观学习纲要》；教材表述。","memoryTip":"人民安全四重意义：顺时代、合规律、显情怀、居精髓。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.950Z"},{"id":"question-1794391527950-ilkl686gbg","type":"choice","stem":"要深入贯彻习近平法治思想，更好发挥法治( )的保障作用，坚持在法治轨道上守牢国家安全阵地。","options":[{"key":"A","text":"利长远"},{"key":"B","text":"稳预期"},{"key":"C","text":"促平衡"},{"key":"D","text":"固根本"}],"answer":["利长远","稳预期","固根本"],"explanation":"正确答案：利长远、稳预期、固根本。\n为什么对：法治的保障作用是固根本、稳预期、利长远。固根本解决制度根基问题，稳预期稳定社会行为预期，利长远维护长期秩序，三者共同支撑在法治轨道上守牢国家安全阵地。\n干扰项分析：\"促平衡\"不属于法治保障作用的固定表述，法治讲的是根本、预期和长远，不承担平衡职能。\n记忆：法治三作用：固根本、稳预期、利长远。\n依据：党的二十大报告；教材表述。","memoryTip":"法治作用六个字：固根本、稳预期、利长远。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.950Z"},{"id":"question-1794391527950-wqpp9c0i1sj","type":"choice","stem":"人民军队为( )提供了有效的战略支撑。","options":[{"key":"A","text":"维护我国海外利益"},{"key":"B","text":"促进世界和平与发展"},{"key":"C","text":"捍卫国家主权、统一、领土完整"},{"key":"D","text":"巩固中国共产党领导和我国社会主义制度"}],"answer":["维护我国海外利益","促进世界和平与发展","捍卫国家主权、统一、领土完整","巩固中国共产党领导和我国社会主义制度"],"explanation":"正确答案：维护我国海外利益；促进世界和平与发展；捍卫国家主权、统一、领土完整；巩固中国共产党领导和我国社会主义制度。\n为什么对：新时代人民军队的使命任务是为四件事提供战略支撑，对内巩固党的领导和社会主义制度，对外捍卫主权、统一、领土完整，向外维护海外利益，面向世界促进和平与发展。\n干扰项分析：四个表述都属于军队承担的战略支撑，没有错误表述，四者层次分明、互相补充。\n记忆：军队四个战略支撑：领导制度、主权领土、海外利益、世界和平。\n依据：教材表述。","memoryTip":"军队四个战略支撑：领导制度、主权领土、海外利益、世界和平。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.950Z"},{"id":"question-1794391527950-agbfay246mg","type":"choice","stem":"中国特色社会主义进入新时代，底线思维与( )、创新思维、法治思维等一起为前瞻性思考、全局性谋划、整体性推进党和国家各项事业提供科学思想方法。","options":[{"key":"A","text":"系统思维"},{"key":"B","text":"辩证思维"},{"key":"C","text":"历史思维"},{"key":"D","text":"战略思维"}],"answer":["系统思维","辩证思维","历史思维","战略思维"],"explanation":"正确答案：系统思维、辩证思维、历史思维、战略思维。\n为什么对：底线思维与战略思维、历史思维、辩证思维、系统思维、创新思维、法治思维并列，共同为前瞻性思考、全局性谋划、整体性推进提供科学思想方法，题干已列创新思维和法治思维，其余四项补齐。\n干扰项分析：四个表述都属于这一组思维方法，没有错误表述，合起来才构成完整的思维体系。\n记忆：七种思维：战略、历史、辩证、系统、创新、法治、底线。\n依据：教材表述。","memoryTip":"七种思维齐备：战略、历史、辩证、系统、创新、法治、底线。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.950Z"},{"id":"question-1794391527950-dv8o3rj0lp5","type":"choice","stem":"党面临的( )仍长期存在，对党的执政地位构成严重风险挑战。","options":[{"key":"A","text":"市场经济考验"},{"key":"B","text":"改革开放考验"},{"key":"C","text":"外部环境考验"},{"key":"D","text":"执政考验"}],"answer":["市场经济考验","改革开放考验","外部环境考验","执政考验"],"explanation":"正确答案：市场经济考验、改革开放考验、外部环境考验、执政考验。\n为什么对：党面临的四大考验是执政考验、改革开放考验、市场经济考验、外部环境考验，这些考验具有长期性和复杂性。执政考验关系执政根基，改革开放和市场经济考验关系治理能力，外部环境考验关系风险应对，四者共同影响党的执政地位。\n干扰项分析：四个表述都是四大考验的内容，没有错误表述，缺少任何一项都不完整。\n记忆：四大考验：执政、改革开放、市场经济、外部环境。\n依据：教材表述。","memoryTip":"四大考验：执政、改革开放、市场经济、外部环境。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.950Z"},{"id":"question-1794391527950-b012d948g45","type":"choice","stem":"以下属于社会安全范畴的是( )。","options":[{"key":"A","text":"公共卫生事件应对"},{"key":"B","text":"社会舆情治理"},{"key":"C","text":"社会治安维护"},{"key":"D","text":"自然灾害和事故灾难应对"}],"answer":["公共卫生事件应对","社会舆情治理","社会治安维护","自然灾害和事故灾难应对"],"explanation":"正确答案：公共卫生事件应对；社会舆情治理；社会治安维护；自然灾害和事故灾难应对。\n为什么对：社会安全涵盖社会治安维护、社会矛盾化解、公共卫生事件应对、社会舆情治理以及自然灾害和事故灾难应对，四个选项分别指向治安、卫生、舆情和灾害事故四个环节，都属于公共安全体系的日常内容。\n干扰项分析：四个表述都属于社会安全的范围，没有错误表述，彼此并列构成社会安全的日常治理内容。\n记忆：社会安全管治安、舆情、公共卫生、灾害事故。\n依据：《中华人民共和国国家安全法》第二十九条；教材表述。","memoryTip":"社会安全管治安、舆情、公共卫生、灾害事故。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.950Z"},{"id":"question-1794391527950-qmio0a27mm","type":"choice","stem":"国际金融危机主要有( )和股市危机等类型。","options":[{"key":"A","text":"银行危机"},{"key":"B","text":"债务危机"},{"key":"C","text":"货币危机"},{"key":"D","text":"信用危机"}],"answer":["银行危机","债务危机","货币危机","信用危机"],"explanation":"正确答案：银行危机、债务危机、货币危机、信用危机。\n为什么对：国际金融危机按表现形态可以分为货币危机、银行危机、债务危机、信用危机以及股市危机，题干已列股市危机，其余四种补齐，分别对应汇市、银行体系、主权债务和信用链条，四类危机还会相互传导。\n干扰项分析：四个表述都是金融危机的常见类型，没有错误表述，与股市危机并列而不重复。\n记忆：金融危机五型：货币、银行、债务、信用、股市。\n依据：教材表述。","memoryTip":"金融危机五型：货币、银行、债务、信用、股市。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.950Z"},{"id":"question-1794391527950-uy7mb88rosg","type":"choice","stem":"要坚定维护国家( )，不断加强重点领域安全能力建设。","options":[{"key":"A","text":"政权安全"},{"key":"B","text":"制度安全"},{"key":"C","text":"总体安全"},{"key":"D","text":"意识形态安全"}],"answer":["政权安全","制度安全","意识形态安全"],"explanation":"正确答案：政权安全、制度安全、意识形态安全。\n为什么对：重点领域安全能力建设中政治安全居于首位，具体就是维护国家政权安全、制度安全和意识形态安全，三者分别对应国家政权性质、中国特色社会主义制度和主流意识形态，构成政治安全的核心内容。\n干扰项分析：\"总体安全\"是总括概念，指各领域安全的整体状态，与政权、制度、意识形态并列会造成层次混乱。\n记忆：重点维护政权安全、制度安全、意识形态安全。\n依据：党的二十大报告；教材表述。","memoryTip":"重点维护政权安全、制度安全、意识形态安全。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.950Z"},{"id":"question-1794391527950-9e144xty54i","type":"choice","stem":"坚持以政治安全为根本，主要是指( )。","options":[{"key":"A","text":"维护中国特色社会主义制度安全"},{"key":"B","text":"维护人民民主专政的国家政权安全"},{"key":"C","text":"维护社会主义意识形态安全"},{"key":"D","text":"维护主权安全"}],"answer":["维护中国特色社会主义制度安全","维护人民民主专政的国家政权安全","维护社会主义意识形态安全"],"explanation":"正确答案：维护中国特色社会主义制度安全；维护人民民主专政的国家政权安全；维护社会主义意识形态安全。\n为什么对：以政治安全为根本，主要指维护政权安全、制度安全和意识形态安全，三者分别对应国家政权性质、中国特色社会主义制度和社会主义意识形态，构成政治安全的核心内容。\n干扰项分析：\"维护主权安全\"属于国家主权和领土完整范畴，是国家安全的重要内容，但不属于政治安全这一概念所界定的三项。\n记忆：政治安全三项：政权、制度、意识形态。\n依据：教材表述；党的二十大报告。","memoryTip":"政治安全三项：政权安全、制度安全、意识形态安全。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.950Z"},{"id":"question-1794391527950-no4fm5apfp8","type":"choice","stem":"以促进国际安全为依托，要推动( )可持续的全球安全观，实现并不断巩固共同安全。","options":[{"key":"A","text":"综合"},{"key":"B","text":"合作"},{"key":"C","text":"共同"},{"key":"D","text":"共享"}],"answer":["综合","合作","共同"],"explanation":"正确答案：综合、合作、共同。\n为什么对：全球安全观讲共同、综合、合作、可持续，共同是目标，综合是领域，合作是路径，可持续是长远要求。题干已给出可持续，其余三项补齐，四者共同支撑共同安全的实现，也回应各国对普遍安全的关切。\n干扰项分析：\"共享\"属于发展理念中的表述，安全观用的是共同、综合、合作、可持续，不与共享并列。\n记忆：全球安全观四要素：共同、综合、合作、可持续。\n依据：教材表述；《全球安全倡议》。","memoryTip":"全球安全观四要素：共同、综合、合作、可持续。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.950Z"},{"id":"question-1794391527950-53ffon47p4k","type":"choice","stem":"坚决维护( )，是维护政治安全的政治基础和根本保障。","options":[{"key":"A","text":"中共中央委员的领导地位"},{"key":"B","text":"党中央权威和集中统一领导"},{"key":"C","text":"《中华人民共和国国家安全法》的指导地位"},{"key":"D","text":"习近平同志党中央的核心、全党的核心地位"}],"answer":["党中央权威和集中统一领导","习近平同志党中央的核心、全党的核心地位"],"explanation":"正确答案：党中央权威和集中统一领导；习近平同志党中央的核心、全党的核心地位。\n为什么对：维护政治安全首先要维护党中央权威和集中统一领导，维护习近平同志党中央的核心、全党的核心地位，前者解决领导体制，后者解决领导核心，两者共同构成政治基础和根本保障。\n干扰项分析：\"中共中央委员的领导地位\"把党的领导缩小为委员个人，表述不成立；\"《中华人民共和国国家安全法》的指导地位\"混淆法律保障与政治基础，法律提供制度保障，本身不构成政治基础。\n记忆：两个维护：党中央权威、领导核心地位。\n依据：教材表述。","memoryTip":"两个维护：党中央权威、领导核心地位。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.950Z"},{"id":"question-1794391527950-j8dho11c6sp","type":"choice","stem":"每个国家都是国际社会共同安全的( )。","options":[{"key":"A","text":"倡导者"},{"key":"B","text":"维护者"},{"key":"C","text":"参与者"},{"key":"D","text":"建设者"}],"answer":["维护者","参与者","建设者"],"explanation":"正确答案：维护者、参与者、建设者。\n为什么对：共同安全要由各国共同参与、共同建设、共同维护，每个国家都是国际社会共同安全的参与者、建设者和维护者，三个角色分别覆盖参与行动、参与建设和维护秩序三个层面。\n干扰项分析：\"倡导者\"指提出倡议的一方，共同安全重在各国共同行动，把每个国家都说成倡导者不符合这一表述。\n记忆：共同安全角色：参与者、建设者、维护者。\n依据：教材表述； 员流动","技术发展"],"explanation":"正确答案：投资便利、贸易繁荣、人员流动、技术发展。\n为什么对：经济全球化推动资本、商品、人员和技术跨境流动，表现为投资便利化、贸易繁荣、人员往来增加和技术扩散，进而带动世界经济快速发展，四个选项对应四种流动，其中投资和贸易是主要载体。\n干扰项分析：四个表述都属于经济全球化带来的结果，没有错误表述，彼此并列而不冲突。\n记忆：全球化带动投资、贸易、人员、技术四个流动。\n依据：教材表述。","memoryTip":"全球化带动投资、贸易、人员、技术四个流动。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.950Z"},{"id":"question-1794391527950-pk88b0qk0ve","type":"choice","stem":"全面提高新时代备战打仗能力，要深化国防和军队改革，建设强大的现代化( )、火箭军和战略支援部队，打造中国特色现代联合作战体系。","options":[{"key":"A","text":"海军"},{"key":"B","text":"信息化部队"},{"key":"C","text":"陆军"},{"key":"D","text":"空军"}],"answer":["海军","陆军","空军"],"explanation":"正确答案：海军、陆军、空军。\n为什么对：深化国防和军队改革，建设强大的现代化陆军、海军、空军、火箭军和战略支援部队，打造中国特色现代联合作战体系，题干已列火箭军和战略支援部队，其余三个军种补齐。\n干扰项分析：\"信息化部队\"描述的是军队信息化建设方向，不属于与火箭军并列的军种名称。\n记忆：现代化军种：陆军、海军、空军、火箭军、战略支援部队。\n依据：教材表述；党的十九大报告。","memoryTip":"现代化军种：陆军、海军、空军、火箭军、战略支援部队。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.950Z"},{"id":"question-1794391527950-ecb8n4emdoa","type":"choice","stem":"世界进入新的动荡变革期，( )等非传统安全威胁持续蔓延。","options":[{"key":"A","text":"难民危机"},{"key":"B","text":"气候变化"},{"key":"C","text":"重大传染性疾病"},{"key":"D","text":"恐怖主义"}],"answer":["难民危机","气候变化","重大传染性疾病","恐怖主义"],"explanation":"正确答案：难民危机、气候变化、重大传染性疾病、恐怖主义。\n为什么对：世界进入新的动荡变革期，难民危机、气候变化、重大传染性疾病、恐怖主义等非传统安全威胁持续蔓延，这些问题跨越国界，单个国家难以独自应对，需要各国协同行动。\n干扰项分析：四个表述都属于非传统安全威胁，没有错误表述，分别涉及人口流动、生态环境、公共卫生和暴力活动。\n记忆：非传统安全威胁：难民危机、气候变化、疫病、恐怖主义。\n依据：教材表述；党的二十大报告。","memoryTip":"非传统安全威胁：难民危机、气候变化、疫病、恐怖主义。","wrongCount":0,"correctCount":0,"bookmarked":false,"review":{"lastAnsweredAt":"","lastWrongAt":"","lastCorrectAt":"","consecutiveCorrect":0,"masteredAt":"","lastSelectedAnswers":[]},"createdAt":"2026-11-11T10:05:27.950Z"},{"id":"question-179439
